        hEst: Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : getHeadingEstimateIndex(sourceSolution),
        desStrAng: Number.isFinite(desStrAng) ? desStrAng : sourceSolution?.desStrAng,
        passCandidate: candidate || null,
        radius: Number(state.arc?.radius) || 0,
        arcLength: Number(state.arc?.length) || 0,
        swtd,
        headingChange,
        headingChangePerDistance,
        s: swtd,
        slew: headingChangePerDistance,
        sl: headingChangePerDistance,
        turnAngle: headingChange,
        strAng: headingChange,
        finalHeading: Number.isFinite(Number(terminalPose?.angle)) ? Number(terminalPose.angle) : 0,
        curveLength: swtd,
        complexCurveLength: swtd,
        steeredWheelTravelDistance: swtd,
        simpleCurveLength: 0,
        totalTravelDistance: swtd,
        spTravelDistance: swtd,
        positionError: Number.isFinite(positionError) ? Math.abs(positionError) : NaN,
        headingError: Number.isFinite(headingError) ? Math.abs(headingError) : NaN,
        headingNormalAngle: Number.isFinite(Number(terminalPose?.angle))
          ? normalizePositiveAngle(Number(terminalPose.angle) + Math.PI / 2)
          : NaN,
        headingNormalError: Number.isFinite(headingNormalError) ? Math.abs(headingNormalError) : NaN,
        pErr: signedPositionError,
        hErr: signedHeadingError,
        headingNormalSatisfied: Number.isFinite(headingNormalError) ? Math.abs(headingNormalError) <= 1e-5 : false,
        vc,
        terminalPose,
        finalPose: terminalPose,
        complexTerminalPose: terminalPose,
        complexVc: vc,
        terminalRadius,
        terminalCoord: terminalPose ? createCoord(terminalPose.x, terminalPose.y, terminalPose.angle, 1, VEHICLE_BODY_LABEL, "#7dd3fc") : null,
        complexCurve: {
          valid: Boolean(terminalPose),
          center: vc ? { ...vc } : null,
          radius: terminalRadius,
          startAngle: 0,
          endAngle: 0,
          turnAngle: headingChange,
          arcLength: swtd,
          pathPoints: terminalPose ? [{
            x: Number(terminalPose.x) || 0,
            y: Number(terminalPose.y) || 0,
            heading: Number(terminalPose.angle) || 0,
            strAng: Number(terminalPose.strAng) || 0
          }] : [],
          terminalPose: terminalPose ? {
            x: Number(terminalPose.x) || 0,
            y: Number(terminalPose.y) || 0,
            angle: Number(terminalPose.angle) || 0,
            strAng: Number(terminalPose.strAng) || 0
          } : null,
          vc,
          bisector: sourceSolution?.bisector || null
        },
        simpleCurve: null,
        pathPoints: terminalPose ? [{
          x: Number(terminalPose.x) || 0,
          y: Number(terminalPose.y) || 0,
          heading: Number(terminalPose.angle) || 0,
          strAng: Number(terminalPose.strAng) || 0
        }] : [],
        bisector,
        steerMax: Number(state.arc?.steerMax) || 0
      };
    }

    function getHeadingEstimateIndex(solution = simpleArcFullSolution) {
      const direct = Number(solution?.hEst ?? solution?.headingEstimateIndex);
      return Number.isFinite(direct) ? Math.max(0, Math.trunc(direct)) : simpleArcHeadingEstimateIndex;
    }

    function applyHeadingEstimateState(solution, hEst = getHeadingEstimateIndex(solution)) {
      if (!solution || typeof solution !== "object") return solution;
      const normalizedHEst = Number.isFinite(Number(hEst)) ? Math.max(0, Math.trunc(Number(hEst))) : 0;
      solution.hEst = normalizedHEst;
      solution.headingEstimateIndex = normalizedHEst;
      solution.desStrAngEstimateIndex = normalizedHEst;
      solution.outerLoopPass = normalizedHEst;
      if (Array.isArray(solution.passes)) {
        solution.passes = solution.passes.map((pass) => ({
          ...(pass || {}),
          hEst: Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : normalizedHEst,
          desStrAngEstimateIndex: Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : normalizedHEst,
          outerLoopPass: Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : normalizedHEst
        }));
      }
      return solution;
    }

    function applyPassErrors(passes, solution) {
      const bisector = solution?.bisector || getSimpleArcBisectorGeometry(getSimpleArcGeometry());
      let previousPerr = NaN;
      let previousHEst = NaN;
      if (!Array.isArray(passes)) {
        return [];
      }

      const normalizedPasses = passes.map((pass, index) => {
        const candidate = pickPassCandidate(pass);
        const terminalPose = pass?.terminalPose || candidate?.Path?.TerminalPose || candidate?.result?.terminalPose || candidate?.terminalPose || solution?.terminalPose || solution?.finalPose || null;
        const vc = pass?.vc || pass?.complexVc || candidate?.vc || candidate?.complexVc || solution?.vc || solution?.complexVc || (terminalPose ? getSimpleArcVC(terminalPose) : null);
        const signedPositionError = Number.isFinite(Number(pass?.pErr))
          ? Number(pass.pErr)
          : getSignedBisectorDistance(vc, bisector);
        const signedHeadingError = Number.isFinite(Number(pass?.hErr))
          ? Number(pass.hErr)
          : getSignedHeadingNormalError(terminalPose, bisector);
        const hEst = Number(pass?.hEst);
        const resetDelta = index === 0
          || !Number.isFinite(previousPerr)
          || (Number.isFinite(hEst) && Number.isFinite(previousHEst) && hEst !== previousHEst);
        const deltaPositionError = resetDelta
          ? signedPositionError
          : previousPerr - signedPositionError;
        previousPerr = signedPositionError;
        previousHEst = hEst;
        return {
          ...(pass || {}),
          pErr: signedPositionError,
          dPErr: deltaPositionError,
          hErr: signedHeadingError
        };
      });

      const finalHeadingErrorByHEst = new Map();
      const finalPassIndexByHEst = new Map();
      const hEstOrder = [];
      normalizedPasses.forEach((pass, index) => {
        const hEst = Number(pass?.hEst);
        if (!Number.isFinite(hEst)) {
          return;
        }
        if (!finalHeadingErrorByHEst.has(hEst)) {
          hEstOrder.push(hEst);
        }
        finalHeadingErrorByHEst.set(hEst, Number(pass?.hErr));
        finalPassIndexByHEst.set(hEst, index);
      });

      const deltaHeadingErrorByHEst = new Map();
      let previousFinalHerr = NaN;
      hEstOrder.forEach((hEst) => {
        const finalHerr = finalHeadingErrorByHEst.get(hEst);
        const deltaHeadingError = !Number.isFinite(previousFinalHerr)
          ? finalHerr
          : previousFinalHerr - finalHerr;
        deltaHeadingErrorByHEst.set(hEst, deltaHeadingError);
        previousFinalHerr = finalHerr;
      });

      return normalizedPasses.map((pass, index) => {
        const hEst = Number(pass?.hEst);
        if (finalPassIndexByHEst.get(hEst) !== index) {
          return pass;
        }
        return {
          ...pass,
          dHErr: deltaHeadingErrorByHEst.get(hEst) ?? Number(pass?.hErr)
        };
      });
    }

    function getPassSwtd(pass) {
      return limitSwtdMinimum(pass?.swtd ?? pass?.pathCenter);
    }

    function getPassPerr(pass) {
      return Number(pass?.pErr);
    }

    function persistPassLoopExit(solution, exit = evaluatePassLoopExit(solution)) {
      if (!solution || typeof solution !== "object" || !exit || !Array.isArray(solution.passes)) {
        return exit;
      }
      const exitPass = Number(exit.pass);
      const exitHEst = getHeadingEstimateIndex(solution);
      solution.passes = solution.passes.map((pass, index) => {
        const passIndex = Number.isFinite(Number(pass?.pass)) ? Number(pass.pass) : index;
        const passHEst = Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : exitHEst;
        if (passHEst !== exitHEst || passIndex !== exitPass) {
          return pass;
        }
        return {
          ...(pass || {}),
          exitCode: exit.code,
          exitReason: exit.reason
        };
      });
      return exit;
    }

    function multiplyPolynomialByLinear(coefficients, root) {
      const result = Array(coefficients.length + 1).fill(0);
      coefficients.forEach((coefficient, index) => {
        result[index] -= coefficient * root;
        result[index + 1] += coefficient;
      });
      return result;
    }

    function interpolatePolynomialCoefficients(points) {
      const coefficients = Array(points.length).fill(0);
      points.forEach((point, index) => {
        let denominator = 1;
        let basis = [1];
        points.forEach((otherPoint, otherIndex) => {
          if (otherIndex === index) return;
          denominator *= point.x - otherPoint.x;
          basis = multiplyPolynomialByLinear(basis, otherPoint.x);
        });
        const scale = point.y / denominator;
        basis.forEach((coefficient, coefficientIndex) => {
          coefficients[coefficientIndex] += coefficient * scale;
        });
      });
      return coefficients;
    }

    function solveRealPolynomialRoots(coefficients) {
      const epsilon = 1e-12;
      const trimmed = [...coefficients];
      while (trimmed.length > 1 && Math.abs(trimmed[trimmed.length - 1]) <= epsilon) {
        trimmed.pop();
      }
      if (trimmed.length === 2) {
        const [constant, linear] = trimmed;
        return Math.abs(linear) > epsilon ? [-constant / linear] : [];
      }
      if (trimmed.length === 3) {
        const [constant, linear, quadratic] = trimmed;
        if (Math.abs(quadratic) <= epsilon) {
          return solveRealPolynomialRoots([constant, linear]);
        }
        const discriminant = (linear * linear) - (4 * quadratic * constant);
        if (discriminant < -epsilon) return [];
        if (Math.abs(discriminant) <= epsilon) return [-linear / (2 * quadratic)];
        const rootSpread = Math.sqrt(discriminant);
        return [
          (-linear - rootSpread) / (2 * quadratic),
          (-linear + rootSpread) / (2 * quadratic)
        ];
      }
      if (trimmed.length === 4) {
        const [constant, linear, quadratic, cubic] = trimmed;
        if (Math.abs(cubic) <= epsilon) {
          return solveRealPolynomialRoots([constant, linear, quadratic]);
        }
        const a = quadratic / cubic;
        const b = linear / cubic;
        const c = constant / cubic;
        const p = b - (a * a / 3);
        const q = (2 * a * a * a / 27) - (a * b / 3) + c;
        const discriminant = (q * q / 4) + (p * p * p / 27);
        if (discriminant > epsilon) {
          const rootSpread = Math.sqrt(discriminant);
          return [
            Math.cbrt((-q / 2) + rootSpread) + Math.cbrt((-q / 2) - rootSpread) - (a / 3)
          ];
        }
        if (Math.abs(discriminant) <= epsilon) {
          const u = Math.cbrt(-q / 2);
          return [
            (2 * u) - (a / 3),
            (-u) - (a / 3)
          ];
        }
        const radius = 2 * Math.sqrt(-p / 3);
        const acosInput = Math.max(-1, Math.min(1, (-q / 2) / Math.sqrt(-(p * p * p) / 27)));
        const angle = Math.acos(acosInput);
        return [0, 1, 2].map((index) =>
          (radius * Math.cos((angle + (2 * Math.PI * index)) / 3)) - (a / 3)
        );
      }
      return [];
    }

    function choosePositiveRootNear(roots, anchor) {
      const validRoots = roots
        .filter((root) => Number.isFinite(root) && root >= SWTD_MIN)
        .sort((left, right) => Math.abs(left - anchor) - Math.abs(right - anchor));
      return validRoots.length ? validRoots[0] : NaN;
    }

    function estimatePassSwtd(passIndex, passes, solution) {
      const previousPass = passIndex > 0 ? passes[passIndex - 1] : null;
      const previousSwtd = limitSwtdMinimum(previousPass?.swtd ?? previousPass?.pathCenter ?? solution?.swtd ?? state.ui?.swtd);
      if (passIndex === 0) {
        return previousSwtd;
      }
      if (passIndex === 1) {
        const basePerr = Number(previousPass?.pErr ?? solution?.pErr ?? 0) || 0;
        if (basePerr > 0) {
          return Math.max(SWTD_MIN, previousSwtd * 0.9);
        }
        if (basePerr < 0) {
          return Math.max(SWTD_MIN, previousSwtd * 1.1);
        }
      }
      if (passIndex === 2) {
        const firstPass = passes[0] || null;
        const secondPass = passes[1] || null;
        const firstSwtd = getPassSwtd(firstPass);
        const secondSwtd = getPassSwtd(secondPass);
        const firstPerr = Number(firstPass?.pErr);
        const secondPerr = Number(secondPass?.pErr);
        const deltaError = secondPerr - firstPerr;
        if (
          Number.isFinite(firstSwtd)
          && Number.isFinite(secondSwtd)
          && Number.isFinite(firstPerr)
          && Number.isFinite(secondPerr)
          && Math.abs(deltaError) > 1e-12
        ) {
          const estimatedSwtd = secondSwtd - (secondPerr * (secondSwtd - firstSwtd) / deltaError);
          if (Number.isFinite(estimatedSwtd)) {
            return Math.max(SWTD_MIN, estimatedSwtd);
          }
        }
      }
      if (passIndex === 3) {
        const firstPass = passes[0] || null;
        const secondPass = passes[1] || null;
        const thirdPass = passes[2] || null;
        const x0 = getPassSwtd(firstPass);
        const y0 = Number(firstPass?.pErr);
        const x1 = getPassSwtd(secondPass);
        const y1 = Number(secondPass?.pErr);
        const x2 = getPassSwtd(thirdPass);
        const y2 = Number(thirdPass?.pErr);
        if (
          Number.isFinite(x0)
          && Number.isFinite(y0)
          && Number.isFinite(x1)
          && Number.isFinite(y1)
          && Number.isFinite(x2)
          && Number.isFinite(y2)
          && Math.abs(x0 - x1) > 1e-12
          && Math.abs(x0 - x2) > 1e-12
          && Math.abs(x1 - x2) > 1e-12
        ) {
          const d0 = (x0 - x1) * (x0 - x2);
          const d1 = (x1 - x0) * (x1 - x2);
          const d2 = (x2 - x0) * (x2 - x1);
          const a = (y0 / d0) + (y1 / d1) + (y2 / d2);
          const b = -(y0 * (x1 + x2) / d0) - (y1 * (x0 + x2) / d1) - (y2 * (x0 + x1) / d2);
          const c = (y0 * x1 * x2 / d0) + (y1 * x0 * x2 / d1) + (y2 * x0 * x1 / d2);
          const candidates = [];
          if (Math.abs(a) > 1e-12) {
            const discriminant = (b * b) - (4 * a * c);
            if (discriminant >= 0) {
              const rootSpread = Math.sqrt(discriminant);
              candidates.push((-b - rootSpread) / (2 * a));
              candidates.push((-b + rootSpread) / (2 * a));
            }
          } else if (Math.abs(b) > 1e-12) {
            candidates.push(-c / b);
          }
          const validCandidates = candidates
            .filter((candidate) => Number.isFinite(candidate) && candidate >= SWTD_MIN)
            .sort((left, right) => Math.abs(left - x2) - Math.abs(right - x2));
          if (validCandidates.length) {
            return validCandidates[0];
          }
        }
      }
      if (passIndex >= 4) {
        const sourcePasses = passes.slice(passIndex - 4, passIndex);
        const points = sourcePasses.map((pass) => ({
          x: getPassSwtd(pass),
          y: getPassPerr(pass)
        }));
        const hasValidPoints = points.every((point) =>
          Number.isFinite(point.x) && Number.isFinite(point.y)
        );
        const hasDistinctSwtd = points.every((point, index) =>
          points.slice(index + 1).every((otherPoint) => Math.abs(point.x - otherPoint.x) > 1e-12)
        );
        if (hasValidPoints && hasDistinctSwtd) {
          const coefficients = interpolatePolynomialCoefficients(points);
          const root = choosePositiveRootNear(solveRealPolynomialRoots(coefficients), points[points.length - 1].x);
          if (Number.isFinite(root)) {
            return root;
          }
        }
      }
      return previousSwtd;
    }

    function buildSinglePassRenderSolution(solution, passIndex = -1) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) {
        return solution;
      }
      const selectedIndex = Math.max(0, Math.min(Number(passIndex) || 0, passes.length - 1));
      const selectedPass = passes[selectedIndex] || passes[passes.length - 1];
      const renderSwtd = limitSwtdMinimum(selectedPass?.swtd ?? selectedPass?.pathCenter ?? solution?.swtd);
      const renderDesStrAng = Number(selectedPass?.desStrAng ?? solution?.desStrAng);
      const renderSlewDerived = deriveHeadingRateFromDesStrAng(renderDesStrAng, renderSwtd);
      const renderSlew = Number.isFinite(renderSlewDerived)
        ? renderSlewDerived
        : (Number(selectedPass?.hRt ?? selectedPass?.headingChangePerDistance ?? solution?.headingChangePerDistance ?? solution?.slew ?? solution?.sl ?? 0) || 0);
      const selectedHeadingChange = Number(selectedPass?.headingChange ?? selectedPass?.turnAngle);
      const solutionHeadingChange = getRenderHeadingChange(solution);
      const renderHeadingChange = Number.isFinite(selectedHeadingChange)
        ? selectedHeadingChange
        : (Number.isFinite(renderSlew) && Number.isFinite(renderSwtd)
          ? renderSlew * renderSwtd
          : solutionHeadingChange);
      const showShadows = Boolean(solution?.showShadows) && selectedIndex === passes.length - 1;
      return {
        ...(solution || {}),
        swtd: renderSwtd,
        headingChange: renderHeadingChange,
        headingChangePerDistance: renderSlew,
        s: renderSwtd,
        slew: renderSlew,
        sl: renderSlew,
        desStrAng: Number.isFinite(renderDesStrAng) ? renderDesStrAng : solution?.desStrAng,
        turnAngle: renderHeadingChange,
        strAng: renderHeadingChange,
        pErr: selectedPass?.pErr,
        dPErr: selectedPass?.dPErr,
        hErr: selectedPass?.hErr,
        dHErr: selectedPass?.dHErr,
        passes: [selectedPass],
        showShadows
      };
    }

    function getRenderHeadingChange(solution) {
      const direct = Number(solution?.turnAngle ?? solution?.headingChange ?? solution?.strAng);
      if (Number.isFinite(direct)) {
        return direct;
      }
      const distance = Number(solution?.s ?? solution?.swtd ?? solution?.pathCenter ?? solution?.curveLength);
      const rate = Number(solution?.headingChangePerDistance ?? solution?.slew ?? solution?.sl);
      if (Number.isFinite(distance) && Number.isFinite(rate)) {
        return rate * distance;
      }
      return 0;
    }

    function getHeadingDesStrAngSeed(solution = simpleArcFullSolution) {
      const latestPass = getLatestLoggedPass(solution);
      const direct = Number(
        latestPass?.desStrAng
        ?? solution?.desStrAng
        ?? state.arc?.desStrAng
      );
      return boundDesStrAngSeed(Number.isFinite(direct) ? direct : getInitialDesStrAngSeed());
    }

    function getHeadingRateSeed(solution = simpleArcFullSolution, swtd = state.ui?.swtd) {
      const desStrAng = getHeadingDesStrAngSeed(solution);
      const derived = deriveHeadingRateFromDesStrAng(desStrAng, swtd);
      if (Number.isFinite(derived)) {
        return derived;
      }
      const latestPass = getLatestLoggedPass(solution);
      const direct = Number(
        latestPass?.hRt
        ?? latestPass?.headingChangePerDistance
        ?? solution?.headingChangePerDistance
        ?? solution?.slew
        ?? solution?.sl
        ?? state.arc?.slew
      );
      return normalizeSlew(Number.isFinite(direct) ? direct : getInitialHrtSeed(getSimpleArcGeometry(), swtd));
    }

    function solvePassWithEstimatedSwtd(passIndex, passes, solution, desStrAngSeed = getHeadingDesStrAngSeed(solution)) {
      desStrAngSeed = boundDesStrAngSeed(desStrAngSeed);
      const estimatedSwtd = limitSwtdMinimum(estimatePassSwtd(passIndex, passes, solution));
      const priorSwtd = Number(state.ui?.swtd) || 0;
      const priorSlew = Number(state.arc?.slew) || 0;
      const priorDesStrAng = Number(state.arc?.desStrAng) || 0;
      const hrtSeed = deriveHeadingRateFromDesStrAng(desStrAngSeed, estimatedSwtd);
      try {
        state.ui.swtd = estimatedSwtd;
        state.arc.desStrAng = desStrAngSeed;
        if (Number.isFinite(hrtSeed)) {
          state.arc.slew = hrtSeed;
        }
        const solved = recalculateVehicleSolution({
          persist: false,
          render: false,
          commitDisplay: false,
          seedSwtd: estimatedSwtd,
          seedDesStrAng: desStrAngSeed
        });
        const signedPositionError = getSignedBisectorDistance(solved?.vc || solved?.complexVc, solved?.bisector);
        const signedHeadingError = getSignedHeadingNormalError(solved?.terminalPose || solved?.finalPose, solved?.bisector);
        return {
          solved,
          estimatedSwtd,
          signedPositionError,
          signedHeadingError
        };
      } finally {
        state.ui.swtd = priorSwtd;
        state.arc.slew = priorSlew;
        state.arc.desStrAng = priorDesStrAng;
      }
    }

    function evaluatePassLoopExit(solution) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) return null;
      const latestPass = passes[passes.length - 1] || null;
      const hEst = Number.isFinite(Number(latestPass?.hEst)) ? Number(latestPass.hEst) : getHeadingEstimateIndex(solution);
      const currentPasses = passes.filter((pass) => {
        const passHEst = Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : hEst;
        return passHEst === hEst;
      });
      const latestPerr = Number(latestPass?.pErr);
      if (Number.isFinite(latestPerr) && Math.abs(latestPerr) < ESTIMATOR_POSITION_ERROR_THRESHOLD) {
        const terminalPose = latestPass?.terminalPose || latestPass?.finalPose || solution?.terminalPose || solution?.finalPose || null;
        const rpAngle = Number(terminalPose?.angle);
        const bisectorAngle = Number(solution?.bisector?.bisectorAngle);
        if (Number.isFinite(rpAngle) && Number.isFinite(bisectorAngle) && rpAngle > bisectorAngle) {
          return {
            code: 3,
            reason: "positionErrorThresholdRpAnglePastBisector",
            pass: Number.isFinite(Number(latestPass?.pass)) ? Number(latestPass.pass) : passes.length - 1,
            pErr: latestPerr,
            rpAngle,
            bisectorAngle
          };
        }
        return {
          code: 0,
          reason: "positionErrorThreshold",
          pass: Number.isFinite(Number(latestPass?.pass)) ? Number(latestPass.pass) : passes.length - 1,
          pErr: latestPerr
        };
      }
      const latestDeltaPerr = Number(latestPass?.dPErr);
      if (Number.isFinite(latestDeltaPerr) && Math.abs(latestDeltaPerr) < ESTIMATOR_POSITION_DELTA_ERROR_THRESHOLD) {
        return {
          code: 2,
          reason: "deltaPositionErrorThreshold",
          pass: Number.isFinite(Number(latestPass?.pass)) ? Number(latestPass.pass) : passes.length - 1,
          pErr: latestPerr,
          dPErr: latestDeltaPerr
        };
      }
      if (currentPasses.length >= 8) {
        return {
          code: 1,
          reason: "maxPassCount",
          pass: Number.isFinite(Number(latestPass?.pass)) ? Number(latestPass.pass) : passes.length - 1,
          passCount: currentPasses.length
        };
      }
      return null;
    }

    function getLatestLoggedPass(solution = simpleArcFullSolution) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      return passes.length ? passes[passes.length - 1] : null;
    }

    function getSeedLookupEntryKey(stepIndex, rawPsiDegrees = seedLookupState.rawPsiDegrees) {
      return `${stepIndex}|${Number(rawPsiDegrees).toFixed(6)}|${SEED_LOOKUP_STEER_MAX_DEGREES}`;
    }

    function getSeedLookupCellKey(radiusIndex, stepIndex, rawPsiDegrees = seedLookupState.rawPsiDegrees) {
      return `${Math.max(0, Math.trunc(Number(radiusIndex) || 0))}|${Math.max(0, Math.trunc(Number(stepIndex) || 0))}|${Number(rawPsiDegrees).toFixed(6)}|${SEED_LOOKUP_STEER_MAX_DEGREES}`;
    }

    function getSeedLookupRadiusIndex(radius) {
      const targetRadius = Math.abs(Number(radius) || 0);
      let nearestIndex = 0;
      let nearestDistance = Infinity;
      for (let index = 0; index < SEED_SWEEP_RADIUS_AXIS.length; index += 1) {
        const distance = Math.abs(SEED_SWEEP_RADIUS_AXIS[index] - targetRadius);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      }
      return nearestIndex;
    }

    function getSeedLookupRadiusValue(radius) {
      return SEED_SWEEP_RADIUS_AXIS[getSeedLookupRadiusIndex(radius)] ?? SEED_LOOKUP_FIXED_RADIUS;
    }

    function getBoundingAxisIndices(axis, value) {
      const values = Array.isArray(axis) ? axis : [];
      if (!values.length) {
        return { lowerIndex: 0, upperIndex: 0, mix: 0 };
      }
      const target = Number(value);
      if (!Number.isFinite(target)) {
        return { lowerIndex: 0, upperIndex: 0, mix: 0 };
      }
      if (target <= values[0]) {
        return { lowerIndex: 0, upperIndex: 0, mix: 0 };
      }
      const lastIndex = values.length - 1;
      if (target >= values[lastIndex]) {
        return { lowerIndex: lastIndex, upperIndex: lastIndex, mix: 0 };
      }
      for (let index = 0; index < lastIndex; index += 1) {
        const left = values[index];
        const right = values[index + 1];
        if (target >= left && target <= right) {
          const span = right - left;
          const mix = span > 1e-12 ? (target - left) / span : 0;
          return { lowerIndex: index, upperIndex: index + 1, mix: clamp(mix, 0, 1) };
        }
      }
      return { lowerIndex: lastIndex, upperIndex: lastIndex, mix: 0 };
    }

    function getFinalSeedLookupPass(solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) return null;
      return passes[passes.length - 1] || null;
    }

    function storeCurrentSeedLookupEntry(solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution) {
      if (!SEED_LOOKUP_BOOTSTRAP_MODE) return null;
      const pass = getFinalSeedLookupPass(solution);
      if (!pass) return null;
      const swtd = Number(pass?.swtd ?? pass?.pathCenter ?? solution?.swtd);
      const desStrAng = Number(pass?.desStrAng ?? solution?.desStrAng);
      if (!Number.isFinite(swtd) || !Number.isFinite(desStrAng)) return null;
      const radius = Number(state.arc?.radius);
      const radiusIndex = getSeedLookupRadiusIndex(radius);
      const entry = {
        stepIndex: seedLookupState.stepIndex,
        radiusIndex,
        radius,
        radiusAxisValue: SEED_SWEEP_RADIUS_AXIS[radiusIndex] ?? radius,
        rawPsiDegrees: seedLookupState.rawPsiDegrees,
        steerMaxDegrees: SEED_LOOKUP_STEER_MAX_DEGREES,
        swtd: limitSwtdMinimum(swtd),
        desStrAng: boundDesStrAngSeed(desStrAng),
        hErr: Number(pass?.hErr),
        pErr: Number(pass?.pErr),
        aExitCode: pass?.aExitCode ?? solution?.desStrAngExitCode ?? null,
        pExitCode: pass?.exitCode ?? solution?.exitCode ?? null
      };
      seedLookupState.entries.set(getSeedLookupCellKey(radiusIndex, seedLookupState.stepIndex, seedLookupState.rawPsiDegrees), entry);
      refreshStarterSeedArray();
      return entry;
    }

    function findNearestSeedLookupEntry(stepIndex, radiusIndex = null) {
      let nearest = null;
      let nearestDistance = Infinity;
      seedLookupState.entries.forEach((entry) => {
        if (Number.isFinite(Number(radiusIndex)) && Number(entry.radiusIndex) !== Number(radiusIndex)) {
          return;
        }
        const distance = Math.abs(Number(entry.stepIndex) - stepIndex);
        if (distance < nearestDistance) {
          nearest = entry;
          nearestDistance = distance;
        }
      });
      return nearest;
    }

    function getSeedLookupEntriesSorted() {
      return Array.from(seedLookupState.entries.values())
        .filter((entry) => Number.isFinite(Number(entry?.stepIndex)) && Number.isFinite(Number(entry?.radiusIndex)))
        .sort((left, right) => (Number(left.radiusIndex) - Number(right.radiusIndex)) || (Number(left.stepIndex) - Number(right.stepIndex)));
    }

    function getSeedLookupEntriesForRadiusIndex(radiusIndex) {
      return getSeedLookupEntriesSorted().filter((entry) => Number(entry.radiusIndex) === Number(radiusIndex));
    }

    function isStableSeedLookupEntry(entry) {
      return Number(entry?.pExitCode) === 3 && Number(entry?.aExitCode) === 0;
    }

    function fitRawPsiTrendSeed(entries, targetRawPsiDegrees, key) {
      const points = entries
        .map((entry) => ({
          x: Number(entry?.rawPsiDegrees),
          y: Number(entry?.[key])
        }))
        .filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y));

      if (!points.length) {
        return NaN;
      }
      if (points.length === 1) {
        return points[0].y;
      }

      let sumX = 0;
      let sumY = 0;
      let sumXX = 0;
      let sumXY = 0;
      points.forEach((point) => {
        sumX += point.x;
        sumY += point.y;
        sumXX += point.x * point.x;
        sumXY += point.x * point.y;
      });
      const count = points.length;
      const denominator = (count * sumXX) - (sumX * sumX);
      if (Math.abs(denominator) > 1e-12) {
        const slope = ((count * sumXY) - (sumX * sumY)) / denominator;
        const intercept = (sumY - (slope * sumX)) / count;
        const estimated = intercept + (slope * targetRawPsiDegrees);
        return Number.isFinite(estimated) ? estimated : points[points.length - 1].y;
      }

      const first = points[0];
      const last = points[points.length - 1];
      const deltaX = last.x - first.x;
      if (Math.abs(deltaX) > 1e-12) {
        const estimated = last.y + (((last.y - first.y) / deltaX) * (targetRawPsiDegrees - last.x));
        return Number.isFinite(estimated) ? estimated : last.y;
      }
      return last.y;
    }

    function estimateSeedLookupEntryForStep(stepIndex, rawPsiDegrees) {
      const fallback = {
        swtd: SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd,
        desStrAng: SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng
      };
      const numericStepIndex = Math.max(0, Math.trunc(Number(stepIndex) || 0));
      const targetRawPsiDegrees = Number.isFinite(Number(rawPsiDegrees))
        ? Number(rawPsiDegrees)
        : Number(SEED_LOOKUP_RAW_PSI_AXIS[numericStepIndex] ?? SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees);
      const activeRadiusIndex = Number.isFinite(Number(seedLookupState.radiusIndex))
        ? Number(seedLookupState.radiusIndex)
        : getSeedLookupRadiusIndex(SEED_LOOKUP_FIXED_RADIUS);
      const priorEntries = getSeedLookupEntriesForRadiusIndex(activeRadiusIndex)
        .filter((entry) => Number(entry.stepIndex) < numericStepIndex);
      const stableEntries = priorEntries.filter(isStableSeedLookupEntry);
      const history = (stableEntries.length >= 2 ? stableEntries : priorEntries)
        .filter((entry) => Number.isFinite(Number(entry?.rawPsiDegrees)) && Number.isFinite(Number(entry?.swtd)) && Number.isFinite(Number(entry?.desStrAng)));
      const recentHistory = history.slice(-4);

      if (recentHistory.length >= 2) {
        const predictedSwtd = fitRawPsiTrendSeed(recentHistory, targetRawPsiDegrees, "swtd");
        const predictedDesStrAng = fitRawPsiTrendSeed(recentHistory, targetRawPsiDegrees, "desStrAng");
        if (Number.isFinite(predictedSwtd) && Number.isFinite(predictedDesStrAng)) {
          return {
            swtd: limitSwtdMinimum(predictedSwtd),
            desStrAng: boundDesStrAngSeed(predictedDesStrAng, degToRad(SEED_LOOKUP_STEER_MAX_DEGREES))
          };
        }
      }

      if (!recentHistory.length) {
        return getPriorProfileStarterSeed(
          targetRawPsiDegrees,
          SEED_LOOKUP_BOOTSTRAP_ENTRY,
          SEED_SWEEP_RADIUS_AXIS[activeRadiusIndex] ?? SEED_LOOKUP_FIXED_RADIUS
        );
      }

      if (recentHistory.length === 1) {
        const only = recentHistory[0];
        return {
          swtd: limitSwtdMinimum(Number(only.swtd)),
          desStrAng: boundDesStrAngSeed(Number(only.desStrAng), degToRad(SEED_LOOKUP_STEER_MAX_DEGREES))
        };
      }

      return {
        swtd: limitSwtdMinimum(fallback.swtd),
        desStrAng: boundDesStrAngSeed(fallback.desStrAng, degToRad(SEED_LOOKUP_STEER_MAX_DEGREES))
      };
    }

    function getStarterSeedHistoryEntries(stepIndex) {
      const entries = getSeedLookupEntriesSorted();
      return entries.filter((entry) => Number(entry.stepIndex) < stepIndex);
    }

    function clampStarterSeedValues(seed, previousSeed, steerMaxRad = degToRad(SEED_LOOKUP_STEER_MAX_DEGREES)) {
      const priorSwtd = Number(previousSeed?.swtd);
      const priorDesStrAng = Number(previousSeed?.desStrAng);
      const targetSwtd = Number(seed?.swtd);
      const targetDesStrAng = Number(seed?.desStrAng);
      const swtdFloor = Number.isFinite(priorSwtd) && priorSwtd > 0 ? priorSwtd * 0.7 : SWTD_MIN;
      const swtdCeil = Number.isFinite(priorSwtd) && priorSwtd > 0 ? priorSwtd * 1.4 : Number.MAX_SAFE_INTEGER;
      const desStrAngDelta = Number.isFinite(priorDesStrAng)
        ? Math.max(degToRad(5), Math.abs(priorDesStrAng) * 0.25)
        : Number.MAX_SAFE_INTEGER;
      const swtd = Number.isFinite(targetSwtd) ? limitSwtdMinimum(clamp(targetSwtd, swtdFloor, swtdCeil)) : limitSwtdMinimum(priorSwtd);
      const boundedDesStrAng = Number.isFinite(targetDesStrAng)
        ? clamp(targetDesStrAng, Number.isFinite(priorDesStrAng) ? priorDesStrAng - desStrAngDelta : -steerMaxRad, Number.isFinite(priorDesStrAng) ? priorDesStrAng + desStrAngDelta : steerMaxRad)
        : priorDesStrAng;
      return {
        ...(seed && typeof seed === "object" ? seed : null),
        swtd,
        desStrAng: boundDesStrAngSeed(Number.isFinite(boundedDesStrAng) ? boundedDesStrAng : SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng, steerMaxRad)
      };
    }

    function getPriorProfileStarterSeed(rawPsiDegrees, previousSeed = SEED_LOOKUP_BOOTSTRAP_ENTRY, radiusValue = SEED_LOOKUP_FIXED_RADIUS) {
      const spanDegrees = Math.max(1e-9, SEED_LOOKUP_RAW_PSI_MAX_DEGREES - SEED_LOOKUP_RAW_PSI_MIN_DEGREES);
      const normalized = clamp((SEED_LOOKUP_RAW_PSI_MAX_DEGREES - Number(rawPsiDegrees)) / spanDegrees, 0, 1);
      const eased = normalized * normalized * (3 - (2 * normalized));
      const radiusMagnitude = Math.max(SWTD_MIN, Math.abs(Number(radiusValue) || 0));
      const radiusScale = clamp(Math.pow(radiusMagnitude / SEED_LOOKUP_FIXED_RADIUS, 0.35), 0.5, 3);
      const desScale = clamp(0.92 + ((radiusScale - 1) * 0.06), 0.84, 1.08);
      const swtdTerminal = SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd * 0.93 * radiusScale;
      const desStrAngTerminal = SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng * desScale;
      return clampStarterSeedValues(
        {
          kind: "swtd",
          swtd: SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd + ((swtdTerminal - SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd) * eased),
          desStrAng: SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng + ((desStrAngTerminal - SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng) * eased)
        },
        previousSeed,
        degToRad(SEED_LOOKUP_STEER_MAX_DEGREES)
      );
    }

    function blendStarterSeedPredictions(predictions, fallbackSeed, previousSeed, steerMaxRad) {
      const usable = predictions.filter((prediction) => prediction && Number.isFinite(Number(prediction.value)));
      if (!usable.length) {
        return clampStarterSeedValues(fallbackSeed, previousSeed, steerMaxRad);
      }
      let weightedSum = 0;
      let weightSum = 0;
      usable.forEach((prediction) => {
        const weight = Math.max(0, Number(prediction.weight) || 0);
        if (!weight) return;
        weightedSum += Number(prediction.value) * weight;
        weightSum += weight;
      });
      const blended = weightSum > 0 ? weightedSum / weightSum : usable[0].value;
      return clampStarterSeedValues({ ...fallbackSeed, [fallbackSeed.kind]: blended }, previousSeed, steerMaxRad);
    }

    function buildStarterSeedEntry(stepIndex, rawPsiDegrees, radiusValue, radiusIndex, historyEntries, previousSeed) {
      const fixedRadiusIndex = getSeedLookupRadiusIndex(SEED_LOOKUP_FIXED_RADIUS);
      if (radiusIndex === fixedRadiusIndex && Math.abs(Number(rawPsiDegrees) - SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees) < 1e-12) {
        return {
          stepIndex,
          radiusIndex,
          radius: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
          radiusAxisValue: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
          rawPsiDegrees: SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees,
          swtd: SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd,
          desStrAng: SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng,
          source: "bootstrap",
          confidence: 1,
          historyCount: Array.isArray(historyEntries) ? historyEntries.length : 0
        };
      }

      const priorHistory = Array.isArray(historyEntries) ? historyEntries : [];
      const stableHistory = priorHistory.filter(isStableSeedLookupEntry);
      const trendHistory = (stableHistory.length >= 2 ? stableHistory : priorHistory)
        .filter((entry) => Number.isFinite(Number(entry?.rawPsiDegrees)) && Number.isFinite(Number(entry?.swtd)) && Number.isFinite(Number(entry?.desStrAng)));
      const recentTrendHistory = trendHistory.slice(-4);
      const steerMaxRad = degToRad(SEED_LOOKUP_STEER_MAX_DEGREES);
      const fallbackSeed = {
        kind: "swtd",
        swtd: Number(previousSeed?.swtd) || SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd,
        desStrAng: Number(previousSeed?.desStrAng) || SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng
      };

      if (!trendHistory.length) {
        return {
          ...getPriorProfileStarterSeed(rawPsiDegrees, previousSeed, radiusValue),
          stepIndex,
          radiusIndex,
          radius: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
          radiusAxisValue: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
          rawPsiDegrees,
          source: "prior-profile",
          confidence: 0.45,
          historyCount: 0
        };
      }

      const localSwtd = recentTrendHistory.length >= 2
        ? fitRawPsiTrendSeed(recentTrendHistory, rawPsiDegrees, "swtd")
        : NaN;
      const localDesStrAng = recentTrendHistory.length >= 2
        ? fitRawPsiTrendSeed(recentTrendHistory, rawPsiDegrees, "desStrAng")
        : NaN;
      const globalSwtd = trendHistory.length >= 2
        ? fitRawPsiTrendSeed(trendHistory, rawPsiDegrees, "swtd")
        : NaN;
      const globalDesStrAng = trendHistory.length >= 2
        ? fitRawPsiTrendSeed(trendHistory, rawPsiDegrees, "desStrAng")
        : NaN;
      const carrySwtd = Number(previousSeed?.swtd);
      const carryDesStrAng = Number(previousSeed?.desStrAng);
      const localWeight = recentTrendHistory.length >= 3 ? 0.55 : 0.4;
      const globalWeight = trendHistory.length >= 4 ? 0.2 : 0.1;
      const carryWeight = 1 - localWeight - globalWeight;
      const swtdPrediction = blendStarterSeedPredictions([
        { value: localSwtd, weight: localWeight },
        { value: globalSwtd, weight: globalWeight },
        { value: carrySwtd, weight: carryWeight }
      ], { ...fallbackSeed, kind: "swtd" }, previousSeed, steerMaxRad);
      const desStrAngPrediction = blendStarterSeedPredictions([
        { value: localDesStrAng, weight: localWeight },
        { value: globalDesStrAng, weight: globalWeight },
        { value: carryDesStrAng, weight: carryWeight }
      ], { ...fallbackSeed, kind: "desStrAng" }, previousSeed, steerMaxRad);
      const confidence = clamp(
        0.35
          + (recentTrendHistory.length * 0.12)
          + (stableHistory.length * 0.04),
        0.35,
        0.96
      );

      return {
        stepIndex,
        radiusIndex,
        radius: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
        radiusAxisValue: Number(radiusValue) || SEED_LOOKUP_FIXED_RADIUS,
        rawPsiDegrees,
        swtd: swtdPrediction.swtd,
        desStrAng: desStrAngPrediction.desStrAng,
        source: recentTrendHistory.length >= 2
          ? (stableHistory.length >= 2 ? "stable-hybrid" : "hybrid")
          : "carry-forward",
        confidence,
        historyCount: trendHistory.length
      };
    }

    function buildStarterSeedGrid(historyEntries = getSeedLookupEntriesSorted()) {
      const starterSeedGrid = [];
      const normalizedHistory = Array.isArray(historyEntries)
        ? historyEntries.filter((entry) => Number.isFinite(Number(entry?.stepIndex)) && Number.isFinite(Number(entry?.rawPsiDegrees)) && Number.isFinite(Number(entry?.radiusIndex)))
        : [];
      for (let radiusIndex = 0; radiusIndex < SEED_SWEEP_RADIUS_AXIS.length; radiusIndex += 1) {
        const radiusValue = SEED_SWEEP_RADIUS_AXIS[radiusIndex];
        const radiusHistory = normalizedHistory.filter((entry) => Number(entry.radiusIndex) === radiusIndex);
        const starterSeeds = [];
        let previousSeed = null;
        for (let index = 0; index < SEED_LOOKUP_RAW_PSI_AXIS.length; index += 1) {
          const rawPsiDegrees = SEED_LOOKUP_RAW_PSI_AXIS[index];
          const historyForStep = radiusHistory.filter((entry) => Number(entry.stepIndex) < index);
          const starterSeed = buildStarterSeedEntry(
            index,
            rawPsiDegrees,
            radiusValue,
            radiusIndex,
            historyForStep,
            previousSeed || getPriorProfileStarterSeed(rawPsiDegrees, SEED_LOOKUP_BOOTSTRAP_ENTRY, radiusValue)
          );
          starterSeeds.push(starterSeed);
          previousSeed = starterSeed;
        }
        starterSeedGrid.push(starterSeeds);
      }
      return starterSeedGrid;
    }

    function normalizeStarterSeedCell(cell) {
      if (!cell || typeof cell !== "object") {
        return null;
      }
      return {
        stepIndex: Number(cell.stepIndex) || 0,
        radiusIndex: Number(cell.radiusIndex) || 0,
        radius: Number(cell.radius) || 0,
        radiusAxisValue: Number(cell.radiusAxisValue ?? cell.radius) || 0,
        rawPsiDegrees: Number(cell.rawPsiDegrees) || 0,
        swtd: limitSwtdMinimum(cell.swtd),
        desStrAng: boundDesStrAngSeed(Number(cell.desStrAng), degToRad(SEED_LOOKUP_STEER_MAX_DEGREES)),
        source: String(cell.source || "server"),
        confidence: Number.isFinite(Number(cell.confidence)) ? Number(cell.confidence) : 0
      };
    }

    function normalizeStarterSeedGrid(grid) {
      if (!Array.isArray(grid)) {
        return null;
      }
      return grid.map((row) => Array.isArray(row) ? row.map(normalizeStarterSeedCell).filter(Boolean) : []);
    }

    function loadStarterSeedGridFromServer() {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/starter-seeds", false);
        xhr.send(null);
        if (xhr.status < 200 || xhr.status >= 300) {
          return null;
        }
        const payload = JSON.parse(xhr.responseText || "{}");
        return normalizeStarterSeedGrid(payload?.starterSeedGrid);
      } catch {
        return null;
      }
    }

    function refreshStarterSeedArray() {
      const useLocalRefinement = seedLookupState.entries.size > 0;
      seedLookupState.starterSeedGrid = useLocalRefinement
        ? buildStarterSeedGrid()
        : (loadStarterSeedGridFromServer() || buildStarterSeedGrid());
      const fixedRadiusIndex = getSeedLookupRadiusIndex(SEED_LOOKUP_FIXED_RADIUS);
      seedLookupState.radiusIndex = fixedRadiusIndex;
      seedLookupState.radiusValue = SEED_SWEEP_RADIUS_AXIS[fixedRadiusIndex] ?? SEED_LOOKUP_FIXED_RADIUS;
      seedLookupState.starterSeeds = seedLookupState.starterSeedGrid[fixedRadiusIndex] || [];
      return seedLookupState.starterSeeds;
    }

    function getStarterSeedGridCell(radiusIndex, stepIndex) {
      return seedLookupState.starterSeedGrid?.[radiusIndex]?.[stepIndex] || null;
    }

    function interpolateSeedValues(c00, c10, c01, c11, radiusMix, psiMix, key) {
      const v00 = Number(c00?.[key]);
      const v10 = Number(c10?.[key]);
      const v01 = Number(c01?.[key]);
      const v11 = Number(c11?.[key]);
      if ([v00, v10, v01, v11].every(Number.isFinite)) {
        return ((1 - radiusMix) * (1 - psiMix) * v00)
          + (radiusMix * (1 - psiMix) * v10)
          + ((1 - radiusMix) * psiMix * v01)
          + (radiusMix * psiMix * v11);
      }
      const available = [
        { value: v00, weight: (1 - radiusMix) * (1 - psiMix), seed: c00 },
        { value: v10, weight: radiusMix * (1 - psiMix), seed: c10 },
        { value: v01, weight: (1 - radiusMix) * psiMix, seed: c01 },
        { value: v11, weight: radiusMix * psiMix, seed: c11 }
      ].filter((item) => Number.isFinite(item.value) && item.weight > 0);
      if (!available.length) {
        return NaN;
      }
      let weightedSum = 0;
      let weightSum = 0;
      available.forEach((item) => {
        weightedSum += item.value * item.weight;
        weightSum += item.weight;
      });
      return weightSum > 0 ? weightedSum / weightSum : available[0].value;
    }

    function getStarterSeedForRequest(radius, rawPsiDegrees, steerMaxDegrees = SEED_LOOKUP_STEER_MAX_DEGREES) {
      if (!seedLookupState.starterSeedGrid.length) {
        refreshStarterSeedArray();
      }
      const radiusValue = Math.abs(Number(radius) || 0) || SEED_LOOKUP_FIXED_RADIUS;
      const rawPsiValue = Number.isFinite(Number(rawPsiDegrees))
        ? Number(rawPsiDegrees)
        : seedLookupState.rawPsiDegrees;
      const radiusBounds = getBoundingAxisIndices(SEED_SWEEP_RADIUS_AXIS, radiusValue);
      const psiBounds = getBoundingAxisIndices(SEED_LOOKUP_RAW_PSI_AXIS, rawPsiValue);
      const c00 = getStarterSeedGridCell(radiusBounds.lowerIndex, psiBounds.lowerIndex);
      const c10 = getStarterSeedGridCell(radiusBounds.upperIndex, psiBounds.lowerIndex);
      const c01 = getStarterSeedGridCell(radiusBounds.lowerIndex, psiBounds.upperIndex);
      const c11 = getStarterSeedGridCell(radiusBounds.upperIndex, psiBounds.upperIndex);
      const exactRadius = radiusBounds.lowerIndex === radiusBounds.upperIndex;
      const exactPsi = psiBounds.lowerIndex === psiBounds.upperIndex;
      const steerMaxRad = degToRad(steerMaxDegrees);
      const previousSeed = c00 || c10 || c01 || c11 || SEED_LOOKUP_BOOTSTRAP_ENTRY;

      if (exactRadius && exactPsi && c00) {
        return clampStarterSeedValues(
          {
            ...c00,
            radius: radiusValue,
            rawPsiDegrees: rawPsiValue,
            source: c00.source || "grid-exact",
            confidence: Number.isFinite(Number(c00.confidence)) ? Number(c00.confidence) : 1
          },
          previousSeed,
          steerMaxRad
        );
      }

      const interpolatedSwtd = interpolateSeedValues(c00, c10, c01, c11, radiusBounds.mix, psiBounds.mix, "swtd");
      const interpolatedDesStrAng = interpolateSeedValues(c00, c10, c01, c11, radiusBounds.mix, psiBounds.mix, "desStrAng");
      if (Number.isFinite(interpolatedSwtd) && Number.isFinite(interpolatedDesStrAng)) {
        return clampStarterSeedValues(
          {
            kind: "swtd",
            swtd: interpolatedSwtd,
            desStrAng: interpolatedDesStrAng,
            radius: radiusValue,
            rawPsiDegrees: rawPsiValue,
            stepIndex: psiBounds.lowerIndex,
            source: "grid-bilinear",
            confidence: 0.8
          },
          previousSeed,
          steerMaxRad
        );
      }

      const fallbackSeed = getPriorProfileStarterSeed(rawPsiValue, previousSeed, radiusValue);
      return clampStarterSeedValues(
        {
          ...fallbackSeed,
          radius: radiusValue,
          rawPsiDegrees: rawPsiValue,
          source: "grid-fallback",
          confidence: 0.35
        },
        previousSeed,
        steerMaxRad
      );
    }

    function hasNextSeedLookupRawPsiEntry() {
      return seedLookupState.stepIndex < SEED_LOOKUP_RAW_PSI_AXIS.length - 1;
    }

    function waitForRenderFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => resolve()));
    }

    function applyPassLoopExitState(solution) {
      applyHeadingEstimateState(solution);
      const exit = evaluatePassLoopExit(solution);
      persistPassLoopExit(solution, exit);
      if (solution && typeof solution === "object") {
        solution.passLoopExit = exit;
        solution.pEstExit = exit;
        solution.exitCode = exit ? exit.code : null;
        solution.exitReason = exit ? exit.reason : null;
        solution.headingEstimatePhase = exit ? "pEstComplete" : "pEst";
        solution.headingEstimatePause = Boolean(exit);
        solution.desStrAngEstimatePhase = exit ? "innerLoopComplete" : "innerLoop";
        solution.desStrAngLoopExit = evaluateDesStrAngLoopExit(solution);
        persistDesStrAngLoopExit(solution, solution.desStrAngLoopExit);
        solution.desStrAngExitCode = solution.desStrAngLoopExit ? solution.desStrAngLoopExit.code : null;
        solution.showShadows = Boolean(exit);
      }
      if (nextPassButton) {
        if (SEED_LOOKUP_BOOTSTRAP_MODE) {
          nextPassButton.disabled = simpleArcSeedLoopRunning || !hasNextSeedLookupRawPsiEntry();
          nextPassButton.title = hasNextSeedLookupRawPsiEntry()
            ? "Advance seed lookup to the next Raw Psi entry"
            : "Seed lookup has reached max Raw Psi";
          return exit;
        }
        const hasPasses = Array.isArray(solution?.passes) && solution.passes.length > 0;
        nextPassButton.disabled = simpleArcInnerLoopRunning || !hasPasses;
        nextPassButton.title = exit
          ? `desStrAng pass ${getHeadingEstimateIndex(solution)} swtd loop complete: Exit ${exit.code}: ${exit.reason}`
          : (hasPasses ? "swtd loop ready for next desStrAng pass" : "swtd loop running");
      }
      return exit;
    }

    function updateDebugData(solution, selectedPassIndex = -1) {
      if (!debugData) return;
      debugData.textContent = "";
      const exit = persistPassLoopExit(solution);
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) {
        debugData.textContent = "No solver trace yet.";
        return;
      }

      const formatDebugCell = (value, width, align = "left") => {
        const text = String(value ?? "");
        return align === "right" ? text.padStart(width, " ") : text.padEnd(width, " ");
      };

      const renderDebugLine = (cells) =>
        cells.map((cell, index) => formatDebugCell(cell, DEBUG_TABLE_COLUMNS[index].width, DEBUG_TABLE_COLUMNS[index].align)).join("  ");

      const lines = [
        renderDebugLine(DEBUG_TABLE_COLUMNS.map((column) => column.label))
      ];
      const exitHEst = getHeadingEstimateIndex(solution);
      passes.forEach((pass, index) => {
        const candidate = pickPassCandidate(pass);
        const swtd = limitSwtdMinimum(pass?.swtd ?? pass?.pathCenter ?? candidate?.PathLength ?? candidate?.pathLength ?? solution?.swtd);
        const desStrAng = Number(pass?.desStrAng ?? solution?.desStrAng ?? pass?.headingChange ?? solution?.headingChange);
        const positionError = Number(pass?.pErr ?? candidate?.pErr ?? candidate?.positionError ?? solution?.positionError);
        const deltaPositionError = Number(pass?.dPErr ?? positionError);
        const headingError = Number(pass?.hErr ?? candidate?.hErr ?? candidate?.headingNormalError ?? solution?.headingNormalError);
        const deltaHeadingError = Number(pass?.dHErr);
        const terminalPose = pass?.terminalPose || candidate?.Path?.TerminalPose || candidate?.result?.terminalPose || candidate?.terminalPose || solution?.terminalPose || null;
        const terminalPoseText = terminalPose
          ? [
              formatPassDistance(terminalPose.x),
              formatPassDistance(terminalPose.y),
              formatPassAngle(terminalPose.angle),
              formatPassAngle(terminalPose.strAng)
            ]
          : ["NaN", "NaN", "NaN", "NaN"];
        const pExit = pass?.exitCode ?? (
          exit
            && Number(pass?.hEst ?? 0) === exitHEst
            && Number(pass?.pass ?? index) === Number(exit.pass)
            ? String(exit.code)
            : "-"
        );
        const aExit = pass?.aExitCode
          ?? pass?.desStrAngExitCode
          ?? (
            index === passes.length - 1 && solution?.desStrAngExitCode != null
              ? String(solution.desStrAngExitCode)
              : "-"
          );
        const row = [
          formatPassIndex(Number(pass?.hEst ?? 0)),
          formatPassIndex(Number(pass?.pass ?? index)),
          formatPassSeedValue(swtd),
          formatPassSeedValue(desStrAng),
          formatPassError(positionError),
          formatPassError(deltaPositionError),
          formatPassError(headingError),
          formatPassError(deltaHeadingError),
          ...terminalPoseText,
          pExit,
          aExit
        ];
        lines.push(renderDebugLine(row));
      });
      debugData.textContent = lines.join("\n");
    }

    function updateDependentList() {
      updateDebugData(simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc(), simpleArcPassIndex);
    }

    function clearPassPreview() {
      simpleArcPassIndex = -1;
      if (simpleArcFullSolution) {
        state.simpleArcSolution = simpleArcFullSolution;
        syncVehicleShadows(simpleArcFullSolution);
        const activeVehicle = getActiveVehicle();
        if (activeVehicle) {
          activeVehicle.finalPose = simpleArcFullSolution?.terminalPose ? { ...simpleArcFullSolution.terminalPose } : null;
          if (Number.isFinite(Number(simpleArcFullSolution?.sl))) {
            activeVehicle.sl = Number(simpleArcFullSolution.sl);
          }
        }
      }
      updateDependentList();
      updateJson();
    }

    function showPassPreview(index) {
      const solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc();
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) {
        return false;
      }
      const nextIndex = Math.max(0, Math.min(Number(index) || 0, passes.length - 1));
      const preview = buildPassPreviewSolution(passes[nextIndex], nextIndex, solution);
      simpleArcPassIndex = nextIndex;
      state.simpleArcSolution = preview;
      syncVehicleShadows(preview);
      const activeVehicle = getActiveVehicle();
      if (activeVehicle) {
        activeVehicle.finalPose = preview?.terminalPose ? { ...preview.terminalPose } : null;
        if (Number.isFinite(Number(preview?.sl))) {
          activeVehicle.sl = Number(preview.sl);
        }
      }
      updateDependentList();
      updateJson();
      scheduleRender();
      return true;
    }

    function publishPositionEstimatePassResult(bundle) {
      if (!bundle?.result || !bundle?.renderResult) {
        return false;
      }
      let { result } = bundle;
      const { renderResult, nextIndex } = bundle;
      const completedAloopPasses = Array.isArray(result?.completedAloopPasses) ? result.completedAloopPasses : [];
      if (completedAloopPasses.length) {
        result = {
          ...result,
          passes: [
            ...completedAloopPasses,
            ...(Array.isArray(result.passes) ? result.passes : [])
          ],
          completedAloopPasses: []
        };
      }
      result.passes = applyPassErrors(result.passes, result);
      const latestLoggedPass = result.passes[result.passes.length - 1] || null;
      if (latestLoggedPass) {
        renderResult.pErr = latestLoggedPass.pErr;
        renderResult.dPErr = latestLoggedPass.dPErr;
        renderResult.hErr = latestLoggedPass.hErr;
        renderResult.dHErr = latestLoggedPass.dHErr;
        renderResult.passes = [latestLoggedPass];
      }
      result.showShadows = true;
      renderResult.showShadows = true;
      simpleArcPassIndex = Number.isFinite(Number(nextIndex)) ? Number(nextIndex) : simpleArcPassIndex;
      simpleArcFullSolution = result;
      state.simpleArcTrace = result;
      state.simpleArcSolution = renderResult;
      applyPassLoopExitState(result);
      syncVehicleShadows(renderResult);
      if (state.vehicle) {
        state.vehicle.finalPose = renderResult?.terminalPose ? { ...renderResult.terminalPose } : null;
      }
      if (state.vehicle && Number.isFinite(Number(renderResult?.sl))) {
        state.vehicle.sl = Number(renderResult.sl);
      }
      syncInputs();
      updateDebugData(result, simpleArcPassIndex);
      updateJson();
      scheduleRender();
      saveState();
      return true;
    }

    function appendNextPositionEstimatePass(sourceSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc(), commitDisplay = true) {
      const solution = sourceSolution;
      if (evaluatePassLoopExit(solution)) {
        return false;
      }
      const hEst = getHeadingEstimateIndex(solution);
      const completedAloopPasses = Array.isArray(solution?.completedAloopPasses) ? solution.completedAloopPasses : [];
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) {
        return false;
      }
      const currentPasses = passes.filter((pass) => {
        const passHEst = Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : hEst;
        return passHEst === hEst;
      });
      if (!currentPasses.length) {
        return false;
      }
      const seedPass = currentPasses[0] || null;
      const seedSwtd = limitSwtdMinimum(seedPass?.swtd ?? state.ui?.swtd ?? getInitialSwtdSeed(state.arc.deltaPsi));
      const seedDesStrAng = boundDesStrAngSeed(Number.isFinite(Number(seedPass?.desStrAng))
        ? Number(seedPass.desStrAng)
        : getHeadingDesStrAngSeed(solution));
      const selectorHrtDerived = deriveHeadingRateFromDesStrAng(seedDesStrAng, seedSwtd);
      const selectorHrt = Number.isFinite(selectorHrtDerived)
        ? selectorHrtDerived
        : getHeadingRateSeed(solution, seedSwtd);
      const sourcePass = currentPasses[currentPasses.length - 1];
      const priorPasses = currentPasses.map((pass, index) => ({
        ...(pass || {}),
        hEst: Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : hEst,
        pass: Number.isFinite(Number(pass?.pass)) ? Number(pass.pass) : index
      }));
      state.ui.swtd = seedSwtd;
      state.arc.desStrAng = seedDesStrAng;
      state.arc.slew = selectorHrt;
      if (commitDisplay) {
        syncInputs();
      }
      const result = recalculateVehicleSolution({
        persist: false,
        render: false,
        commitDisplay: false,
        seedSwtd,
        seedDesStrAng
      });
      if (!result) {
        return false;
      }
      const nextIndex = priorPasses.length;
      const estimatedNext = solvePassWithEstimatedSwtd(nextIndex, priorPasses, result, seedDesStrAng);
      const nextResult = estimatedNext?.solved || result;
      const nextTerminalPose = nextResult?.terminalPose || nextResult?.finalPose || null;
      const nextVc = nextResult?.vc || nextResult?.complexVc || (nextTerminalPose ? getSimpleArcVC(nextTerminalPose) : null);
      const nextSlewDerived = deriveHeadingRateFromDesStrAng(seedDesStrAng, estimatedNext.estimatedSwtd);
      const nextSlew = Number.isFinite(nextSlewDerived)
        ? nextSlewDerived
        : normalizeSlew(Number(nextResult?.headingChangePerDistance ?? nextResult?.slew ?? nextResult?.sl) || getInitialHrtSeed());
      const nextHeadingChange = seedDesStrAng;
      let loggedPass = {
        ...cloneLoggedPass(sourcePass, nextIndex, nextResult),
        hEst,
        desStrAng: seedDesStrAng,
        swtd: estimatedNext.estimatedSwtd,
        pathCenter: estimatedNext.estimatedSwtd,
        s: estimatedNext.estimatedSwtd,
        curveLength: estimatedNext.estimatedSwtd,
        complexCurveLength: estimatedNext.estimatedSwtd,
        steeredWheelTravelDistance: estimatedNext.estimatedSwtd,
        totalTravelDistance: estimatedNext.estimatedSwtd,
        spTravelDistance: estimatedNext.estimatedSwtd,
        pErr: estimatedNext.signedPositionError,
        hErr: estimatedNext.signedHeadingError,
        terminalPose: nextTerminalPose,
        finalPose: nextTerminalPose,
        complexTerminalPose: nextTerminalPose,
        vc: nextVc,
        complexVc: nextVc,
        hRt: nextSlew,
        headingChangePerDistance: nextSlew,
        slew: nextSlew,
        sl: nextSlew,
        headingChange: nextHeadingChange,
        turnAngle: nextHeadingChange,
        strAng: nextHeadingChange,
        finalHeading: Number.isFinite(Number(nextTerminalPose?.angle)) ? Number(nextTerminalPose.angle) : 0
      };
      result.passes = [...passes, loggedPass];
      result.completedAloopPasses = completedAloopPasses;
      result.hEst = hEst;
      result.headingEstimateIndex = hEst;
      const seedPassIndex = result.passes.findIndex((pass) => Number(pass?.hEst) === hEst && Number(pass?.pass) === 0);
      if (seedPassIndex >= 0) {
        result.passes[seedPassIndex] = {
          ...(result.passes[seedPassIndex] || {}),
          hEst,
          desStrAng: seedDesStrAng,
          swtd: seedSwtd,
          pathCenter: seedSwtd,
          pErr: result.passes[seedPassIndex]?.pErr,
          hErr: result.passes[seedPassIndex]?.hErr,
          hRt: selectorHrt,
          headingChangePerDistance: selectorHrt,
          slew: selectorHrt,
          sl: selectorHrt
        };
      }
      result.passes = applyPassErrors(result.passes, result);
      loggedPass = result.passes[result.passes.length - 1] || loggedPass;
      result.desStrAng = seedDesStrAng;
      const renderResult = {
        ...buildSinglePassRenderSolution(nextResult, nextIndex),
        swtd: loggedPass.swtd,
        pathCenter: loggedPass.pathCenter,
        s: loggedPass.s,
        curveLength: loggedPass.curveLength,
        complexCurveLength: loggedPass.complexCurveLength,
        steeredWheelTravelDistance: loggedPass.steeredWheelTravelDistance,
        totalTravelDistance: loggedPass.totalTravelDistance,
        spTravelDistance: loggedPass.spTravelDistance,
        pErr: loggedPass.pErr,
        dPErr: loggedPass.dPErr,
        hErr: loggedPass.hErr,
        dHErr: loggedPass.dHErr,
        headingChangePerDistance: loggedPass.headingChangePerDistance,
        slew: loggedPass.slew,
        sl: loggedPass.sl,
        passes: [loggedPass]
      };
      if (commitDisplay) {
        return publishPositionEstimatePassResult({
          result,
          renderResult,
          nextIndex,
          loggedPass
        });
      }
      return {
        result,
        renderResult,
        nextIndex,
        loggedPass
      };
    }

    async function runPositionEstimateInnerLoop(initialSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc()) {
      if (simpleArcInnerLoopRunning) return false;
      simpleArcInnerLoopRunning = true;
      try {
        await waitForRenderFrame();
        let changed = false;
        let workingSolution = initialSolution || simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc();
        let lastStep = null;
        if (evaluatePassLoopExit(workingSolution)) {
          const finalPasses = Array.isArray(workingSolution?.passes) ? workingSolution.passes : [];
          publishPositionEstimatePassResult({
            result: workingSolution,
            renderResult: buildSinglePassRenderSolution(workingSolution, Math.max(0, finalPasses.length - 1)),
            nextIndex: Math.max(0, finalPasses.length - 1),
            loggedPass: finalPasses.length ? finalPasses[finalPasses.length - 1] : null
          });
          return false;
        }
        while (!evaluatePassLoopExit(workingSolution)) {
          lastStep = appendNextPositionEstimatePass(workingSolution, false);
          if (!lastStep) {
            break;
          }
          workingSolution = lastStep.result;
          changed = true;
          await waitForRenderFrame();
        }
        if (lastStep) {
          publishPositionEstimatePassResult(lastStep);
        }
        return changed;
      } finally {
        simpleArcInnerLoopRunning = false;
        applyPassLoopExitState(simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution);
      }
    }

    async function runSeedLookupBootstrapLoops(initialSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc()) {
      if (simpleArcSeedLoopRunning) return false;
      simpleArcSeedLoopRunning = true;
      try {
        let workingSolution = initialSolution;
        for (let outerPassGuard = 0; outerPassGuard < 8; outerPassGuard += 1) {
          await runPositionEstimateInnerLoop(workingSolution);
          workingSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || workingSolution;
          applyPassLoopExitState(workingSolution);
          if (evaluateDesStrAngLoopExit(workingSolution)) {
            break;
          }
          const seed = buildNextDesStrAngOuterPassSeed(workingSolution);
          if (!seed || !Number.isFinite(Number(seed.swtd)) || !Number.isFinite(Number(seed.desStrAng))) {
            break;
          }
          workingSolution = startDesStrAngEstimatePass(seed.outerPass, seed.swtd, seed.desStrAng, false);
          if (!workingSolution) {
            break;
          }
        }
        return true;
      } finally {
        simpleArcSeedLoopRunning = false;
        storeCurrentSeedLookupEntry(simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution);
        applyPassLoopExitState(simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution);
        updateDependentList();
        updateJson();
        scheduleRender();
      }
    }

    async function advanceSeedLookupRawPsiEntry() {
      if (!SEED_LOOKUP_BOOTSTRAP_MODE || simpleArcSeedLoopRunning || !hasNextSeedLookupRawPsiEntry()) {
        return false;
      }
      storeCurrentSeedLookupEntry(simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution);
      refreshStarterSeedArray();
      const nextStepIndex = seedLookupState.stepIndex + 1;
      const nextRawPsiDegrees = SEED_LOOKUP_RAW_PSI_AXIS[nextStepIndex];
      const seedEntry = seedLookupState.starterSeeds[nextStepIndex]
        ?? estimateSeedLookupEntryForStep(nextStepIndex, nextRawPsiDegrees);
      const seedSwtd = limitSwtdMinimum(Number(seedEntry.swtd) * SEED_LOOKUP_INITIAL_SWTD_MULTIPLIER);
      const seedDesStrAng = boundDesStrAngSeed(Number(seedEntry.desStrAng), degToRad(SEED_LOOKUP_STEER_MAX_DEGREES));
      seedLookupState.stepIndex = nextStepIndex;
      seedLookupState.rawPsiDegrees = nextRawPsiDegrees;
      state.arc.radius = SEED_LOOKUP_FIXED_RADIUS;
      state.arc.deltaPsi = degToRad(nextRawPsiDegrees);
      state.arc.angle = state.arc.deltaPsi;
      state.arc.steerMax = degToRad(SEED_LOOKUP_STEER_MAX_DEGREES);
      state.ui.swtd = seedSwtd;
      state.arc.desStrAng = seedDesStrAng;
      const seededSlew = deriveHeadingRateFromDesStrAng(state.arc.desStrAng, state.ui.swtd);
      state.arc.slew = Number.isFinite(seededSlew) ? seededSlew : getInitialHrtSeed(undefined, state.ui.swtd);
      state.arc.length = getSimpleArcLength();
      simpleArcHeadingEstimateIndex = 0;
      simpleArcPassIndex = 0;
      const result = recalculateVehicleSolution({
        initialSwtdSeed: seedSwtd,
        seedSwtd,
        seedDesStrAng,
        commitDisplay: false,
        persist: false,
        render: false
      });
      simpleArcFullSolution = result;
      state.simpleArcTrace = result;
      state.simpleArcSolution = result;
      syncInputs();
      updateDebugData(result, 0);
      updateJson();
      fitView();
      scheduleRender();
      await runSeedLookupBootstrapLoops(result);
      return true;
    }

    function evaluateDesStrAngLoopExit(solution) {
      if (!solution || typeof solution !== "object") return null;
      const innerExit = evaluatePassLoopExit(solution);
      if (!innerExit) return null;
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) return null;

      const finalPassesByHEst = new Map();
      passes.forEach((pass) => {
        const hEst = Number(pass?.hEst);
        if (!Number.isFinite(hEst)) return;
        finalPassesByHEst.set(hEst, pass);
      });

      const finalPasses = [...finalPassesByHEst.entries()]
        .sort(([left], [right]) => left - right)
        .map(([hEst, pass]) => ({ hEst, pass }));
      if (!finalPasses.length) return null;

      const latest = finalPasses[finalPasses.length - 1];
      const latestPass = latest.pass;
      const hErr = Number(latestPass?.hErr);
      const dHErr = Number(latestPass?.dHErr);
      const passIndex = Number.isFinite(Number(latestPass?.pass))
        ? Number(latestPass.pass)
        : passes.indexOf(latestPass);

      if (Number.isFinite(hErr) && Math.abs(hErr) < ESTIMATOR_HEADING_ERROR_THRESHOLD) {
        return {
          code: 0,
          reason: "headingErrorThreshold",
          hEst: latest.hEst,
          pass: passIndex,
          hErr
        };
      }
      if (
        Number.isFinite(dHErr)
        && Math.abs(dHErr) < ESTIMATOR_HEADING_DELTA_ERROR_THRESHOLD
        && Number.isFinite(hErr)
        && hErr <= ESTIMATOR_HEADING_ERROR_THRESHOLD
      ) {
        return {
          code: 2,
          reason: "deltaHeadingErrorThreshold",
          hEst: latest.hEst,
          pass: passIndex,
          hErr,
          dHErr
        };
      }
      if (finalPasses.length >= 8) {
        return {
          code: 1,
          reason: "maxAloopCount",
          hEst: latest.hEst,
          pass: passIndex,
          passCount: finalPasses.length
        };
      }
      return null;
    }

    function persistDesStrAngLoopExit(solution, exit = evaluateDesStrAngLoopExit(solution)) {
      if (!solution || typeof solution !== "object" || !exit || !Array.isArray(solution.passes)) {
        return exit;
      }
      solution.passes = solution.passes.map((pass, index) => {
        const hEst = Number(pass?.hEst);
        const passIndex = Number.isFinite(Number(pass?.pass)) ? Number(pass.pass) : index;
        if (hEst !== Number(exit.hEst) || passIndex !== Number(exit.pass)) {
          return pass;
        }
        return {
          ...(pass || {}),
          aExitCode: exit.code,
          aExitReason: exit.reason
        };
      });
      return exit;
    }

    function getFinalOuterPassLog(passes, outerPass) {
      const matching = Array.isArray(passes)
        ? passes.filter((pass) => Number(pass?.hEst ?? 0) === outerPass)
        : [];
      return matching[matching.length - 1] || null;
    }

    function solveQuadraticZeroFromSamples(samples, fallback) {
      if (!Array.isArray(samples) || samples.length !== 3) {
        return fallback;
      }
      const [first, second, third] = samples;
      const x0 = Number(first?.x);
      const y0 = Number(first?.y);
      const x1 = Number(second?.x);
      const y1 = Number(second?.y);
      const x2 = Number(third?.x);
      const y2 = Number(third?.y);
      if (
        !Number.isFinite(x0) || !Number.isFinite(y0)
        || !Number.isFinite(x1) || !Number.isFinite(y1)
        || !Number.isFinite(x2) || !Number.isFinite(y2)
      ) {
        return fallback;
      }
      const d0 = (x0 - x1) * (x0 - x2);
      const d1 = (x1 - x0) * (x1 - x2);
      const d2 = (x2 - x0) * (x2 - x1);
      if (Math.abs(d0) <= 1e-12 || Math.abs(d1) <= 1e-12 || Math.abs(d2) <= 1e-12) {
        return fallback;
      }
      const a = (y0 / d0) + (y1 / d1) + (y2 / d2);
      const b = -((y0 * (x1 + x2) / d0) + (y1 * (x0 + x2) / d1) + (y2 * (x0 + x1) / d2));
      const c = (y0 * x1 * x2 / d0) + (y1 * x0 * x2 / d1) + (y2 * x0 * x1 / d2);
      if (Math.abs(a) <= 1e-12) {
        return Math.abs(b) > 1e-12 ? -c / b : fallback;
      }
      const discriminant = (b * b) - (4 * a * c);
      if (!Number.isFinite(discriminant) || discriminant < 0) {
        return fallback;
      }
      const sqrtDiscriminant = Math.sqrt(discriminant);
      const roots = [
        (-b + sqrtDiscriminant) / (2 * a),
        (-b - sqrtDiscriminant) / (2 * a)
      ].filter(Number.isFinite);
      if (!roots.length) {
        return fallback;
      }
      const target = Number.isFinite(Number(fallback)) ? Number(fallback) : x2;
      return roots.reduce((best, candidate) =>
        Math.abs(candidate - target) < Math.abs(best - target) ? candidate : best
      );
    }

    function getInterpolatingPolynomialCoefficients(samples) {
      if (!Array.isArray(samples) || !samples.length) {
        return null;
      }
      const coefficients = Array(samples.length).fill(0);
      for (let i = 0; i < samples.length; i += 1) {
        const xi = Number(samples[i]?.x);
        const yi = Number(samples[i]?.y);
        if (!Number.isFinite(xi) || !Number.isFinite(yi)) {
          return null;
        }
        let denominator = 1;
        let basis = [1];
        for (let j = 0; j < samples.length; j += 1) {
          if (i === j) continue;
          const xj = Number(samples[j]?.x);
          if (!Number.isFinite(xj)) {
            return null;
          }
          denominator *= xi - xj;
          const nextBasis = Array(basis.length + 1).fill(0);
          for (let k = 0; k < basis.length; k += 1) {
            nextBasis[k] += -xj * basis[k];
            nextBasis[k + 1] += basis[k];
          }
          basis = nextBasis;
        }
        if (Math.abs(denominator) <= 1e-12) {
          return null;
        }
        const scale = yi / denominator;
        for (let k = 0; k < basis.length; k += 1) {
          coefficients[k] += basis[k] * scale;
        }
      }
      return coefficients;
    }

    function selectClosestRoot(roots, fallback) {
      const finiteRoots = Array.isArray(roots) ? roots.filter(Number.isFinite) : [];
      if (!finiteRoots.length) {
        return fallback;
      }
      const target = Number.isFinite(Number(fallback)) ? Number(fallback) : finiteRoots[0];
      return finiteRoots.reduce((best, candidate) =>
        Math.abs(candidate - target) < Math.abs(best - target) ? candidate : best
      );
    }

    function solveLinearZero(coefficients, fallback) {
      const c = Number(coefficients?.[0]);
      const b = Number(coefficients?.[1]);
      return Number.isFinite(c) && Number.isFinite(b) && Math.abs(b) > 1e-12
        ? -c / b
        : fallback;
    }

    function solveQuadraticPolynomialZero(coefficients, fallback) {
      const c = Number(coefficients?.[0]);
      const b = Number(coefficients?.[1]);
      const a = Number(coefficients?.[2]);
      if (!Number.isFinite(a) || Math.abs(a) <= 1e-12) {
        return solveLinearZero(coefficients, fallback);
      }
      if (!Number.isFinite(b) || !Number.isFinite(c)) {
        return fallback;
      }
      const discriminant = (b * b) - (4 * a * c);
      if (!Number.isFinite(discriminant) || discriminant < 0) {
        return fallback;
      }
      const sqrtDiscriminant = Math.sqrt(discriminant);
      return selectClosestRoot([
        (-b + sqrtDiscriminant) / (2 * a),
        (-b - sqrtDiscriminant) / (2 * a)
      ], fallback);
    }

    function solveCubicPolynomialZero(coefficients, fallback) {
      const d = Number(coefficients?.[0]);
      const c = Number(coefficients?.[1]);
      const b = Number(coefficients?.[2]);
      const a = Number(coefficients?.[3]);
      if (!Number.isFinite(a) || Math.abs(a) <= 1e-12) {
        return solveQuadraticPolynomialZero(coefficients, fallback);
      }
      if (!Number.isFinite(b) || !Number.isFinite(c) || !Number.isFinite(d)) {
        return fallback;
      }
      const normalizedB = b / a;
      const normalizedC = c / a;
      const normalizedD = d / a;
      const p = normalizedC - (normalizedB * normalizedB / 3);
      const q = (2 * normalizedB * normalizedB * normalizedB / 27) - (normalizedB * normalizedC / 3) + normalizedD;
      const discriminant = (q * q / 4) + (p * p * p / 27);
      const offset = normalizedB / 3;
      if (discriminant > 1e-12) {
        const sqrtDiscriminant = Math.sqrt(discriminant);
        return Math.cbrt(-q / 2 + sqrtDiscriminant) + Math.cbrt(-q / 2 - sqrtDiscriminant) - offset;
      }
      if (Math.abs(discriminant) <= 1e-12) {
        const u = Math.cbrt(-q / 2);
        return selectClosestRoot([
          (2 * u) - offset,
          -u - offset
        ], fallback);
      }
      const radius = 2 * Math.sqrt(-p / 3);
      const acosInput = clamp((3 * q / (2 * p)) * Math.sqrt(-3 / p), -1, 1);
      const angle = Math.acos(acosInput) / 3;
      return selectClosestRoot([
        radius * Math.cos(angle) - offset,
        radius * Math.cos(angle - (2 * Math.PI / 3)) - offset,
        radius * Math.cos(angle - (4 * Math.PI / 3)) - offset
      ], fallback);
    }

    function solveCubicZeroFromSamples(samples, fallback) {
      const coefficients = getInterpolatingPolynomialCoefficients(samples);
      return coefficients ? solveCubicPolynomialZero(coefficients, fallback) : fallback;
    }

    function estimateNextDesStrAngForOuterPass(currentDesStrAng, innerLoopSolution, outerPassIndex) {
      const baseDesStrAng = Number.isFinite(Number(currentDesStrAng))
        ? Number(currentDesStrAng)
        : getHeadingDesStrAngSeed(innerLoopSolution);
      const nextOuterPass = Number(outerPassIndex);
      if (!Number.isFinite(nextOuterPass) || nextOuterPass < 1) {
        return boundDesStrAngSeed(baseDesStrAng);
      }
      const passes = Array.isArray(innerLoopSolution?.passes) ? innerLoopSolution.passes : [];
      const finalPasses = [];
      const seenOuterPasses = new Set();
      passes.forEach((pass) => {
        const hEst = Number(pass?.hEst);
        if (!Number.isFinite(hEst) || seenOuterPasses.has(hEst)) {
          return;
        }
        const finalPass = getFinalOuterPassLog(passes, hEst);
        if (finalPass) {
          finalPasses.push(finalPass);
          seenOuterPasses.add(hEst);
        }
      });
      const validFinalPasses = finalPasses.filter((pass) => {
        const pErr = Number(pass?.pErr);
        return Number.isFinite(pErr) && Math.abs(pErr) <= ESTIMATOR_POSITION_ERROR_THRESHOLD;
      });
      const referencePasses = validFinalPasses.length ? validFinalPasses : finalPasses;
      const latestPass = referencePasses[referencePasses.length - 1] || getLatestLoggedPass(innerLoopSolution);
      const previousPass = referencePasses[referencePasses.length - 2] || null;
      const targetHerr = -ESTIMATOR_HEADING_ERROR_THRESHOLD * 0.1;
      const latestDesStrAng = Number(latestPass?.desStrAng ?? baseDesStrAng);
      const latestHerr = Number(latestPass?.hErr ?? innerLoopSolution?.hErr);
      const previousDesStrAng = Number(previousPass?.desStrAng ?? baseDesStrAng);
      const previousHerr = Number(previousPass?.hErr ?? innerLoopSolution?.hErr);

      if (
        Number.isFinite(latestDesStrAng)
        && Number.isFinite(latestHerr)
        && Number.isFinite(previousDesStrAng)
        && Number.isFinite(previousHerr)
        && Math.abs(latestHerr - targetHerr) > 1e-12
        && Math.abs(previousHerr - targetHerr) > 1e-12
      ) {
        const previousOffset = previousHerr - targetHerr;
        const latestOffset = latestHerr - targetHerr;
        if (previousOffset === 0 || latestOffset === 0 || (previousOffset < 0 && latestOffset > 0) || (previousOffset > 0 && latestOffset < 0)) {
          const denominator = latestHerr - previousHerr;
