          if (Math.abs(denominator) > 1e-12) {
            const estimated = previousDesStrAng + ((targetHerr - previousHerr) * (latestDesStrAng - previousDesStrAng)) / denominator;
            const bounded = boundDesStrAngSeed(estimated);
            if (Number.isFinite(bounded) && Math.abs(bounded - latestDesStrAng) > 1e-12) {
              return bounded;
            }
          }
        }
      }

      if (
        Number.isFinite(latestDesStrAng)
        && Number.isFinite(latestHerr)
        && Number.isFinite(previousDesStrAng)
        && Number.isFinite(previousHerr)
        && Math.abs(latestDesStrAng - previousDesStrAng) > 1e-12
      ) {
        const slope = (latestHerr - previousHerr) / (latestDesStrAng - previousDesStrAng);
        if (Number.isFinite(slope) && Math.abs(slope) > 1e-12) {
          const estimated = latestDesStrAng - ((latestHerr - targetHerr) / slope);
          const bounded = boundDesStrAngSeed(estimated);
          if (Number.isFinite(bounded) && Math.abs(bounded - latestDesStrAng) > 1e-12) {
            return bounded;
          }
        }
      }

      if (Number.isFinite(latestDesStrAng) && Number.isFinite(latestHerr)) {
        const direction = latestHerr > targetHerr ? -1 : 1;
        const step = clamp(Math.abs(latestHerr - targetHerr) * 0.5, ESTIMATOR_HEADING_ERROR_THRESHOLD, 0.25);
        const estimated = latestDesStrAng + (direction * step);
        const bounded = boundDesStrAngSeed(estimated);
        if (Number.isFinite(bounded) && Math.abs(bounded - latestDesStrAng) > 1e-12) {
          return bounded;
        }
      }

      return boundDesStrAngSeed(baseDesStrAng);
    }

    function getOuterLoopInitialSwtdSeed(solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      const initialPass = passes.find((pass) =>
        Number(pass?.hEst ?? 0) === 0 && Number(pass?.pass ?? 0) === 0
      ) || passes[0] || null;
      return limitSwtdMinimum(initialPass?.swtd ?? initialPass?.pathCenter ?? solution?.initialSwtdSeed ?? state.ui?.swtd);
    }

    function buildNextDesStrAngOuterPassSeed(solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution) {
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      const currentOuterPass = getHeadingEstimateIndex(solution);
      const currentPasses = passes.filter((pass) => {
        const passOuter = Number.isFinite(Number(pass?.hEst)) ? Number(pass.hEst) : currentOuterPass;
        return passOuter === currentOuterPass;
      });
      const seedPass = currentPasses.find((pass) => Number(pass?.pass) === 0)
        || currentPasses[0]
        || getLatestLoggedPass(solution);
      const completedInnerLoop = evaluatePassLoopExit(solution);
      const seedSwtd = getOuterLoopInitialSwtdSeed(solution);
      const currentDesStrAng = Number.isFinite(Number(seedPass?.desStrAng))
        ? Number(seedPass.desStrAng)
        : getHeadingDesStrAngSeed(solution);
      return {
        outerPass: currentOuterPass + 1,
        swtd: seedSwtd,
        desStrAng: estimateNextDesStrAngForOuterPass(currentDesStrAng, solution, currentOuterPass + 1),
        previousInnerExit: completedInnerLoop
      };
    }

    function startDesStrAngEstimatePass(outerPass, seedSwtd, seedDesStrAng, autoRunInnerLoop = true) {
      const previousPasses = Array.isArray(simpleArcFullSolution?.passes)
        ? simpleArcFullSolution.passes
        : [];
      simpleArcHeadingEstimateIndex = Math.max(0, Math.trunc(Number(outerPass) || 0));
      state.ui.swtd = limitSwtdMinimum(seedSwtd);
      state.arc.desStrAng = boundDesStrAngSeed(Number.isFinite(Number(seedDesStrAng)) ? Number(seedDesStrAng) : getInitialDesStrAngSeed());
      const hrtSeed = deriveHeadingRateFromDesStrAng(state.arc.desStrAng, state.ui.swtd);
      state.arc.slew = Number.isFinite(hrtSeed) ? hrtSeed : 0;
      const result = recalculateVehicleSolution({
        initialSwtdSeed: simpleArcFullSolution?.initialSwtdSeed ?? seedSwtd,
        seedSwtd: state.ui.swtd,
        seedDesStrAng: state.arc.desStrAng,
        commitDisplay: false,
        persist: false,
        render: false
      });
      result.completedAloopPasses = previousPasses;
      result.desStrAngEstimatePhase = "innerLoop";
      result.desStrAngLoopExit = null;
      result.desStrAngExitCode = null;
      simpleArcFullSolution = result;
      state.simpleArcTrace = result;
      state.simpleArcSolution = result;
      if (autoRunInnerLoop) {
        runPositionEstimateInnerLoop(result);
      }
      return result;
    }

    function advanceDesStrAngEstimatePass() {
      const solution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution;
      if (simpleArcInnerLoopRunning) {
        return false;
      }
      applyPassLoopExitState(solution);
      if (evaluateDesStrAngLoopExit(solution)) {
        return false;
      }
      const seed = buildNextDesStrAngOuterPassSeed(solution);
      if (!seed || !Number.isFinite(Number(seed.swtd))) {
        return false;
      }
      return Boolean(startDesStrAngEstimatePass(seed.outerPass, seed.swtd, seed.desStrAng));
    }

    function startHeadingEstimatePass(hEst, seedSwtd, seedDesStrAng) {
      return startDesStrAngEstimatePass(hEst, seedSwtd, seedDesStrAng);
    }

    function advanceHeadingEstimatePass() {
      return advanceDesStrAngEstimatePass();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

    function degToRad(value) {
      return (value * Math.PI) / 180;
    }

    function getHeadingChangeStep() {
      return degToRad(5);
    }

    function snapHeadingChange(value) {
      const step = getHeadingChangeStep();
      const numeric = Math.max(0, Number(value) || 0);
      return Math.floor(numeric / step) * step;
    }

    function getHeadingChange(geometry = state.vehicle) {
      return Math.max(0, Number(geometry?.headingChange) || 0);
    }

    function getSolverInitialSl(source = getSimpleArcDeltaPsi()) {
      if (source && typeof source === "object") {
        const sourceDesStrAng = Number(source.desStrAng ?? source.arc?.desStrAng);
        const sourceSwtd = Number(source.swtd ?? source.s ?? source.pathCenter ?? state.ui?.swtd);
        if (Number.isFinite(sourceDesStrAng) && Number.isFinite(sourceSwtd) && Math.abs(sourceSwtd) > 1e-12) {
          return normalizeSlew(sourceDesStrAng / sourceSwtd);
        }
        const solutionSl = Number(source.slew ?? source.sl);
        if (Number.isFinite(solutionSl) && solutionSl > 1e-12) {
          return normalizeSlew(solutionSl);
        }
        const arcSlew = Number(source.arc?.slew);
        if (Number.isFinite(arcSlew) && arcSlew > 1e-12) {
          return normalizeSlew(arcSlew);
        }
      }

      const arcSlew = Number(state.arc?.slew);
      if (Number.isFinite(arcSlew) && arcSlew > 1e-12) {
        return normalizeSlew(arcSlew);
      }

      const solutionSl = Number(source?.sl ?? source?.slew);
      if (Number.isFinite(solutionSl) && solutionSl > 1e-12) {
        return normalizeSlew(solutionSl);
      }

      const numeric = Math.abs(Number(source));
      if (Number.isFinite(numeric) && numeric > 1e-12) {
        return normalizeSlew(numeric * 0.25);
      }
      return normalizeSlew(Math.PI / 4);

    function getDerivedTerminalRadius(terminalPose, vc, fallbackRadius = NaN) {
      const poseX = Number(terminalPose?.x);
      const poseY = Number(terminalPose?.y);
      const vcX = Number(vc?.x);
      const vcY = Number(vc?.y);
      if (Number.isFinite(poseX) && Number.isFinite(poseY) && Number.isFinite(vcX) && Number.isFinite(vcY)) {
        const distance = Math.hypot(poseX - vcX, poseY - vcY);
        if (Number.isFinite(distance) && distance > 0) {
          return distance;
        }
      }
      const numericFallback = Number(fallbackRadius);
      return Number.isFinite(numericFallback) ? Math.abs(numericFallback) : NaN;
    }

    function getCurveLengthFromGeometry(geometry = state.vehicle) {
      const radius = Number(geometry?.radius) || 0;

    }

    function radToDeg(value) {
      return (value * 180) / Math.PI;
    }

    function formatAngle(rad) {

    function formatDeltaPsiDisplay(rad) {

    function snapDeltaPsiToWholeDegrees(rad) {

    function clampDeltaPsiDegrees(degrees) {
      return clamp(Number(degrees) || 0, 0, 180);
    }

    function getDeltaPsiStep(degrees, maxDegrees = 180) {
      const limit = Math.max(0, Number(maxDegrees) || 0);
      const value = clamp(Number(degrees) || 0, 0, limit);
      const distanceToLimit = Math.min(value, Math.max(0, limit - value));
      if (distanceToLimit <= 0.01) return 0.001;
      if (distanceToLimit <= 0.1) return 0.01;
      if (distanceToLimit <= 1) return 0.1;
      if (distanceToLimit <= 5) return 0.5;
      if (distanceToLimit <= 15) return 1;
      if (distanceToLimit <= 45) return 5;
      return 10;
    }

    function normalizeDeltaPsiDegrees(degrees, maxDegrees = 180) {
      const clamped = clamp(Number(degrees) || 0, 0.001, Math.max(0.001, Number(maxDegrees) || 0));
      return Number(clamped.toFixed(3));
    }

    function formatDeltaPsiDegreesValue(degrees, maxDegrees = 180) {
      return Number(clamp(Number(degrees) || 0, 0.001, Math.max(0.001, Number(maxDegrees) || 0)) || 0).toFixed(3);
    }

    function normalizeDeltaPsi(rad, maxDegrees = 180) {
      return degToRad(normalizeDeltaPsiDegrees(radToDeg(Number(rad) || 0), maxDegrees));
    }

    function formatFixed2(value) {
      return (Number(value) || 0).toFixed(2);
    }

    function formatFixed3(value) {
      return (Number(value) || 0).toFixed(3);
    }

    function formatDebugNumber(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return "NaN";
      const abs = Math.abs(numeric);
      if ((abs > 0 && abs < 0.0001) || abs >= 1000) {
        return numeric.toExponential(3);
      }
      return numeric.toFixed(5).replace(/\.?0+$/, "");
    }

    function formatAlignedNumber(value, decimals, width) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return "NaN".padStart(width, " ");
      return numeric.toFixed(decimals).padStart(width, " ");
    }

    function formatPassIndex(value) {
      const numeric = Number(value);

      return String(Math.trunc(numeric)).padStart(7, " ");
    }

    function formatPassDistance(value) {

    function formatPassSeedValue(value) {
      return formatAlignedNumber(value, 9, 16);
    }

    function formatPassAngle(value) {

    }

    function formatPassError(value) {

    function getRadiusStep(value) {
      const magnitude = Math.abs(Number(value) || 0);
      if (magnitude < 0.001) return 0.0001;
      if (magnitude < 0.01) return 0.001;
      if (magnitude < 0.1) return 0.01;
      if (magnitude < 1) return 0.1;
      if (magnitude < 10) return 1;
      if (magnitude < 100) return 10;
      if (magnitude < 1000) return 100;
      return 1000;
    }

    function normalizeRadiusValue(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 1;

    }

    function formatRadiusValue(value) {
      const numeric = Number(value);

      return clamped.toFixed(clamped < 0.001 ? 4 : 3);
    }

    function getSteerMaxStepDegrees(value) {
      const degrees = clamp(Number(value) || 0, 22.5, 90);
      const distanceToLimit = Math.min(degrees - 22.5, 90 - degrees);
      if (distanceToLimit <= 0.01) return 0.001;
      if (distanceToLimit <= 0.1) return 0.01;
      if (distanceToLimit <= 1) return 0.1;
      if (distanceToLimit <= 5) return 0.5;

    function normalizeSteerMaxDegrees(degrees) {
      const clamped = clamp(Number(degrees) || 0, 22.5, 90);

    function formatSteerMaxValue(value) {

    function normalizeSlew(value) {

    }

    function normalizeSlewDegrees(value) {
      const clamped = clamp(Number(value) || 0, radToDeg(0.001), 90);
      return clamped;
    }

    function formatSlewValue(value) {
      return Number(value || 0).toFixed(3);
    }

    function getHeadingSteerAngleDegrees(arc = state.arc, swtd = state.ui.swtd) {
      const headingChangeRate = radToDeg(getSimpleArcSlew(arc, swtd));
      const travelDistance = Math.max(SWTD_MIN, Number(swtd) || 0);
      return headingChangeRate * travelDistance;
    }

    function getInitialSwtdSeed(rawTurn = getSimpleArcDeltaPsi(), radius = Number(state.arc?.radius) || 0) {
      return Math.max(SWTD_MIN, Math.abs(Number(rawTurn) || 0) * 0.25 * Math.max(SWTD_MIN, Math.abs(Number(radius) || 0)));
    }

    function getInitialDesStrAngSeed(arc = getSimpleArcGeometry()) {
      let geometry = arc;
      if (!geometry?.valid) {
        const radius = Number(arc?.radius) || 1;
        const deltaPsi = Number.isFinite(Number(arc?.deltaPsi))
          ? Number(arc.deltaPsi)
          : (Number.isFinite(Number(arc?.angle))
            ? Number(arc.angle)
            : (Number.isFinite(Number(arc?.length)) && Math.abs(radius) > 1e-9
              ? Number(arc.length) / Math.abs(radius)
              : Math.PI / 2));
        const arcLength = Math.abs(radius) * deltaPsi;
        const turnAngle = Math.abs(radius) > 1e-9 ? arcLength / radius : 0;
        const startAngle = radius >= 0 ? -Math.PI / 2 : Math.PI / 2;
        geometry = {
          radius,
          deltaPsi,
          arcLength,
          turnAngle,
          center: { x: 0, y: radius },
          startAngle,
          endAngle: startAngle + turnAngle,
          valid: Number.isFinite(radius) && Number.isFinite(deltaPsi) && Math.abs(radius) > 1e-9 && deltaPsi !== 0
        };

      const bisector = getSimpleArcBisectorGeometry(geometry);
      const relativeBisectorAngle = Number(geometry?.turnAngle) / 2;
      if (Number.isFinite(relativeBisectorAngle)) {

      const bisectorAngle = Number(bisector?.bisectorAngle);
      return Math.max(0, 0.75 * (Number.isFinite(bisectorAngle) ? Math.abs(bisectorAngle) : 0));

    function deriveHeadingRateFromDesStrAng(desStrAng, swtd) {
      const numerator = Number(desStrAng);
      const distance = Number(swtd);
      if (Number.isFinite(numerator) && Number.isFinite(distance) && Math.abs(distance) > 1e-12) {
        return normalizeSlew(numerator / distance);

      return NaN;

    function getInitialHrtSeed(arc = getSimpleArcGeometry(), swtd = state.ui?.swtd) {
      const derived = deriveHeadingRateFromDesStrAng(getInitialDesStrAngSeed(arc), swtd);
      if (Number.isFinite(derived)) {
        return derived;
      }
      return normalizeSlew(0.25 * (Number.isFinite(Number(getSimpleArcBisectorGeometry(arc)?.bisectorAngle))
        ? Math.abs(Number(getSimpleArcBisectorGeometry(arc)?.bisectorAngle))
        : 0));
    }

    function getSignedBisectorDistance(vc, bisector) {
      const centerX = Number(bisector?.center?.x);
      const centerY = Number(bisector?.center?.y);
      const vcX = Number(vc?.x);
      const vcY = Number(vc?.y);
      if (!Number.isFinite(centerX) || !Number.isFinite(centerY) || !Number.isFinite(vcX) || !Number.isFinite(vcY)) {
        return NaN;
      }
      const normal = bisector?.bisectorNormal || bisector?.bisectorDir
        ? {
            x: Number(bisector?.bisectorNormal?.x) || -(Number(bisector?.bisectorDir?.y) || 0),
            y: Number(bisector?.bisectorNormal?.y) || (Number(bisector?.bisectorDir?.x) || 0)
          }
        : null;
      const length = Math.hypot(Number(normal?.x) || 0, Number(normal?.y) || 0);
      if (!length) return NaN;
      const offsetX = vcX - centerX;
      const offsetY = vcY - centerY;
      return (offsetX * (normal.x / length)) + (offsetY * (normal.y / length));

        if (drag.type === "pan") {
          state.view.offsetX = drag.startOffsetX + (event.clientX - drag.startClientX);
          state.view.offsetY = drag.startOffsetY + (event.clientY - drag.startClientY);
        }
        saveState();
        scheduleRender();
        return;
      }

      canvas.style.cursor = "grab";
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      const p = canvasPoint(event);
      drag = {
        type: "pan",
        startClientX: event.clientX,
        startClientY: event.clientY,
        startOffsetX: state.view.offsetX,
        startOffsetY: state.view.offsetY
      };
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointerup", () => {
      if (!drag) return;
      drag = null;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointercancel", () => {
      drag = null;
      scheduleRender();
    });

    canvas.addEventListener("pointerleave", () => {
      lastPointerWorld = null;
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const zoomFactor = Math.exp(-event.deltaY * 0.0012);
      const rect = canvas.getBoundingClientRect();
      const cursorX = event.clientX - rect.left;
      const cursorY = event.clientY - rect.top;
      const before = screenToWorld(cursorX, cursorY);
      state.view.scale = Math.max(1e-6, state.view.scale * zoomFactor);
      state.view.offsetX = cursorX - rect.width / 2 - before.x * state.view.scale;
      state.view.offsetY = cursorY - rect.height / 2 + before.y * state.view.scale;
      saveState();
      scheduleRender();
    }, { passive: false });

    function syncInputs() {
      const radius = Number(state.arc?.radius) || 1;
      arcRadiusInput.step = String(getRadiusStep(radius));
      if (document.activeElement !== arcRadiusInput) {
        arcRadiusInput.value = formatRadiusValue(radius);
      }
      const deltaPsiMaxDegrees = getDeltaPsiMaxDegrees();
      const deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      const deltaPsiDegrees = normalizeDeltaPsiDegrees(radToDeg(deltaPsi), deltaPsiMaxDegrees);
      arcAngleInput.max = String(deltaPsiMaxDegrees);
      arcAngleInput.step = "0.001";
      if (document.activeElement !== arcAngleInput) {
        arcAngleInput.value = formatDeltaPsiDegreesValue(deltaPsiDegrees, deltaPsiMaxDegrees);
      }
      const steerMax = normalizeSteerMax(getSimpleArcSteerMax());
      const steerMaxDegrees = normalizeSteerMaxDegrees(radToDeg(steerMax));
      arcSteerMaxInput.step = String(getSteerMaxStepDegrees(steerMaxDegrees));
      if (document.activeElement !== arcSteerMaxInput) {
        arcSteerMaxInput.value = formatSteerMaxValue(steerMaxDegrees);
      }
    }

    function bindDeferredNumericInput(input, { format, commit, selectOnFocus = true }) {
      let skipNextBlurReset = false;
      input.addEventListener("focus", () => {
        input.value = format();
        if (selectOnFocus) {
          input.select();
        }
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          commit();
          input.value = format();
          skipNextBlurReset = true;
          input.blur();
          return;
        }
        if (event.key === "Escape") {
          event.preventDefault();
          input.value = format();
          skipNextBlurReset = true;
          input.blur();
        }
      });
      input.addEventListener("change", () => {
        commit();
        input.value = format();
      });
      input.addEventListener("blur", () => {
        if (skipNextBlurReset) {
          skipNextBlurReset = false;
          return;
        }
        input.value = format();
      });
    }

    function applySeedLookupBootstrapEntry() {
      const bootstrapStepIndex = SEED_LOOKUP_RAW_PSI_AXIS.findIndex((rawPsiDegrees) => Math.abs(rawPsiDegrees - SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees) < 1e-12);
      seedLookupState.stepIndex = bootstrapStepIndex >= 0 ? bootstrapStepIndex : seedLookupState.stepIndex;
      seedLookupState.rawPsiDegrees = SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees;
      seedLookupState.steerMaxDegrees = SEED_LOOKUP_STEER_MAX_DEGREES;
      seedLookupState.radiusIndex = getSeedLookupRadiusIndex(SEED_LOOKUP_FIXED_RADIUS);
      seedLookupState.radiusValue = SEED_SWEEP_RADIUS_AXIS[seedLookupState.radiusIndex] ?? SEED_LOOKUP_FIXED_RADIUS;
      state.arc.radius = SEED_LOOKUP_FIXED_RADIUS;
      state.arc.deltaPsi = degToRad(SEED_LOOKUP_BOOTSTRAP_ENTRY.rawPsiDegrees);
      state.arc.angle = state.arc.deltaPsi;
      state.arc.steerMax = degToRad(SEED_LOOKUP_BOOTSTRAP_ENTRY.steerMaxDegrees);
      state.ui.swtd = limitSwtdMinimum(SEED_LOOKUP_BOOTSTRAP_ENTRY.swtd * SEED_LOOKUP_INITIAL_SWTD_MULTIPLIER);
      state.arc.desStrAng = boundDesStrAngSeed(SEED_LOOKUP_BOOTSTRAP_ENTRY.desStrAng, state.arc.steerMax);
      const seededSlew = deriveHeadingRateFromDesStrAng(state.arc.desStrAng, state.ui.swtd);
      state.arc.slew = Number.isFinite(seededSlew) ? seededSlew : getInitialHrtSeed(undefined, state.ui.swtd);
      state.arc.length = getSimpleArcLength();
      refreshStarterSeedArray();
    }

    window.SplineLabSeedSweep = {
      version: SEED_SWEEP_CHECKPOINT_VERSION,
      radiusAxis: SEED_SWEEP_RADIUS_AXIS.slice(),
      rawPsiAxis: SEED_SWEEP_RAW_PSI_AXIS.slice(),
      steerMaxDegrees: SEED_SWEEP_STEER_MAX_DEGREES,
      totalEntries: SEED_SWEEP_TOTAL_ENTRIES,
      getStarterSeedForRequest: (radius, rawPsiDegrees, steerMaxDegrees) => getStarterSeedForRequest(radius, rawPsiDegrees, steerMaxDegrees),
      solveStarterSeedRequest: (request = {}) => {
        const radius = Number.isFinite(Number(request.radius)) ? Number(request.radius) : SEED_LOOKUP_FIXED_RADIUS;
        const rawPsiDegrees = Number.isFinite(Number(request.rawPsiDegrees)) ? Number(request.rawPsiDegrees) : SEED_LOOKUP_RAW_PSI_MIN_DEGREES;
        const steerMaxDegrees = Number.isFinite(Number(request.steerMaxDegrees))
          ? Number(request.steerMaxDegrees)
          : SEED_LOOKUP_STEER_MAX_DEGREES;
        const vehicleX = Number.isFinite(Number(request.vehicleX)) ? Number(request.vehicleX) : 0;
        const vehicleY = Number.isFinite(Number(request.vehicleY)) ? Number(request.vehicleY) : 0;
        const vehicleAngle = Number.isFinite(Number(request.vehicleAngle)) ? Number(request.vehicleAngle) : 0;
        const hEst = Number.isFinite(Number(request.hEst)) ? Number(request.hEst) : 0;
        const params = new URLSearchParams({
          radius: String(radius),
          rawPsiDegrees: String(rawPsiDegrees),
          steerMaxDegrees: String(steerMaxDegrees),
          vehicleX: String(vehicleX),
          vehicleY: String(vehicleY),
          vehicleAngle: String(vehicleAngle),
          hEst: String(hEst)
        });
        const xhr = new XMLHttpRequest();
        xhr.open("GET", `/api/starter-seed-solve?${params.toString()}`, false);
        xhr.send(null);
        if (xhr.status < 200 || xhr.status >= 300) {
          throw new Error(`starter-seed-solve failed: HTTP ${xhr.status}`);
        }
        return JSON.parse(xhr.responseText);
      },
      solveEntry: (entry = {}) => {
        const radius = Number(entry.radius);
        const rawPsiDegrees = Number(entry.rawPsiDegrees);
        const steerMaxDegrees = Number.isFinite(Number(entry.steerMaxDegrees))
          ? Number(entry.steerMaxDegrees)
          : SEED_SWEEP_STEER_MAX_DEGREES;
        const starterSeed = getStarterSeedForRequest(radius, rawPsiDegrees, steerMaxDegrees);
        const deltaPsi = degToRad(Number.isFinite(rawPsiDegrees) ? rawPsiDegrees : SEED_LOOKUP_RAW_PSI_MIN_DEGREES);
        const seedSwtd = limitSwtdMinimum(Number.isFinite(Number(entry.seedSwtd))
          ? Number(entry.seedSwtd)
          : (Number.isFinite(Number(entry.swtd))
            ? Number(entry.swtd)
            : Number(starterSeed.swtd)));
        const fallbackArc = {
          radius: Number.isFinite(radius) ? radius : SEED_LOOKUP_FIXED_RADIUS,
          deltaPsi,
          angle: deltaPsi,
          length: Math.abs(Number.isFinite(radius) ? radius : SEED_LOOKUP_FIXED_RADIUS) * Math.abs(deltaPsi),
          steerMax: degToRad(steerMaxDegrees)
        };
        const seedDesStrAngInput = Number.isFinite(Number(entry.seedDesStrAng))
          ? Number(entry.seedDesStrAng)
          : (Number.isFinite(Number(entry.desStrAng))
            ? Number(entry.desStrAng)
            : Number(starterSeed.desStrAng));
        const seedDesStrAng = boundDesStrAngSeed(seedDesStrAngInput, degToRad(steerMaxDegrees));
        const seedSlewDerived = deriveHeadingRateFromDesStrAng(seedDesStrAng, seedSwtd);
        const seedSlew = Number.isFinite(seedSlewDerived)
          ? seedSlewDerived
          : getInitialHrtSeed(fallbackArc, seedSwtd);
        state.arc.radius = fallbackArc.radius;
        state.arc.deltaPsi = fallbackArc.deltaPsi;
        state.arc.angle = fallbackArc.angle;
        state.arc.length = fallbackArc.length;
        state.arc.steerMax = fallbackArc.steerMax;
        state.ui.swtd = seedSwtd;
        state.arc.desStrAng = seedDesStrAng;
        state.arc.slew = seedSlew;
        simpleArcHeadingEstimateIndex = 0;
        simpleArcPassIndex = 0;
        const result = recalculateVehicleSolution({
          seedSwtd,
          seedDesStrAng,
          persist: false,
          render: false,
          commitDisplay: false
        });
        return {
          result,
          summary: summarizeSeedSweepResult(result, {
            radius: fallbackArc.radius,
            rawPsiDegrees: Number.isFinite(rawPsiDegrees) ? rawPsiDegrees : SEED_LOOKUP_RAW_PSI_MIN_DEGREES,
            steerMaxDegrees,
            seedSwtd,
            seedDesStrAng
          })
        };
      },
      getCheckpoint: () => normalizeSeedSweepCheckpoint(seedSweepState.checkpoint),
      setCheckpoint: (checkpoint) => saveSeedSweepCheckpoint(checkpoint),
      saveCheckpoint: () => saveSeedSweepCheckpoint(seedSweepState.checkpoint),
      loadCheckpoint: () => {
        const checkpoint = loadSeedSweepCheckpoint();
        if (checkpoint) {
          seedSweepState.checkpoint = checkpoint;
        }
        return normalizeSeedSweepCheckpoint(seedSweepState.checkpoint);
      },
      getProgress: () => getSeedSweepProgress(seedSweepState.checkpoint),
      isComplete: () => isSeedSweepComplete(seedSweepState.checkpoint),
      clearCheckpoint: () => {
        seedSweepState.checkpoint = createSeedSweepCheckpoint();
        try {
          localStorage.removeItem(SEED_SWEEP_CHECKPOINT_KEY);
        } catch {
          // Best-effort only.
        }
        return normalizeSeedSweepCheckpoint(seedSweepState.checkpoint);
      }
    };

    function refreshDerivedSelectorState() {
      if (SEED_LOOKUP_BOOTSTRAP_MODE) {
        applySeedLookupBootstrapEntry();
        return;
      }
      state.ui.swtd = getInitialSwtdSeed(state.arc.deltaPsi, state.arc.radius);
      state.arc.desStrAng = boundDesStrAngSeed(getInitialDesStrAngSeed());
      state.arc.slew = getInitialHrtSeed(undefined, state.ui.swtd);
      state.arc.length = getSimpleArcLength();
    }

    function recalculateFromSelectorChange() {
      refreshDerivedSelectorState();
      simpleArcHeadingEstimateIndex = 0;
      simpleArcPassIndex = 0;
      const result = recalculateVehicleSolution({ commitDisplay: false, persist: false, render: false });
      simpleArcFullSolution = result;
      state.simpleArcTrace = result;
      state.simpleArcSolution = result;
      runSeedLookupBootstrapLoops(result);
      return result;
    }

    function recalculateVehicleSolution(options = {}) {
      const persist = options.persist !== false;
      const render = options.render !== false;
      const commitDisplay = options.commitDisplay !== false;
      if (debugData) {
        debugData.textContent = "";
      }
      const activeVehicle = getActiveVehicle();
      const seedSwtdInput = limitSwtdMinimum(options.seedSwtd ?? state.ui?.swtd ?? getInitialSwtdSeed(state.arc?.deltaPsi, state.arc?.radius));
      const seedDesStrAngInput = boundDesStrAngSeed(Number.isFinite(Number(options.seedDesStrAng))
        ? Number(options.seedDesStrAng)
        : (Number.isFinite(Number(state.arc?.desStrAng))
          ? Number(state.arc.desStrAng)
          : getInitialDesStrAngSeed(getSimpleArcGeometry())));
      const seedSlewDerived = deriveHeadingRateFromDesStrAng(seedDesStrAngInput, seedSwtdInput);
      const seedSlewInput = Number.isFinite(seedSlewDerived)
        ? seedSlewDerived
        : normalizeSlew(
          Number(options.seedHrt)
          || Number(state.arc?.slew)
          || getInitialHrtSeed(getSimpleArcGeometry(), seedSwtdInput)
        );
      state.arc.desStrAng = seedDesStrAngInput;
      state.arc.slew = seedSlewInput;
      const arc = getSimpleArcGeometry();
      const solved = solveSimpleArc(arc);
      const terminalPose = solved?.terminalPose || null;
      const vc = solved?.vc || solved?.complexVc || null;
      const bisector = getSimpleArcBisectorGeometry(arc);
      const finalPose = solved?.finalPose || solved?.terminalPose || null;
      const terminalPoseForCurve = finalPose ? {
        x: Number(finalPose.x) || 0,
        y: Number(finalPose.y) || 0,
        angle: Number(finalPose.angle) || 0,
        strAng: Number(solved?.strAng ?? solved?.sl) || 0
      } : null;
      const complexTerminalPose = solved?.complexTerminalPose || terminalPoseForCurve || terminalPose || null;
      const complexVc = solved?.complexVc || vc || null;
      const terminalRadius = Number.isFinite(Number(solved?.terminalRadius))
        ? Number(solved.terminalRadius)
        : getDerivedTerminalRadius(complexTerminalPose, complexVc, Number(arc.radius) || 0);
      const positionError = Number(solved?.positionError);
      const signedHeadingError = getSignedHeadingNormalError(finalPose || terminalPose, bisector);
      const headingError = Number.isFinite(Number(solved?.headingError))
        ? Math.abs(Number(solved.headingError))
        : NaN;
      const headingNormalAngle = Number.isFinite(Number(solved?.headingNormalAngle))
        ? Number(solved.headingNormalAngle)
        : (finalPose ? normalizePositiveAngle(Number(finalPose.angle) + Math.PI / 2) : NaN);
      const headingNormalError = Number.isFinite(Number(solved?.headingNormalError))
        ? Math.abs(Number(solved.headingNormalError))
        : NaN;
      const success = Boolean(solved?.success)
        && Number.isFinite(positionError)
        && Number.isFinite(headingError)
        && Math.abs(positionError) <= 1e-7
        && headingError <= 1e-6;
      const hEst = simpleArcHeadingEstimateIndex;
      const result = {
        success,
        hEst,
        headingEstimateIndex: hEst,
        headingEstimatePhase: "pEst",
        headingEstimatePause: false,
        initialSwtdSeed: Number.isFinite(Number(options.initialSwtdSeed))
          ? limitSwtdMinimum(options.initialSwtdSeed)
          : seedSwtdInput,
        edgeCase: Boolean(solved?.edgeCase),
        edgeCaseReason: solved?.edgeCaseReason || null,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        s: Number(solved?.curveLength) || 0,
        slew: Number(solved?.slew ?? solved?.sl) || getSimpleArcSlew(arc),
        sl: Number(solved?.sl) || 0,
        desStrAng: seedDesStrAngInput,
        turnAngle: Number(solved?.turnAngle ?? solved?.headingChange) || 0,
        strAng: Number(solved?.strAng ?? terminalPoseForCurve?.strAng) || 0,
        finalHeading: Number(finalPose?.angle) || 0,
        curveLength: Number(solved?.curveLength) || 0,
        complexCurveLength: Number(solved?.complexCurveLength ?? solved?.curveLength) || 0,
        steeredWheelTravelDistance: Number(solved?.steeredWheelTravelDistance ?? solved?.curveLength) || 0,
        simpleCurveLength: Number(solved?.simpleCurveLength) || 0,
        totalTravelDistance: Number(solved?.totalTravelDistance) || (Number(solved?.curveLength) || 0),
        spTravelDistance: Number(solved?.spTravelDistance) || (Number(solved?.curveLength) || 0),
        positionError: Number.isFinite(positionError) ? Math.abs(positionError) : NaN,
        pErr: Number.isFinite(positionError) ? Math.abs(positionError) : NaN,
        headingError,
        headingNormalAngle,
        headingNormalError,
        headingNormalSatisfied: Number.isFinite(headingNormalError) && headingNormalError <= 1e-5,
        hErr: signedHeadingError,
        vc,
        terminalPose: finalPose,
        finalPose,
        complexTerminalPose,
        complexVc,
        terminalRadius,
        terminalCoord: finalPose ? createCoord(finalPose.x, finalPose.y, finalPose.angle, 1, VEHICLE_BODY_LABEL, "#7dd3fc") : null,
        complexCurve: {
          valid: Boolean(arc?.valid),
          center: { ...arc.center },
          radius: Number(arc.radius) || 0,
          startAngle: Number(arc.startAngle) || 0,
          endAngle: Number(arc.endAngle) || 0,
          turnAngle: Number(arc.turnAngle) || 0,
          arcLength: Number(arc.arcLength) || 0,
          pathPoints: sampleSimpleArcPoints(arc),
          terminalPose: terminalPoseForCurve,
          vc,
          bisector
        },
        simpleCurve: null,
        pathPoints: Array.isArray(solved?.pathPoints) ? solved.pathPoints : [],
        bisector,
        steerMax: Number(arc.steerMax) || 0,
        passes: Array.isArray(solved?.passes) ? solved.passes : []
      };
      state.arc.deltaPsi = getSimpleArcDeltaPsi();
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      state.arc.slew = getSimpleArcSlew(state.arc, state.ui?.swtd);
      const signedPositionError = getSignedBisectorDistance(complexVc || vc, bisector);
      if (Array.isArray(result.passes) && result.passes.length) {
        const seedSwtd = seedSwtdInput;
        const seedSlew = seedSlewInput;
        result.passes = result.passes.map((pass, index) => index === 0 ? {
          ...(pass || {}),
          hEst,
          pass: Number.isFinite(Number(pass?.pass)) ? Number(pass.pass) : index,
          desStrAng: seedDesStrAngInput,
          swtd: seedSwtd,
          pathCenter: seedSwtd,
          pErr: Number.isFinite(Number(pass?.pErr)) ? Number(pass.pErr) : signedPositionError,
          hErr: Number.isFinite(Number(pass?.hErr)) ? Number(pass.hErr) : signedHeadingError,
          hRt: seedSlew,
          headingChangePerDistance: seedSlew,
          slew: seedSlew,
          sl: seedSlew
        } : {
          ...(pass || {}),
          hEst,
          pass: Number.isFinite(Number(pass?.pass)) ? Number(pass.pass) : index
        });
      }
      if (Array.isArray(options.previousPasses) && options.previousPasses.length) {
        result.passes = [
          ...options.previousPasses,
          ...result.passes
        ];
      }
      result.passes = applyPassErrors(result.passes, result);
      const renderResult = {
        ...buildSinglePassRenderSolution(result, 0),
        swtd: result.passes[0]?.swtd ?? seedSwtdInput,
        pathCenter: result.passes[0]?.pathCenter ?? seedSwtdInput,
        pErr: result.passes[0]?.pErr,
        dPErr: result.passes[0]?.dPErr,
        hErr: result.passes[0]?.hErr,
        dHErr: result.passes[0]?.dHErr,
        headingChangePerDistance: result.passes[0]?.headingChangePerDistance ?? seedSlewInput,
        slew: result.passes[0]?.slew ?? seedSlewInput,
        sl: result.passes[0]?.sl ?? seedSlewInput
      };
      if (commitDisplay) {
        simpleArcPassIndex = 0;
        simpleArcFullSolution = result;
        state.simpleArcTrace = result;
        state.simpleArcSolution = renderResult;
        syncVehicleShadows(result);
        if (activeVehicle) {
          activeVehicle.finalPose = result?.terminalPose ? { ...result.terminalPose } : null;
          if (Number.isFinite(Number(result?.sl))) {
            activeVehicle.sl = Number(result.sl);
          }
        }
        syncInputs();
        if (persist) saveState();
        applyPassLoopExitState(result);
        updateDebugData(result, 0);
        updateJson();
        if (render) scheduleRender();
      }
      return result;
    }

    bindDeferredNumericInput(arcRadiusInput, {
      format: () => formatRadiusValue(Number(state.arc?.radius) || 1),
      commit: () => {
        state.arc.radius = normalizeRadiusValue(arcRadiusInput.value);
        syncInputs();
        recalculateFromSelectorChange();
      }
    });
    bindDeferredNumericInput(arcAngleInput, {
      format: () => {
        const maxDegrees = getDeltaPsiMaxDegrees();
        const deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi(), maxDegrees);
        arcAngleInput.max = String(maxDegrees);
        return formatDeltaPsiDegreesValue(normalizeDeltaPsiDegrees(radToDeg(deltaPsi), maxDegrees), maxDegrees);
      },
      commit: () => {
        const value = Number(arcAngleInput.value);
        const maxDegrees = getDeltaPsiMaxDegrees();
        state.arc.deltaPsi = degToRad(normalizeDeltaPsiDegrees(Number.isFinite(value) ? value : 0, maxDegrees));
        state.arc.angle = state.arc.deltaPsi;
        state.arc.length = getSimpleArcLength();
        syncInputs();
        recalculateFromSelectorChange();
      }
    });

    bindDeferredNumericInput(arcSteerMaxInput, {
      format: () => {
        const steerMax = normalizeSteerMax(getSimpleArcSteerMax());
        const steerMaxDegrees = normalizeSteerMaxDegrees(radToDeg(steerMax));
        arcSteerMaxInput.step = String(getSteerMaxStepDegrees(steerMaxDegrees));
        return formatSteerMaxValue(steerMaxDegrees);
      },
      commit: () => {
        const value = Number(arcSteerMaxInput.value);
        const degrees = Number.isFinite(value) ? value : 90;
        const normalizedDegrees = normalizeSteerMaxDegrees(degrees);
        state.arc.steerMax = normalizeSteerMax(degToRad(normalizedDegrees));
        arcSteerMaxInput.step = String(getSteerMaxStepDegrees(normalizedDegrees));
        syncInputs();
        recalculateFromSelectorChange();
      }
    });

    window.addEventListener("resize", () => {
      if (setupCanvas()) {
        scheduleRender();
      }
    });

    const canvasResizeObserver = typeof ResizeObserver === "function"
      ? new ResizeObserver(() => {
          if (setupCanvas()) {
            scheduleRender();
          }
        })
      : null;
    if (canvasResizeObserver) {
      canvasResizeObserver.observe(canvas);
    }

    function fitView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [0];
      const ys = [0];
      const arc = getSimpleArcGeometry();
      if (arc.valid) {
        const arcPoints = sampleSimpleArcPoints(arc, 48);
        xs.push(0, arc.center.x, ...arcPoints.map(point => point.x));
        ys.push(0, arc.center.y, ...arcPoints.map(point => point.y));
      }
      const finalPose = state.simpleArcSolution?.terminalPose || getActiveVehicle()?.finalPose || null;
      if (finalPose) {
        const finalFront = {
          x: (Number(finalPose.x) || 0) + Math.cos(Number(finalPose.angle) || 0),
          y: (Number(finalPose.y) || 0) + Math.sin(Number(finalPose.angle) || 0)
        };
        xs.push(Number(finalPose.x) || 0, finalFront.x);
        ys.push(Number(finalPose.y) || 0, finalFront.y);
      }
      const traces = getSimpleArcPathTraces();
      for (const point of traces.pathPoints) {
        xs.push(Number(point.x) || 0);
        ys.push(Number(point.y) || 0);
      }
      for (const copy of state.vehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const strAng = Number(copy.strAng) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle),
          y: rear.y + Math.sin(bodyAngle)
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + strAng) * 0.25,
          y: front.y + Math.sin(bodyAngle + strAng) * 0.25
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.4, rangeXRaw * 0.08);
      const paddingY = Math.max(0.4, rangeYRaw * 0.08);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.96);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function fitVehicleSequenceView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [];
      const ys = [];
      const vehicleWidth = 1;
      const steerLength = 0.25;
      for (const copy of state.vehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const strAng = Number(copy.strAng) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle) * vehicleWidth,
          y: rear.y + Math.sin(bodyAngle) * vehicleWidth
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + strAng) * steerLength,
          y: front.y + Math.sin(bodyAngle + strAng) * steerLength
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      if (!xs.length || !ys.length) {
        return;
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.25, rangeXRaw * 0.06);
      const paddingY = Math.max(0.25, rangeYRaw * 0.06);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.98);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function initialize() {
      if (initialized) return;
      renderStatus.textContent = "Render: booting";
      applyOpenClawStatus("OpenClaw control launching...");
      if (nextPassButton) {
        nextPassButton.disabled = SEED_LOOKUP_BOOTSTRAP_MODE ? !hasNextSeedLookupRawPsiEntry() : false;
        nextPassButton.title = SEED_LOOKUP_BOOTSTRAP_MODE
          ? "Advance seed lookup to the next Raw Psi entry"
          : "swtd loop ready for next desStrAng pass";
        nextPassButton.addEventListener("click", async () => {
          if (SEED_LOOKUP_BOOTSTRAP_MODE) {
            await advanceSeedLookupRawPsiEntry();
          } else {
            advanceDesStrAngEstimatePass();
          }
        });
      }
      if (copyJsonButton) {
        copyJsonButton.addEventListener("click", copyJsonSnapshot);
      }
      if (toggleJsonCompactButton) {
        toggleJsonCompactButton.addEventListener("click", () => {
          setJsonCompactView(!jsonCompactView);
        });
      }
      refreshOpenClawStatus();
      if (!openclawStatusPoll) {
        openclawStatusPoll = window.setInterval(refreshOpenClawStatus, 5000);
      }
      if (!setupCanvas()) {
        renderStatus.textContent = "Render: waiting for layout";
        requestAnimationFrame(initialize);
        return;
      }
      initialized = true;
      state.Vehicles[0] = createAnchorVehicle(getSolverInitialSl(state.simpleArcSolution));
      state.ui.vehicle = true;
      refreshDerivedSelectorState();
      refreshStarterSeedArray();
      if (SEED_LOOKUP_BOOTSTRAP_MODE) {
        arcRadiusInput.disabled = true;
        arcAngleInput.disabled = true;
        arcSteerMaxInput.disabled = true;
      }
      syncInputs();
      const result = recalculateVehicleSolution({ persist: false, render: false, commitDisplay: false });
      simpleArcFullSolution = result;
      state.simpleArcTrace = result;
      state.simpleArcSolution = result;
      runSeedLookupBootstrapLoops(result);
      fitView();
      setupCanvas();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  </script>
</body>
</html>
