        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerS.x, centerS.y);
        ctx.lineTo(bisectorEndS.x, bisectorEndS.y);
        ctx.stroke();
        ctx.fillStyle = "rgba(126,240,191,0.92)";
        ctx.beginPath();
        ctx.arc(bisectorEndS.x, bisectorEndS.y, 3.75, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const endS = worldToScreen(arcPoints[arcPoints.length - 1].x, arcPoints[arcPoints.length - 1].y);
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Cor", centerS.x + 8, centerS.y - 8);
      ctx.fillText(`Radius = ${Math.abs(arc.radius).toFixed(2)}, Al = ${(arc.arcLength).toFixed(2)}`, endS.x + 10, endS.y - 8);
      ctx.restore();
    }

    function drawVehicleInstance(instance, options = {}) {
      const alpha = options.alpha ?? 1;
      const bodyWidth = options.bodyWidth ?? 3;
      const steerWidth = options.steerWidth ?? 2.5;
      const bodyLabel = options.label ?? "Veh";
      const steerLabel = options.steerLabel ?? "Sv";
      const bodyAngle = Number(instance.angle) || 0;
      const theta = Number(instance.theta) || 0;
      const rear = { x: Number(instance.x) || 0, y: Number(instance.y) || 0 };
      const front = {
        x: rear.x + Math.cos(bodyAngle),
        y: rear.y + Math.sin(bodyAngle)
      };
      const rearS = worldToScreen(rear.x, rear.y);
      const frontS = worldToScreen(front.x, front.y);
      const steerEnd = {
        x: front.x + Math.cos(bodyAngle + theta) * 0.25,
        y: front.y + Math.sin(bodyAngle + theta) * 0.25
      };
      const steerStartS = worldToScreen(front.x, front.y);
      const steerEndS = worldToScreen(steerEnd.x, steerEnd.y);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `rgba(125,211,252,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = bodyWidth;
      ctx.beginPath();
      ctx.moveTo(rearS.x, rearS.y);
      ctx.lineTo(frontS.x, frontS.y);
      ctx.stroke();

      ctx.strokeStyle = `rgba(251,191,36,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = steerWidth;
      drawArrow(steerStartS, steerEndS, ctx.strokeStyle, ctx.strokeStyle, steerWidth);
      const perpendicularIntersection = getVehiclePerpendicularIntersection(rear, bodyAngle, front, bodyAngle + theta);
      if (perpendicularIntersection) {
        drawSteerPerpendicularLine(front, bodyAngle + theta, alpha, steerWidth * 0.9);
        drawVehiclePerpendicularLine(rear, bodyAngle, alpha, bodyWidth * 0.65);
        drawVehicleIntersectionPoint(perpendicularIntersection, alpha);
      }

      drawNode(rearS.x, rearS.y, `rgba(125,211,252,${Math.min(1, 0.9 * alpha)})`);
      drawNode(frontS.x, frontS.y, `rgba(251,191,36,${Math.min(1, 0.9 * alpha)})`);
      drawOffsetLabel(rearS.x, rearS.y, bodyLabel);
      drawOffsetLabel(frontS.x, frontS.y, steerLabel);

      ctx.fillStyle = `rgba(237,243,255,${Math.min(1, 0.7 * alpha)})`;
      ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`${bodyLabel} + ${steerLabel}`, rearS.x + 10, rearS.y - 10);
      ctx.restore();
    }

    function vectorEndpoints(vector) {
      const vehicleVector = getVehicleVector();
      const start = isSteerVector(vector)
          ? getVehicleEnd(vehicleVector)
          : { x: vector.x, y: vector.y };
      const length = isSteerVector(vector) ? 0.25 : vector.length;
      const end = {
        x: start.x + Math.cos(vector.angle) * length,
        y: start.y + Math.sin(vector.angle) * length
      };
      return { start, end };
    }

    function drawVehicle() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      if (!solution?.success || !solution.terminalPose) return;
      const pose = solution.terminalPose;
      drawVehicleInstance(pose, {
        alpha: 1,
        bodyWidth: 4,
        steerWidth: 2.5,
        label: "Rp",
        steerLabel: "Sv"
      });
      const rearS = worldToScreen(Number(pose.x) || 0, Number(pose.y) || 0);
      ctx.save();
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "13px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`Terminal pose  ψ = ${formatAngle(Number(pose.heading) || Number(pose.angle) || 0)}`, rearS.x + 12, rearS.y - 32);
      ctx.restore();
    }

    function drawVehicleCopies() {
      // Keep the sweep in state for fit/view and dependent calculations,
      // but do not render the shadow vehicles yet.
    }

    function getSimpleArcPathTraces(solution = state.simpleArcSolution || solveSimpleArc()) {
      const pathPoints = Array.isArray(solution?.pathPoints) ? solution.pathPoints : [];
      if (!pathPoints.length) {
        return { pathPoints, rpWorldPoints: [] };
      }
      const rpWorldPoints = pathPoints.map(point => ({
        x: Number(point.x) || 0,
        y: Number(point.y) || 0
      }));
      return { pathPoints, rpWorldPoints };
    }

    function drawVehiclePathTrace() {
      const { rpWorldPoints } = getSimpleArcPathTraces();
      const rpPoints = rpWorldPoints.map(point => worldToScreen(point.x, point.y));
      if (rpPoints.length < 2) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // Draw the overall path with a stronger stroke so the vehicle motion is obvious.
      ctx.strokeStyle = "rgba(126,240,191,0.72)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rpPoints[0].x, rpPoints[0].y);
      for (let i = 1; i < rpPoints.length; i += 1) {
        ctx.lineTo(rpPoints[i].x, rpPoints[i].y);
      }
      ctx.stroke();

      // Add a subtle fading overlay to hint at direction without overpowering the vehicle copies.
      ctx.strokeStyle = "rgba(125,211,252,0.28)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(rpPoints[0].x, rpPoints[0].y);
      for (let i = 1; i < rpPoints.length; i += 1) {
        ctx.lineTo(rpPoints[i].x, rpPoints[i].y);
      }
      ctx.stroke();

      // Mark the start and end so the line reads as a path, not just a decoration.
      const start = rpPoints[0];
      const end = rpPoints[rpPoints.length - 1];
      ctx.fillStyle = "rgba(125,211,252,0.95)";
      ctx.beginPath();
      ctx.arc(start.x, start.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(126,240,191,0.95)";
      ctx.beginPath();
      ctx.arc(end.x, end.y, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawNode(x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + 8, y - 8);
    }

    function drawOffsetLabel(x, y, label, offsetX = 12, offsetY = -18) {
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + offsetX, y + offsetY);
    }

    function drawVectors() {
      for (let index = 0; index < state.vectors.length; index += 1) {
        const vector = state.vectors[index];
        if (index === 0) continue;
        const { start, end } = vectorEndpoints(vector);
        const s = worldToScreen(start.x, start.y);
        const e = worldToScreen(end.x, end.y);
        const selected = state.selectedId === vector.id;
        const thetaVector = isThetaVector(vector);
        const vehicleVector = getVehicleVector();
        const thetaAngle = (vehicleVector ? vehicleVector.angle : 0) + getThetaValue();
        const thetaTip = thetaVector
          ? worldToScreen(
              start.x + Math.cos(thetaAngle) * 0.22,
              start.y + Math.sin(thetaAngle) * 0.22
            )
          : null;

        if (thetaVector) {
          drawArrow(s, thetaTip, selected ? "rgba(255,255,255,0.92)" : vector.color, vector.color, 3);
        } else {
          drawArrow(s, e, selected ? "rgba(255,255,255,0.92)" : vector.color, vector.color, selected ? 4 : 3);
        }
        drawNode(s.x, s.y, vector.color, index === 0 ? "" : (vector.label?.trim() ? vector.label.trim()[0].toUpperCase() : "V"));
        drawHandle(s.x, s.y, selected ? "#ffffff" : vector.color);
        if (!thetaVector) {
          drawHandle(e.x, e.y, selected ? "#ffffff" : vector.color);
        }

        ctx.fillStyle = "rgba(237,243,255,0.88)";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        const labelPoint = thetaVector ? thetaTip : e;
        if (index !== 0) {
          ctx.fillText(vector.label || "Vector", labelPoint.x + 8, labelPoint.y - 8);
        }
      }
    }

    function drawHandle(x, y, color) {
      ctx.fillStyle = "#070b16";
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "rgba(6, 10, 20, 0.38)";
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (initialVehicleSequenceFitPending) {
        fitView();
        initialVehicleSequenceFitPending = false;
        scheduleRender();
      }
      drawGrid();
      drawAxes();
      if (state.ui.vehicle) {
        drawVehiclePathTrace();
      }
      drawVehicleCopies();
      drawSimpleArc();
      if (state.ui.vehicle) {
        drawVehicle();
      }
      drawVectors();

      updateMetrics();
      updateDependentList();
      updateJson();
    }

    function updateMetrics() {
      coordsReadout.textContent = lastPointerWorld
        ? `x: ${lastPointerWorld.x.toFixed(2)}, y: ${lastPointerWorld.y.toFixed(2)}`
        : "x: 0.00, y: 0.00";
    }

    function updateJson() {
      if (jsonOutput) {
        jsonOutput.value = JSON.stringify(serializableState(), null, 2);
      }
    }

    function updateDependentList() {
      if (!dependentListDirty) return;
      dependentList.innerHTML = "";
      const solution = state.simpleArcSolution || solveSimpleArc();
      const terminalRp = solution?.terminalCoord || null;
      const entries = [{
        label: "Terminal steer",
        value: Number.isFinite(Number(solution?.sl)) ? Number(solution.sl).toFixed(2) : "NaN",
      }, {
        label: "Terminal s (total distance the steered wheel travels)",
        value: Number.isFinite(Number(solution?.s)) ? Number(solution.s).toFixed(2) : "NaN",
      }, {
        label: "Rp",
        value: formatCoordSummary(terminalRp),
        full: true
      }];
      for (const entry of entries) {
        const control = document.createElement("div");
        control.className = entry.full ? "control full" : "control";
        control.innerHTML = `
          <label>${escapeHtml(entry.label)}</label>
          <input type="text" value="${escapeHtml(entry.value)}" readonly />
          ${entry.note ? `<div class="sub" style="margin: 0; font-size: 12px;">${escapeHtml(entry.note)}</div>` : ""}
        `;
        dependentList.appendChild(control);
      }
      dependentListDirty = false;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function degToRad(value) {
      return (value * Math.PI) / 180;
    }

    function getHeadingChangeStep() {
      return degToRad(5);
    }

    function snapHeadingChange(value) {
      const step = getHeadingChangeStep();
      const numeric = Math.max(0, Number(value) || 0);
      return Math.round(numeric / step) * step;
    }

    function getHeadingChange(geometry = state.vehicle) {
      return Math.max(0, Number(geometry?.headingChange) || 0);
    }

    function getSolverInitialSl(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) && numeric > 0.1 ? numeric : Math.PI / 4;
    }

    function getCurveLengthFromGeometry(geometry = state.vehicle) {
      const radius = Number(geometry?.radius) || 0;
      return radius * getHeadingChange(geometry);
    }

    function radToDeg(value) {
      return (value * 180) / Math.PI;
    }

    function formatAngle(rad) {
      const value = Number(rad) || 0;
      return `${value.toFixed(3)} rad (${radToDeg(value).toFixed(0)}°)`;
    }

    function formatDeltaPsiDisplay(rad) {
      const value = Number(rad) || 0;
      return `${value.toFixed(3)} (${radToDeg(value).toFixed(0)})`;
    }

    function snapDeltaPsiToWholeDegrees(rad) {
      return degToRad(Math.round(radToDeg(Number(rad) || 0)));
    }

    function clampDeltaPsiDegrees(degrees) {
      return clamp(Number(degrees) || 0, 0, 180);
    }

    function getDeltaPsiStep(degrees) {
      const value = Math.abs(Number(degrees) || 0);
      return value <= 10 || value >= 170 ? 1 : 5;
    }

    function normalizeDeltaPsiDegrees(degrees) {
      return Math.round(clampDeltaPsiDegrees(degrees));
    }

    function normalizeDeltaPsi(rad) {
      return degToRad(normalizeDeltaPsiDegrees(radToDeg(Number(rad) || 0)));
    }

    function formatFixed2(value) {
      return (Number(value) || 0).toFixed(2);
    }

    function formatCoordSummary(coord) {
      if (!coord) return "NaN";
      return `(${formatFixed2(coord.X)}, ${formatFixed2(coord.Y)}, ${formatDeltaPsiDisplay(coord.Psi)}, ${formatFixed2(coord.length)})`;
    }

    function vectorAtPoint(point, baseAngle, length, label, color) {
      return {
        id: randomId(),
        label,
        x: point.x,
        y: point.y,
        angle: baseAngle,
        length,
        color
      };
    }

    function findHit(point) {
      const hitRadius = 10;
      for (let i = state.vectors.length - 1; i >= 0; i -= 1) {
        const vector = state.vectors[i];
        const { start, end } = vectorEndpoints(vector);
        const s = worldToScreen(start.x, start.y);
        const e = worldToScreen(end.x, end.y);
        const px = point.x;
        const py = point.y;
        if (dist({ x: px, y: py }, s) <= hitRadius) {
          return { vector, kind: "origin", start, end };
        }
        if (!isSteerVector(vector) && dist({ x: px, y: py }, e) <= hitRadius) {
          return { vector, kind: "end", start, end };
        }
        if (!isSteerVector(vector) && distanceToSegment(point, s, e) <= 8) {
          return { vector, kind: "body", start, end };
        }
      }
      return null;
    }

    function distanceToSegment(point, a, b) {
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const apx = point.x - a.x;
      const apy = point.y - a.y;
      const denom = abx * abx + aby * aby;
      const t = denom === 0 ? 0 : Math.max(0, Math.min(1, (apx * abx + apy * aby) / denom));
      const cx = a.x + abx * t;
      const cy = a.y + aby * t;
      return Math.hypot(point.x - cx, point.y - cy);
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    let lastPointerWorld = null;

    canvas.addEventListener("pointermove", (event) => {
      const p = canvasPoint(event);
      lastPointerWorld = screenToWorld(p.x, p.y);

      if (drag) {
        if (drag.type === "pan") {
          state.view.offsetX = drag.startOffsetX + (event.clientX - drag.startClientX);
          state.view.offsetY = drag.startOffsetY + (event.clientY - drag.startClientY);
        } else if (drag.type === "vector") {
          const vector = state.vectors.find(v => v.id === drag.vectorId);
          if (!vector) return;
          const world = screenToWorld(p.x, p.y);
          const vehicleVector = getVehicleVector();
          const vehicleEnd = getVehicleEnd(vehicleVector);
          if (drag.kind === "origin") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              vector.x = world.x;
              vector.y = world.y;
            }
          } else if (drag.kind === "end" || drag.kind === "placing") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              const dx = world.x - vector.x;
              const dy = world.y - vector.y;
              vector.length = Math.max(0.01, Math.hypot(dx, dy));
              vector.angle = Math.atan2(dy, dx);
            }
          } else if (drag.kind === "body") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              vector.x = world.x - drag.grabOffset.x;
              vector.y = world.y - drag.grabOffset.y;
            }
          }
          dependentListDirty = true;
        }
        saveState();
        scheduleRender();
        return;
      }

      const hit = findHit(p);
      canvas.style.cursor = hit ? "grab" : "crosshair";
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      const p = canvasPoint(event);
      const world = screenToWorld(p.x, p.y);

      const hit = findHit(p);
      if (hit) {
        dependentListDirty = true;
        state.selectedId = hit.vector.id;
        drag = {
          type: "vector",
          vectorId: hit.vector.id,
          kind: hit.kind,
          grabOffset: hit.kind === "body"
            ? {
              x: world.x - hit.vector.x,
              y: world.y - hit.vector.y
            }
            : null
        };
        saveState();
        scheduleRender();
        return;
      }

      drag = {
        type: "pan",
        startClientX: event.clientX,
        startClientY: event.clientY,
        startOffsetX: state.view.offsetX,
        startOffsetY: state.view.offsetY
      };
      state.selectedId = null;
      dependentListDirty = true;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointerup", () => {
      if (!drag) return;
      if (drag.type === "vector") {
        const vector = state.vectors.find(v => v.id === drag.vectorId);
        if (vector && isSteerVector(vector)) {
          vector.length = 0.25;
        } else if (vector && vector.length < 0.02) {
          vector.length = 0.02;
        }
      }
      drag = null;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointercancel", () => {
      drag = null;
      scheduleRender();
    });

    canvas.addEventListener("pointerleave", () => {
      lastPointerWorld = null;
    });

    canvas.addEventListener("dblclick", (event) => {
      const p = canvasPoint(event);
      const hit = findHit(p);
      if (hit) return;
      const world = screenToWorld(p.x, p.y);
      const vector = vectorAtPoint(world, 0, 1.2, `Vector ${state.vectors.length + 1}`, COLORS[state.vectors.length % COLORS.length]);
      state.vectors.push(vector);
      state.selectedId = vector.id;
      dependentListDirty = true;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const zoomFactor = Math.exp(-event.deltaY * 0.0012);
      const rect = canvas.getBoundingClientRect();
      const cursorX = event.clientX - rect.left;
      const cursorY = event.clientY - rect.top;
      const before = screenToWorld(cursorX, cursorY);
      state.view.scale = Math.max(1e-6, state.view.scale * zoomFactor);
      state.view.offsetX = cursorX - rect.width / 2 - before.x * state.view.scale;
      state.view.offsetY = cursorY - rect.height / 2 + before.y * state.view.scale;
      saveState();
      scheduleRender();
    }, { passive: false });

    function syncInputs() {
      arcRadiusInput.value = (Number(state.arc?.radius) || 1).toFixed(2);
      const deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      const deltaPsiDegrees = radToDeg(deltaPsi);
      arcAngleInput.value = String(normalizeDeltaPsiDegrees(deltaPsiDegrees));
      arcAngleInput.step = String(getDeltaPsiStep(deltaPsiDegrees));
      arcAngleInput.max = "180";
      if (arcAngleDisplay) {
        arcAngleDisplay.textContent = formatDeltaPsiDisplay(deltaPsi);
      }
    }

    function recalculateVehicleSolution(options = {}) {
      const persist = options.persist !== false;
      const render = options.render !== false;
      const activeVehicle = getActiveVehicle();
      const result = solveSimpleArc();
      state.simpleArcSolution = result;
      state.arc.deltaPsi = getSimpleArcDeltaPsi();
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncVehicleShadows(result);
      if (activeVehicle) {
        activeVehicle.finalPose = result?.terminalPose ? { ...result.terminalPose } : null;
        if (Number.isFinite(Number(result?.sl))) {
          activeVehicle.sl = Number(result.sl);
        }
        if (Number.isFinite(Number(result?.turnAngle))) {
          activeVehicle.headingChange = Number(result.turnAngle);
        }
      }
      dependentListDirty = true;
      syncInputs();
      if (persist) saveState();
      if (render) scheduleRender();
      return result;
    }

    arcRadiusInput.addEventListener("input", () => {
      const value = Number(arcRadiusInput.value);
      state.arc.radius = clamp(value || 0, -100, 100);
      if (Math.abs(state.arc.radius) < 0.01) {
        state.arc.radius = state.arc.radius < 0 ? -0.01 : 0.01;
      }
      syncInputs();
      recalculateVehicleSolution();
    });
    arcAngleInput.addEventListener("input", () => {
      const value = Number(arcAngleInput.value);
      state.arc.deltaPsi = degToRad(normalizeDeltaPsiDegrees(Number.isFinite(value) ? value : 0));
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution();
    });

    arcAngleInput.addEventListener("blur", () => {
      state.arc.deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution();
    });

    window.addEventListener("keydown", (event) => {
      if ((event.key === "Delete" || event.key === "Backspace") && state.selectedId) {
        const selected = state.vectors.find(v => v.id === state.selectedId) || null;
        state.vectors = state.vectors.filter(v => v.id !== state.selectedId);
        state.selectedId = null;
        dependentListDirty = true;
        saveState();
        scheduleRender();
      }
    });

    window.addEventListener("resize", () => {
      if (setupCanvas()) {
        scheduleRender();
      }
    });

    const canvasResizeObserver = typeof ResizeObserver === "function"
      ? new ResizeObserver(() => {
          if (setupCanvas()) {
            scheduleRender();
          }
        })
      : null;
    if (canvasResizeObserver) {
      canvasResizeObserver.observe(canvas);
    }

    function fitView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [0];
      const ys = [0];
      const arc = getSimpleArcGeometry();
      if (arc.valid) {
        const arcPoints = sampleSimpleArcPoints(arc, 48);
        xs.push(0, arc.center.x, ...arcPoints.map(point => point.x));
        ys.push(0, arc.center.y, ...arcPoints.map(point => point.y));
      }
      const finalPose = state.simpleArcSolution?.terminalPose || getActiveVehicle()?.finalPose || null;
      if (finalPose) {
        const finalFront = {
          x: (Number(finalPose.x) || 0) + Math.cos(Number(finalPose.angle) || 0),
          y: (Number(finalPose.y) || 0) + Math.sin(Number(finalPose.angle) || 0)
        };
        xs.push(Number(finalPose.x) || 0, finalFront.x);
        ys.push(Number(finalPose.y) || 0, finalFront.y);
      }
      const traces = getSimpleArcPathTraces();
      for (const point of traces.pathPoints) {
        xs.push(Number(point.x) || 0);
        ys.push(Number(point.y) || 0);
      }
      for (const vector of state.vectors) {
        const { start, end } = vectorEndpoints(vector);
        xs.push(start.x, end.x);
        ys.push(start.y, end.y);
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.4, rangeXRaw * 0.08);
      const paddingY = Math.max(0.4, rangeYRaw * 0.08);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.96);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function fitVehicleSequenceView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [];
      const ys = [];
      const vehicleWidth = 1;
      const steerLength = 0.25;
      for (const copy of state.vehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const theta = Number(copy.theta) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle) * vehicleWidth,
          y: rear.y + Math.sin(bodyAngle) * vehicleWidth
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + theta) * steerLength,
          y: front.y + Math.sin(bodyAngle + theta) * steerLength
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      if (!xs.length || !ys.length) {
        return;
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.25, rangeXRaw * 0.06);
      const paddingY = Math.max(0.25, rangeYRaw * 0.06);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.98);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function initialize() {
      if (initialized) return;
      renderStatus.textContent = "Render: booting";
      if (!setupCanvas()) {
        renderStatus.textContent = "Render: waiting for layout";
        requestAnimationFrame(initialize);
        return;
      }
      initialized = true;
      state.Vehicles[0] = createAnchorVehicle(getSolverInitialSl(state.Vehicles[0]?.sl));
      enforceVectorAnchor();
      state.ui.vehicle = true;
      state.arc.deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution({ persist: false, render: false });
      fitView();
      setupCanvas();
      saveState();
      scheduleRender();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  </script>
</body>
</html>
