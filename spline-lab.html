    }

    function normalizeVehicleCopies(copies) {
      return copies
        .map(copy => ({
          id: copy?.id || randomId(),
          x: Number(copy?.x) || 0,
          y: Number(copy?.y) || 0,
          angle: Number(copy?.angle) || 0,
          strAng: readStrAng(copy),
          radius: Number(copy?.radius) || 0,
          curveLength: Number(copy?.curveLength) || 0,
          label: copy?.label || "vehicleCopies[0]",
          steerLabel: copy?.steerLabel || VEHICLE_STEER_LABEL
        }))
        .filter(copy => Number.isFinite(copy.x) && Number.isFinite(copy.y) && Number.isFinite(copy.angle));
    }

    const vehiclePoseQuadratureNodes = [
      -0.9602898564975363,
      -0.7966664774136267,
      -0.525532409916329,
      -0.1834346424956498,
      0.1834346424956498,
      0.525532409916329,
      0.7966664774136267,
      0.9602898564975363
    ];

    const vehiclePoseQuadratureWeights = [
      0.10122853629037626,
      0.22238103445337448,
      0.31370664587788727,
      0.36268378337836196,
      0.36268378337836196,
      0.31370664587788727,
      0.22238103445337448,
      0.10122853629037626
    ];

    const vehiclePoseBesselCache = {
      slew: NaN,
      limit: -1,
      values: []
    };

    function complexAdd(a, b) {
      return { re: a.re + b.re, im: a.im + b.im };
    }

    function complexScale(a, scale) {
      return { re: a.re * scale, im: a.im * scale };
    }

    function complexMul(a, b) {
      return {
        re: a.re * b.re - a.im * b.im,
        im: a.re * b.im + a.im * b.re
      };
    }

    function complexExp(angle) {
      return { re: Math.cos(angle), im: Math.sin(angle) };
    }

    function powMinusI(power) {
      switch ((((power % 4) + 4) % 4)) {
        case 0: return { re: 1, im: 0 };
        case 1: return { re: 0, im: -1 };
        case 2: return { re: -1, im: 0 };
        default: return { re: 0, im: 1 };
      }
    }

    function besselJ(order, x) {
      const n = Math.abs(Math.trunc(order));
      if (x === 0) return n === 0 ? 1 : 0;
      let term = Math.pow(x / 2, n) / factorial(n);
      let sum = term;
      const x2 = -(x * x) / 4;
      for (let m = 1; m < 80; m += 1) {
        term *= x2 / (m * (m + n));
        sum += term;
        if (Math.abs(term) < Math.abs(sum) * 1e-13 + 1e-15) break;
      }
      return order < 0 && (n % 2 === 1) ? -sum : sum;
    }

    function factorial(n) {
      let result = 1;
      for (let i = 2; i <= n; i += 1) result *= i;
      return result;
    }

    function getBesselTable(slew, limit) {
      if (vehiclePoseBesselCache.slew === slew && vehiclePoseBesselCache.limit >= limit) {
        return vehiclePoseBesselCache.values;
      }
      const values = [];
      for (let order = 0; order <= limit; order += 1) {
        values[order] = besselJ(order, 1 / slew);
      }
      vehiclePoseBesselCache.slew = slew;
      vehiclePoseBesselCache.limit = limit;
      vehiclePoseBesselCache.values = values;
      return values;
    }

    function integrateVehiclePoseFront(vehicleVector, distance, headingChangePerDistance = 0) {
      if (Math.abs(distance) < 1e-12) {
        return {
          x: 0,
          y: 0,
          angle: 0,
          strAng: 0,
          radius: 0,
          curveLength: 0
        };
      }
      const slew = headingChangePerDistance;
      const headingChange = slew * distance;
      const invSlew = 1 / slew;
      const phase = invSlew;
      const travel = distance;
      const phaseSpan = headingChange;
      const harmonicLimit = Math.max(12, Math.ceil(Math.abs(invSlew) + 24));
      const besselValues = getBesselTable(slew, harmonicLimit + 1);
      let integral = { re: 0, im: 0 };

      for (let m = -harmonicLimit; m <= harmonicLimit; m += 1) {
        const besselOrder = m - 1;
        const besselValue = besselValues[Math.abs(besselOrder)] || 0;
        const besselTerm = besselOrder < 0 && (Math.abs(besselOrder) % 2 === 1) ? -besselValue : besselValue;
        const harmonic = m === 0
          ? { re: phaseSpan, im: 0 }
          : {
              re: Math.sin(m * phaseSpan) / m,
              im: (1 - Math.cos(m * phaseSpan)) / m
            };
        const term = complexMul(
          complexMul(powMinusI(m - 1), { re: besselTerm, im: 0 }),
          harmonic
        );
        integral = complexAdd(integral, term);
      }

      integral = complexScale(integral, 1 / slew);
      const front = complexMul(complexExp(phase), integral);
      const bodyDelta = (2 * Math.sin(phaseSpan / 2) ** 2) / slew;
      const bodyVector = complexExp(bodyDelta);
      const localRear = {
        re: 1 + front.re - bodyVector.re,
        im: front.im - bodyVector.im
      };
      return {
        x: localRear.re,
        y: localRear.im,
        angle: bodyDelta,
        strAng: headingChange
      };
    }

    function integrateVehiclePoseFallback(vehicleVector, distance, headingChangePerDistance = 0) {
      if (Math.abs(distance) < 1e-12) {
        return {
          x: 0,
          y: 0,
          angle: 0,
          strAng: 0,
          radius: 0,
          curveLength: 0
        };
      }
      const slew = headingChangePerDistance;
      const headingChange = slew * distance;
      const travel = distance;
      const bodyDelta = slew === 0 ? 0 : (2 * Math.sin(headingChange / 2) ** 2) / slew;
      const integralNodes = vehiclePoseQuadratureNodes;
      const integralWeights = vehiclePoseQuadratureWeights;
      const halfTravel = travel / 2;
      let frontX = 1;
      let frontY = 0;

      for (let i = 0; i < integralNodes.length; i += 1) {
        const s = halfTravel * (integralNodes[i] + 1);
        const phase = slew * s + (slew === 0 ? 0 : (2 * Math.sin((headingChange * s) / (2 * distance)) ** 2) / slew);
        frontX += integralWeights[i] * Math.cos(phase) * halfTravel;
        frontY += integralWeights[i] * Math.sin(phase) * halfTravel;
      }

      const rearX = frontX - Math.cos(bodyDelta);
      const rearY = frontY - Math.sin(bodyDelta);
      return {
        x: rearX,
        y: rearY,
        angle: bodyDelta,
        strAng: headingChange
      };
    }

    function sampleVehiclePose(vehicleVector, distance, headingChangePerDistance = 0) {
      const curveLength = Math.max(0, getCurveLengthFromGeometry(getVehicleGeometry()));
      const baseX = Number(vehicleVector?.x) || 0;
      const baseY = Number(vehicleVector?.y) || 0;
      const localPose = Math.abs(distance) < 1e-12 || Math.abs(headingChangePerDistance) < 1e-12
        ? integrateVehiclePoseFallback(vehicleVector, distance, headingChangePerDistance)
        : integrateVehiclePoseFront(vehicleVector, distance, headingChangePerDistance);
      const baseAngle = Number(vehicleVector?.angle) || 0;
      const cosBase = Math.cos(baseAngle);
      const sinBase = Math.sin(baseAngle);
      return {
        x: baseX + localPose.x * cosBase - localPose.y * sinBase,
        y: baseY + localPose.x * sinBase + localPose.y * cosBase,
        angle: baseAngle + localPose.angle,
        strAng: localPose.strAng,
        radius: Number(state.radius) || 0,
        curveLength
      };
    }

    function buildVehicleCopies(vehicleVector = getVehicleVector(), terminalPose = getActiveVehicle()?.finalPose, curveLengthOverride = getCurveLengthFromGeometry(getVehicleGeometry())) {
      if (!vehicleVector) return [];
      const curveLength = Math.max(0, Number(curveLengthOverride) || 0);
      const slew = Number(getActiveVehicle()?.sl) || 0;
      return buildVehicleCopiesForSlew(vehicleVector, curveLength, slew, Number(state.radius) || 0, terminalPose);
    }

    function buildVehicleCopiesForSlew(vehicleVector, curveLength, slew, radius = 0, terminalPose = null) {
      const sampleCount = curveLength === 0 ? 1 : Math.max(6, Math.ceil(curveLength * 4));
      const copies = [];
      for (let i = 0; i < sampleCount; i += 1) {
        const t = sampleCount === 1 ? 0 : i / (sampleCount - 1);
        const distance = curveLength * t;
        const pose = sampleVehiclePoseForSlew(vehicleVector, distance, slew, curveLength, radius);
        copies.push({
          id: `vehicle-copy-${sampleCount}-${i}`,
          x: pose.x,
          y: pose.y,
          angle: pose.angle,
          strAng: i === 0 ? 0 : pose.strAng,
          radius: pose.radius,
          curveLength: pose.curveLength,
          label: "vehicleCopies",
          steerLabel: VEHICLE_STEER_LABEL,
          pathDistance: curveLength * t
        });
      }
      return copies;
    }

    function sampleVehiclePoseForSlew(vehicleVector, distance, headingChangePerDistance = 0, curveLength = 0, radius = 0) {
      const baseX = Number(vehicleVector?.x) || 0;
      const baseY = Number(vehicleVector?.y) || 0;
      const baseAngle = Number(vehicleVector?.angle) || 0;
      const cacheKey = [
        baseX,
        baseY,
        baseAngle,
        Number(distance) || 0,
        Number(headingChangePerDistance) || 0,
        Number(curveLength) || 0,
        Number(radius) || 0
      ].join("|");
      if (poseSampleCache.has(cacheKey)) {
        return { ...poseSampleCache.get(cacheKey) };
      }

      const localPose = Math.abs(distance) < 1e-12 || Math.abs(headingChangePerDistance) < 1e-12
        ? integrateVehiclePoseFallbackForSlew(distance, headingChangePerDistance)
        : integrateVehiclePoseFrontForSlew(distance, headingChangePerDistance);
      const cosBase = Math.cos(baseAngle);
      const sinBase = Math.sin(baseAngle);
      const result = {
        x: baseX + localPose.x * cosBase - localPose.y * sinBase,
        y: baseY + localPose.x * sinBase + localPose.y * cosBase,
        angle: baseAngle + localPose.angle,
        strAng: localPose.strAng,
        radius,
        curveLength
      };
      poseSampleCache.set(cacheKey, result);
      return { ...result };
    }

    function integrateVehiclePoseFrontForSlew(distance, headingChangePerDistance) {
      if (Math.abs(distance) < 1e-12) {
        return {
          x: 0,
          y: 0,
          angle: 0,
          strAng: 0,
          radius: 0,
          curveLength: 0
        };
      }

      const slew = headingChangePerDistance;
      const headingChange = slew * distance;
      const invSlew = 1 / slew;
      const phase = invSlew;
      const travel = distance;
      const phaseSpan = headingChange;
      const harmonicLimit = Math.max(12, Math.ceil(Math.abs(invSlew) + 24));
      const besselValues = getBesselTable(slew, harmonicLimit + 1);
      let integral = { re: 0, im: 0 };

      for (let m = -harmonicLimit; m <= harmonicLimit; m += 1) {
        const besselOrder = m - 1;
        const besselValue = besselValues[Math.abs(besselOrder)] || 0;
        const besselTerm = besselOrder < 0 && (Math.abs(besselOrder) % 2 === 1) ? -besselValue : besselValue;
        const harmonic = m === 0
          ? { re: phaseSpan, im: 0 }
          : {
              re: Math.sin(m * phaseSpan) / m,
              im: (1 - Math.cos(m * phaseSpan)) / m
            };
        const term = complexMul(
          complexMul(powMinusI(m - 1), { re: besselTerm, im: 0 }),
          harmonic
        );
        integral = complexAdd(integral, term);
      }

      integral = complexScale(integral, 1 / slew);
      const front = complexMul(complexExp(phase), integral);
      const bodyDelta = (2 * Math.sin(phaseSpan / 2) ** 2) / slew;
      const bodyVector = complexExp(bodyDelta);
      const localRear = {
        re: 1 + front.re - bodyVector.re,
        im: front.im - bodyVector.im
      };
      return {
        x: localRear.re,
        y: localRear.im,
        angle: bodyDelta,
        strAng: headingChange
      };
    }

    function integrateVehiclePoseFallbackForSlew(distance, headingChangePerDistance) {
      if (Math.abs(distance) < 1e-12) {
        return {
          x: 0,
          y: 0,
          angle: 0,
          strAng: 0,
          radius: 0,
          curveLength: 0
        };
      }

      const slew = headingChangePerDistance;
      const headingChange = slew * distance;
      const travel = distance;
      const bodyDelta = slew === 0 ? 0 : (2 * Math.sin(headingChange / 2) ** 2) / slew;
      const integralNodes = vehiclePoseQuadratureNodes;
      const integralWeights = vehiclePoseQuadratureWeights;
      const halfTravel = travel / 2;
      let frontX = 1;
      let frontY = 0;

      for (let i = 0; i < integralNodes.length; i += 1) {
        const s = halfTravel * (integralNodes[i] + 1);
        const phase = slew * s + (slew === 0 ? 0 : (2 * Math.sin((headingChange * s) / (2 * distance)) ** 2) / slew);
        frontX += integralWeights[i] * Math.cos(phase) * halfTravel;
        frontY += integralWeights[i] * Math.sin(phase) * halfTravel;
      }

      const rearX = frontX - Math.cos(bodyDelta);
      const rearY = frontY - Math.sin(bodyDelta);
      return {
        x: rearX,
        y: rearY,
        angle: bodyDelta,
        strAng: headingChange
      };
    }

    function evaluateVehicleStampedPathForSl(candidateSl, vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      if (!vehicleVector) return [];
      const curveLength = Math.max(0, getCurveLengthFromGeometry(geometry));
      return buildVehicleCopiesForSlew(vehicleVector, curveLength, Number(candidateSl) || 0, Number(geometry?.radius) || 0);
    }

    function getSteerAngleValue() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      if (Number.isFinite(Number(solution?.turnAngle))) {
        return Number(solution.turnAngle) || 0;
      }
      const terminalCopy = state.vehicleCopies.length ? state.vehicleCopies[state.vehicleCopies.length - 1] : null;
      if (terminalCopy && Number.isFinite(Number(terminalCopy.strAng))) {
        return Number(terminalCopy.strAng) || 0;
      }
      return Number(getActiveVehicle()?.Sp?.Psi) || 0;
    }

    function getRccPoint(vehicleVector = getVehicleVector()) {
      if (!vehicleVector) return null;
      const strAng = getSteerAngleValue();
      if (strAng === 0) return null;
      const rear = { x: vehicleVector.x, y: vehicleVector.y };
      const front = {
        x: rear.x + Math.cos(vehicleVector.angle) * vehicleVector.length,
        y: rear.y + Math.sin(vehicleVector.angle) * vehicleVector.length
      };
      const rearNormal = { x: -Math.sin(vehicleVector.angle), y: Math.cos(vehicleVector.angle) };
      const steerNormal = { x: -Math.sin(vehicleVector.angle + strAng), y: Math.cos(vehicleVector.angle + strAng) };
      return intersectLines(rear, rearNormal, front, steerNormal);
    }

    function saveState() {
      enforceAnchors();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableState()));
    }

    function getActiveVehicle() {
      return enforceAnchors();
    }

    function getVehicleVector() {
      const activeVehicle = getActiveVehicle();
      const rp = activeVehicle?.Rp || null;
      if (!rp) {
        return createCoord(0, 0, 0, 1, VEHICLE_BODY_LABEL, "#7dd3fc");
      }
      const x = Number(rp.X) || 0;
      const y = Number(rp.Y) || 0;
      const psi = Number(rp.Psi) || 0;
      if (x === 0 && y === 0 && psi === 0) {
        return createCoord(0, 0, 0, 1, VEHICLE_BODY_LABEL, "#7dd3fc");
      }
      return rp;
    }

    function getVehicleGeometry() {
      const activeVehicle = getActiveVehicle();
      return {
        Rp: activeVehicle?.Rp || null,
        Sp: activeVehicle?.Sp || null,
        sl: Number(activeVehicle?.sl) || 0,
        finalPose: activeVehicle?.finalPose || null,
        headingChange: Number(activeVehicle?.Sp?.Psi) || 0,
        radius: Number(state.radius) || 0
      };
    }

    function getVehicleEnd(vehicleVector = getVehicleVector()) {
      if (!vehicleVector) return { x: 1, y: 0 };
      return {
        x: vehicleVector.x + Math.cos(vehicleVector.angle) * vehicleVector.length,
        y: vehicleVector.y + Math.sin(vehicleVector.angle) * vehicleVector.length
      };
    }

    function getVehicleSv(vehicle = state.Vehicles[0] || null) {
      const rp = vehicle?.Rp || null;
      const sp = vehicle?.Sp || null;
      if (!rp || !sp) return null;
      const rpLength = Number.isFinite(Number(rp.length)) ? Number(rp.length) : 1;
      const rpHeading = Number(rp.Psi) || 0;
      return createCoord(
        (Number(rp.X) || 0) + Math.cos(rpHeading) * rpLength,
        (Number(rp.Y) || 0) + Math.sin(rpHeading) * rpLength,
        rpHeading + (Number(sp.Psi) || 0),
        Number.isFinite(Number(sp.length)) ? Number(sp.length) : 0.25,
        VEHICLE_STEER_LABEL,
        "#fbbf24"
      );
    }

    function vehicleToPose(vehicle) {
      const rp = vehicle?.Rp || null;
      const sp = vehicle?.Sp || null;
      if (!rp || !sp) return null;
      return {
        x: Number(rp.X) || 0,
        y: Number(rp.Y) || 0,
        angle: Number(rp.Psi) || 0,
        strAng: Number(sp.Psi) || 0,
        radius: Number(state.radius) || 0,
        curveLength: Number(vehicle?.finalPose?.curveLength) || 0
      };
    }

    function interpolateShadowCopiesFromSamples(samples, shadowCount = 0) {
      const items = Array.isArray(samples)
        ? samples.filter(sample => Number.isFinite(Number(sample?.x)) && Number.isFinite(Number(sample?.y)) && Number.isFinite(Number(sample?.angle)))
        : [];
      if (items.length < 2) {
        return [];
      }

      const enriched = items.map(item => ({ ...item, unwrappedAngle: Number(item.angle) || 0 }));
      const signedProgress = [0];
      let totalUnwrappedAngle = Number(enriched[0].unwrappedAngle) || 0;

      for (let i = 1; i < enriched.length; i += 1) {
        const prev = enriched[i - 1];
        const current = enriched[i];
        const deltaHeading = wrapAngle((Number(current.angle) || 0) - (Number(prev.angle) || 0));
        totalUnwrappedAngle += deltaHeading;
        current.unwrappedAngle = totalUnwrappedAngle;
        signedProgress.push(totalUnwrappedAngle - (Number(enriched[0].unwrappedAngle) || 0));
      }

      const totalHeadingChange = Math.abs(signedProgress[signedProgress.length - 1] || 0);
      if (!Number.isFinite(totalHeadingChange) || totalHeadingChange <= 1e-9) {
        return [];
      }

      const direction = Math.sign(signedProgress[signedProgress.length - 1]) || 1;
      const count = Math.max(0, Math.round(Number(shadowCount) || 0));
      const copies = [];

      const interpolateAtProgress = (targetProgress) => {
        for (let i = 1; i < enriched.length; i += 1) {
          const leftProgress = signedProgress[i - 1];
          const rightProgress = signedProgress[i];
          const crosses = (targetProgress >= leftProgress && targetProgress <= rightProgress)
            || (targetProgress <= leftProgress && targetProgress >= rightProgress);
          if (!crosses) continue;
          const span = rightProgress - leftProgress;
          const t = Math.abs(span) > 1e-9 ? (targetProgress - leftProgress) / span : 0;
          const left = enriched[i - 1];
          const right = enriched[i];
          const lerp = (a, b) => Number(a) + (Number(b) - Number(a)) * t;
          return {
            x: lerp(left.x, right.x),
            y: lerp(left.y, right.y),
            angle: wrapAngle(lerp(left.unwrappedAngle, right.unwrappedAngle)),
            strAng: lerp(left.strAng ?? 0, right.strAng ?? 0),
            radius: lerp(left.radius ?? 0, right.radius ?? 0),
            curveLength: lerp(left.curveLength ?? 0, right.curveLength ?? 0),
            label: "",
            steerLabel: "",
            pathDistance: lerp(left.pathDistance ?? left.curveLength ?? 0, right.pathDistance ?? right.curveLength ?? 0)
          };
        }
        return null;
      };

      if (count <= 0) {
        return [];
      }

      for (let n = 1; n <= count; n += 1) {
        const targetProgress = (totalHeadingChange * n) / (count + 1);
        const pose = interpolateAtProgress(direction * targetProgress);
        if (pose) {
          copies.push({
            id: `shadow-copy-${copies.length + 1}`,
            ...pose
          });
        }
      }

      return copies;
    }

    function buildVehicleSweepFromTerminalSl(solution, shadowCount = 0) {
      const activeVehicle = getActiveVehicle();
      const anchor = createAnchorVehicle(getSolverInitialSl(state.simpleArcSolution));
      const sl = Number(solution?.sl) || 0;
      const totalPathLength = Math.max(0, Number(solution?.s ?? solution?.curveLength) || 0);
      const solverPathPoints = Array.isArray(solution?.pathPoints) ? solution.pathPoints : [];
      if (!Number.isFinite(sl) || (totalPathLength <= 0 && solverPathPoints.length <= 1)) {
        state.Vehicles = [anchor];
        return [vehicleToPose(anchor)].filter(Boolean);
      }

      const sourcePoints = solverPathPoints.length > 1
        ? solverPathPoints
        : integrateLinearSteerPath(sl, totalPathLength).points;
      const localSamples = Array.isArray(sourcePoints) ? sourcePoints.map((point, index) => {
        const t = sourcePoints.length <= 1 ? 0 : index / (sourcePoints.length - 1);
        return {
          x: Number(point.x) || 0,
          y: Number(point.y) || 0,
          angle: Number(point.heading ?? point.angle) || 0,
          strAng: Number(point.strAng) || 0,
          radius: Number(solution?.radius) || 0,
          curveLength: Number(point.curveLength ?? point.pathDistance) || totalPathLength * t,
          pathDistance: Number(point.pathDistance ?? point.curveLength) || totalPathLength * t,
          unwrappedAngle: Number(point.heading ?? point.angle) || 0
        };
      }) : [];

      const copies = [vehicleToPose(anchor)].filter(Boolean);
      copies.push(...interpolateShadowCopiesFromSamples(localSamples, shadowCount));

      state.Vehicles = [anchor];
      return copies;
    }

    function buildSimpleCurveSweep(solution = state.simpleArcSolution || solveSimpleArc(), shadowCount = 0) {
      return [];
    }

    function syncVehicleShadows(solution = state.simpleArcSolution || solveSimpleArc()) {
      if (!solution?.showShadows) {
        state.arc.shadowCountComplex = 0;
        state.arc.shadowCountSimple = 0;
        state.vehicleCopies = [];
        state.simpleVehicleCopies = [];
        return;
      }
      const complexCount = getShadowCountFromHeadingChange(getRenderHeadingChange(solution), 10, 3);
      state.arc.shadowCountComplex = complexCount;
      state.arc.shadowCountSimple = 0;
      state.vehicleCopies = buildVehicleSweepFromTerminalSl(
        solution,
        complexCount
      );
      state.simpleVehicleCopies = [];
    }

    function enforceAnchors() {
      let activeVehicle = state.Vehicles[0] || null;
      if (!activeVehicle) {
        activeVehicle = createAnchorVehicle();
        state.Vehicles[0] = activeVehicle;
      }
      if (!activeVehicle.Rp) {
        activeVehicle.Rp = createCoord(0, 0, 0, 1, VEHICLE_BODY_LABEL, "#7dd3fc");
      }
      activeVehicle.Rp.X = 0;
      activeVehicle.Rp.Y = 0;
      activeVehicle.Rp.Psi = 0;
      activeVehicle.Rp.length = 1;
      activeVehicle.Rp.label = VEHICLE_BODY_LABEL;
      activeVehicle.Rp.color = "#7dd3fc";
      if (!activeVehicle.Sp) {
        activeVehicle.Sp = createCoord(0, 0, 0, 0.25, VEHICLE_STEER_LABEL, "#fbbf24");
      }
      activeVehicle.Sp.X = 0;
      activeVehicle.Sp.Y = 0;
      activeVehicle.Sp.Psi = 0;
      activeVehicle.Sp.length = 0.25;
      activeVehicle.Sp.label = VEHICLE_STEER_LABEL;
      activeVehicle.Sp.color = "#fbbf24";
      return activeVehicle;
    }

    function serializableState() {
      return {
        view: state.view,
        radius: state.radius,
        ui: state.ui,
        arc: state.arc,
        Vehicles: state.Vehicles,
        vehicleCopies: [],
        simpleVehicleCopies: []
      };
    }

    function buildLiveDebugSnapshot(solution = state.simpleArcSolution || solveSimpleArc()) {
      const arc = getSimpleArcGeometry();
      const bisector = solution?.bisector || getSimpleArcBisectorGeometry(arc);
      const terminalPose = solution?.terminalPose || solution?.complexTerminalPose || null;
      const vc = solution?.vc || solution?.complexVc || null;
      const displaySolution = solution ? {
        ...solution,
        headingChangePerDistance: Number(solution?.slew ?? solution?.sl) || 0
      } : null;
      if (displaySolution) {
        delete displaySolution.slew;
        delete displaySolution.sl;
      }
      return {
        timestamp: new Date().toISOString(),
        inputs: {
          arc: {
            radius: Number(state.arc?.radius) || 0,
            deltaPsi: Number(state.arc?.deltaPsi) || 0,
            angle: Number(state.arc?.angle) || 0,
            length: Number(state.arc?.length) || 0,
            steerMax: Number(state.arc?.steerMax) || 0
          },
          vehicle: state.vehicle ? {
            Rp: normalizeCoord(state.vehicle.Rp || {}, { label: VEHICLE_BODY_LABEL, length: 1, color: "#7dd3fc" }),
            Sp: normalizeCoord(state.vehicle.Sp || {}, { label: VEHICLE_STEER_LABEL, length: 0.25, color: "#fbbf24" }),
            headingChangePerDistance: Number(state.vehicle.sl) || 0
          } : null
        },
        solver: {
          success: Boolean(displaySolution?.success),
          edgeCase: Boolean(displaySolution?.edgeCase),
          edgeCaseReason: displaySolution?.edgeCaseReason || null,
          positionError: Number.isFinite(Number(displaySolution?.positionError)) ? Number(displaySolution.positionError) : null,
          headingError: Number.isFinite(Number(displaySolution?.headingError)) ? Number(displaySolution.headingError) : null,
          headingNormalError: Number.isFinite(Number(displaySolution?.headingNormalError)) ? Number(displaySolution.headingNormalError) : null,
          terminalRadius: Number.isFinite(Number(displaySolution?.terminalRadius)) ? Number(displaySolution.terminalRadius) : null,
          vc,
          terminalPose,
          bisector,
          passCount: Array.isArray(displaySolution?.passes) ? displaySolution.passes.length : 0
        },
        display: {
          coordsReadout: lastPointerWorld
            ? { x: lastPointerWorld.x, y: lastPointerWorld.y }
            : { x: 0, y: 0 },
          renderStatus: renderStatus?.textContent || "",
          debugSummary: formatComplexTerminalSummary(displaySolution),
          vcSummary: formatVcSummary(displaySolution),
          errorSummary: formatErrorSummary(displaySolution)
        }
      };
    }

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const parent = canvas.parentElement;
      const rect = parent ? parent.getBoundingClientRect() : canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) {
        return false;
      }
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return true;
    }

    function scheduleRender() {
      needsRender = true;
      if (animationFrame) return;
      animationFrame = requestAnimationFrame(() => {
        animationFrame = 0;
        if (!needsRender) return;
        needsRender = false;
        try {
          draw();
          const rect = canvas.getBoundingClientRect();
          renderStatus.textContent = `Render: ok ${Math.round(rect.width)}x${Math.round(rect.height)}`;
        } catch (error) {
          console.error(error);
          renderStatus.textContent = `Render error: ${error?.message || error}`;
        }
      });
    }

    function worldToScreen(x, y) {
      const rect = canvas.getBoundingClientRect();
      const scale = state.view.scale;
      const cx = rect.width / 2 + state.view.offsetX;
      const cy = rect.height / 2 + state.view.offsetY;
      return {
        x: cx + x * scale,
        y: cy - y * scale
      };
    }

    function screenToWorld(x, y) {
      const rect = canvas.getBoundingClientRect();
      const scale = state.view.scale;
      const cx = rect.width / 2 + state.view.offsetX;
      const cy = rect.height / 2 + state.view.offsetY;
      return {
        x: (x - cx) / scale,
        y: -(y - cy) / scale
      };
    }

    function intersectLines(p1, d1, p2, d2) {
      const det = d1.x * d2.y - d1.y * d2.x;
      if (Math.abs(det) < 1e-9) return null;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const t = (dx * d2.y - dy * d2.x) / det;
      return {
        x: p1.x + d1.x * t,
        y: p1.y + d1.y * t
      };
    }

    function chooseGridStep(scale) {
      const targetPixels = 80;
      const raw = targetPixels / scale;
      const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10];
      return steps.find(step => step >= raw) ?? 10;
    }

    function drawGrid() {
      if (!state.ui.guides) return;
      const rect = canvas.getBoundingClientRect();
      const step = chooseGridStep(state.view.scale);
      const start = screenToWorld(0, rect.height);
      const end = screenToWorld(rect.width, 0);
      ctx.lineWidth = 1;

      const xMin = Math.floor(start.x / step) * step;
      const xMax = Math.ceil(end.x / step) * step;
      const yMin = Math.floor(start.y / step) * step;
      const yMax = Math.ceil(end.y / step) * step;
      const labelEvery = 5;

      for (let x = xMin, ix = 0; x <= xMax + 1e-9; x += step, ix += 1) {
        const p = worldToScreen(x, 0);
        ctx.strokeStyle = Math.abs(x) < 1e-9 ? "rgba(237,243,255,0.34)" : "rgba(157,173,212,0.14)";
        ctx.beginPath();
        ctx.moveTo(p.x, 0);
        ctx.lineTo(p.x, rect.height);
        ctx.stroke();
        if (Math.abs(x) < 1e-9 || ix % labelEvery !== 0) continue;
        ctx.fillStyle = "rgba(149,162,201,0.85)";
        ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(formatTick(x), p.x + 4, rect.height / 2 + state.view.offsetY + 4);
      }
      for (let y = yMin, iy = 0; y <= yMax + 1e-9; y += step, iy += 1) {
        const p = worldToScreen(0, y);
        ctx.strokeStyle = Math.abs(y) < 1e-9 ? "rgba(237,243,255,0.34)" : "rgba(157,173,212,0.14)";
        ctx.beginPath();
        ctx.moveTo(0, p.y);
        ctx.lineTo(rect.width, p.y);
        ctx.stroke();
        if (Math.abs(y) < 1e-9 || iy % labelEvery !== 0) continue;
        ctx.fillStyle = "rgba(149,162,201,0.85)";
        ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(formatTick(y), rect.width / 2 + state.view.offsetX + 4, p.y + 4);
      }
    }

    function formatTick(value) {
      return value.toFixed(2);
    }

    function drawAxes() {
      const rect = canvas.getBoundingClientRect();
      const ox = worldToScreen(0, 0).x;
      const oy = worldToScreen(0, 0).y;
      ctx.strokeStyle = "rgba(237,243,255,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ox, 0);
      ctx.lineTo(ox, rect.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, oy);
      ctx.lineTo(rect.width, oy);
      ctx.stroke();
      ctx.fillStyle = "rgba(237,243,255,0.85)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("y", ox + 8, 12);
      ctx.fillText("x", rect.width - 14, oy - 18);
    }

    function drawArrow(a, b, stroke, fill, width = 3) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const angle = Math.atan2(dy, dx);
      const head = Math.max(8, 16 / (window.devicePixelRatio || 1));

      ctx.strokeStyle = stroke;
      ctx.fillStyle = fill;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - Math.cos(angle - Math.PI / 8) * head, b.y - Math.sin(angle - Math.PI / 8) * head);
      ctx.lineTo(b.x - Math.cos(angle + Math.PI / 8) * head, b.y - Math.sin(angle + Math.PI / 8) * head);
      ctx.closePath();
      ctx.fill();
    }

    function drawVehiclePerpendicularLine(origin, bodyAngle, alpha = 1, width = 2) {
      const rect = canvas.getBoundingClientRect();
      const length = (Math.hypot(rect.width, rect.height) / Math.max(1, state.view.scale)) + 1;
      const end = {
        x: origin.x - Math.sin(bodyAngle) * length,
        y: origin.y + Math.cos(bodyAngle) * length
      };
      const originS = worldToScreen(origin.x, origin.y);
      const endS = worldToScreen(end.x, end.y);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = `rgba(125,211,252,${Math.min(1, 0.25 * alpha)})`;
      ctx.lineWidth = Math.max(1.5, width);
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(endS.x, endS.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawSteerPerpendicularLine(origin, steerAngle, alpha = 1, width = 2) {
      const rect = canvas.getBoundingClientRect();
      const length = (Math.hypot(rect.width, rect.height) / Math.max(1, state.view.scale)) + 1;
      const end = {
        x: origin.x - Math.sin(steerAngle) * length,
        y: origin.y + Math.cos(steerAngle) * length
      };
      const originS = worldToScreen(origin.x, origin.y);
      const endS = worldToScreen(end.x, end.y);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = `rgba(251,191,36,${Math.min(1, 0.25 * alpha)})`;
      ctx.lineWidth = Math.max(1.5, width);
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(endS.x, endS.y);
      ctx.stroke();
      ctx.restore();
    }

    // VCor is the intersection of the normals to Rp and Sv.
    function getVehiclePerpendicularIntersection(rear, bodyAngle, front, steerAngle) {
      const rpNormalOrigin = rear;
      const rpNormalDirection = {
        x: -Math.sin(bodyAngle),
        y: Math.cos(bodyAngle)
      };
      const svNormalOrigin = front;
      const svNormalDirection = {
        x: -Math.sin(steerAngle),
        y: Math.cos(steerAngle)
      };
      return intersectLines(rpNormalOrigin, rpNormalDirection, svNormalOrigin, svNormalDirection);
    }

    function drawVehicleIntersectionPoint(point, alpha = 1) {
      if (!point) return;
      const p = worldToScreen(point.x, point.y);
      ctx.save();
      ctx.fillStyle = `rgba(125,211,252,${Math.min(1, 0.75 * alpha)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function getSimpleArcDeltaPsi(arc = state.arc) {
      const deltaPsi = Number(arc?.deltaPsi);
      if (Number.isFinite(deltaPsi)) {
        return deltaPsi;
      }
      const angle = Number(arc?.angle);
      return Number.isFinite(angle) ? angle : Math.PI / 2;
    }

    function getSimpleArcLength(arc = state.arc) {
      const radius = Math.abs(Number(arc?.radius) || 0);
      return radius * getSimpleArcDeltaPsi(arc);
    }

    function getSimpleArcVC(terminalPose) {
      if (!terminalPose) return null;
      const rear = {
        x: Number(terminalPose.x) || 0,
        y: Number(terminalPose.y) || 0
      };
      const bodyAngle = Number(terminalPose.angle) || 0;
      const front = {
        x: rear.x + Math.cos(bodyAngle),
        y: rear.y + Math.sin(bodyAngle)
      };
      const steerAngle = bodyAngle + (Number(terminalPose.strAng) || 0);
      return getVehiclePerpendicularIntersection(rear, bodyAngle, front, steerAngle);
    }

    function normalizeSteerMax(rad) {
      return degToRad(normalizeSteerMaxDegrees(radToDeg(Number(rad) || 0)));
    }

    function getShadowCountFromHeadingChange(headingChange, spacingDegrees = 10, densityMultiplier = 1) {
      const stepRadians = degToRad(Math.max(0.1, Number(spacingDegrees) || 10));
      const baseCount = Math.max(0, Math.ceil(Math.abs(Number(headingChange) || 0) / stepRadians) - 1);
      return Math.max(0, Math.round(baseCount * Math.max(0, Number(densityMultiplier) || 1)));
    }

    function getSimpleArcSteerMax(arc = state.arc) {
      return normalizeSteerMax(Number.isFinite(Number(arc?.steerMax)) ? Number(arc.steerMax) : Math.PI / 2);
    }

    function boundDesStrAngSeed(value, steerMax = getSimpleArcSteerMax()) {
      const lowerBound = 0.000001;
      const upperBound = Math.max(lowerBound, Number.isFinite(Number(steerMax)) ? Number(steerMax) : lowerBound);
      const numeric = Number(value);
      return clamp(Number.isFinite(numeric) ? numeric : lowerBound, lowerBound, upperBound);
    }

    function getSimpleArcDesStrAng(arc = state.arc) {
      const desStrAng = Number(arc?.desStrAng);
      if (Number.isFinite(desStrAng)) {
        return boundDesStrAngSeed(desStrAng, getSimpleArcSteerMax(arc));
      }
      return boundDesStrAngSeed(getInitialDesStrAngSeed(arc), getSimpleArcSteerMax(arc));
    }

    function getSimpleArcSlew(arc = state.arc, swtd = state.ui?.swtd) {
      const derived = deriveHeadingRateFromDesStrAng(getSimpleArcDesStrAng(arc), swtd);
      if (Number.isFinite(derived)) {
        return derived;
      }
      const slew = Number(arc?.slew);
      return normalizeSlew(Number.isFinite(slew) ? slew : 1.14);
    }

    function getSimpleArcGeometry() {
      const radius = Number(state.arc?.radius) || 1;
      const deltaPsi = getSimpleArcDeltaPsi();
      const arcLength = getSimpleArcLength();
      const steerMax = getSimpleArcSteerMax();
      const desStrAng = getSimpleArcDesStrAng(state.arc);
      const slew = getSimpleArcSlew();
      const center = { x: 0, y: radius };
      const startAngle = radius >= 0 ? -Math.PI / 2 : Math.PI / 2;
      const turnAngle = Number.isFinite(radius) && Math.abs(radius) > 1e-9
        ? arcLength / radius
        : 0;
      return {
        radius,
        deltaPsi,
        arcLength,
        steerMax,
        desStrAng,
        slew,
        turnAngle,
        center,
        startAngle,
        endAngle: startAngle + turnAngle,
        valid: Number.isFinite(radius) && Number.isFinite(deltaPsi) && Math.abs(radius) > 1e-9 && deltaPsi !== 0
      };
    }

    function getSimpleArcBisectorGeometry(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) {
        return {
          valid: false,
          center: null,
          bisectorPoint: null,
          bisectorAngle: 0,
          bisectorDir: null,
          bisectorNormal: null
        };
      }
      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const bisectorDir = {
        x: Math.cos(bisectorAngle),
        y: Math.sin(bisectorAngle)
      };
      const bisectorNormal = {
        x: -bisectorDir.y,
        y: bisectorDir.x
      };
      const radius = Math.abs(Number(arc.radius) || 0);
      const bisectorPoint = {
        x: arc.center.x + bisectorDir.x * radius,
        y: arc.center.y + bisectorDir.y * radius
      };
      return {
        valid: true,
        center: { ...arc.center },
        bisectorPoint,
        bisectorAngle,
        bisectorDir,
        bisectorNormal,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        turnAngle: Number(arc.turnAngle) || 0
      };
    }

    function wrapAngle(angle) {
      let wrapped = Number(angle) || 0;
      while (wrapped > Math.PI) wrapped -= Math.PI * 2;
      while (wrapped < -Math.PI) wrapped += Math.PI * 2;
      return wrapped;
    }

    function normalizePositiveAngle(angle) {
      let wrapped = wrapAngle(angle);
      if (wrapped < 0) wrapped += Math.PI * 2;
      return wrapped;
    }

    function signedDistanceToLine(point, origin, direction) {
      if (!point || !origin || !direction) return NaN;
      return (Number(point.x) - Number(origin.x)) * Number(direction.y)
        - (Number(point.y) - Number(origin.y)) * Number(direction.x);
    }

    function angleDistanceToPerpendicular(angle, lineAngle) {
      const targetAngles = [lineAngle + Math.PI / 2, lineAngle - Math.PI / 2];
      let best = Infinity;
      for (const target of targetAngles) {
        const error = Math.abs(wrapAngle(Number(angle) - target));
        if (error < best) best = error;
      }
      return best;
    }

    function integrateLinearSteerPath(headingChangePerDistance, pathLength, sampleCount = Math.max(48, Math.ceil(Math.abs(Number(pathLength) || 0) * 96))) {
      const count = Math.max(2, sampleCount);
      const totalPathLength = Math.max(0, Number(pathLength) || 0);
      const points = [];
      for (let i = 0; i < count; i += 1) {
        const t = count === 1 ? 0 : i / (count - 1);
        const distance = totalPathLength * t;
        const pose = sampleVehiclePoseForSlew({ x: 0, y: 0, angle: 0 }, distance, Number(headingChangePerDistance) || 0, totalPathLength, 0);
        points.push({
          x: Number(pose.x) || 0,
          y: Number(pose.y) || 0,
          heading: Number(pose.angle) || 0,
          strAng: Number(pose.strAng) || 0
        });
      }
      const terminalPose = sampleVehiclePoseForSlew({ x: 0, y: 0, angle: 0 }, totalPathLength, Number(headingChangePerDistance) || 0, totalPathLength, 0);
      return {
        points,
        terminalPose: {
          x: Number(terminalPose.x) || 0,
          y: Number(terminalPose.y) || 0,
          angle: Number(terminalPose.angle) || 0,
          strAng: Number(terminalPose.strAng) || 0
        }
      };
    }

    function solveSimpleArcFromServer(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) return null;

      const vehicleVector = getVehicleVector() || { x: 0, y: 0, angle: 0 };
      const swtd = limitSwtdMinimum(state.ui?.swtd);
      const headingChange = Number(arc.deltaPsi) || 0;
      const desStrAng = getSimpleArcDesStrAng(arc);

      try {
        const params = new URLSearchParams({
          radius: String(Number(arc.radius) || 0),
          deltaPsi: String(headingChange),
          swtd: String(swtd),
          headingChange: String(headingChange),
          desStrAng: String(desStrAng),
          steerMax: String(Number(arc.steerMax) || 0),
          hEst: String(simpleArcHeadingEstimateIndex),
          vehicleX: String(Number(vehicleVector.x) || 0),
          vehicleY: String(Number(vehicleVector.y) || 0),
          vehicleAngle: String(Number(vehicleVector.angle) || 0)
        });
        const xhr = new XMLHttpRequest();
        xhr.open("GET", `/api/solve-simple-arc?${params.toString()}`, false);
        xhr.send(null);
        if (xhr.status < 200 || xhr.status >= 300 || !xhr.responseText) {
          return null;
        }
        const parsed = JSON.parse(xhr.responseText);
        if (!parsed || !parsed.ok) {
          return parsed || null;
        }

        const bisector = getSimpleArcBisectorGeometry(arc);
        const terminalPose = normalizePoseData(parsed.terminalPose);
        const vc = parsed.vc || null;
        const complexTerminalPose = normalizePoseData(parsed.complexTerminalPose) || terminalPose;
        const complexVc = parsed.complexVc || vc;
        const terminalRadius = Number.isFinite(Number(parsed.terminalRadius))
          ? Number(parsed.terminalRadius)
          : getDerivedTerminalRadius(complexTerminalPose, complexVc, Number(parsed.radius) || 0);
        const finalPose = normalizePoseData(parsed.finalPose) || terminalPose || null;
        const pathPoints = Array.isArray(parsed.pathPoints)
          ? parsed.pathPoints.map(normalizePathPointData).filter(Boolean)
          : [];
        const passes = Array.isArray(parsed.passes)
          ? parsed.passes.map(pass => ({
              ...pass,
              desStrAng: readDesStrAng(pass),
              strAng: readStrAng(pass, Number(pass?.headingChange) || 0),
              terminalPose: normalizePoseData(pass?.terminalPose),
              finalPose: normalizePoseData(pass?.finalPose),
              complexTerminalPose: normalizePoseData(pass?.complexTerminalPose)
            }))
          : [];
        return {
          ...parsed,
          swtd: limitSwtdMinimum(parsed.swtd ?? parsed.s ?? swtd),
          headingChange: Number(parsed.headingChange ?? parsed.turnAngle ?? headingChange) || 0,
          headingChangePerDistance: Number(parsed.headingChangePerDistance ?? parsed.sl ?? parsed.slew) || 0,
          terminalPose,
          finalPose,
          vc,
          complexTerminalPose,
          complexVc,
          terminalRadius,
          bisector,
          pathPoints,
          passes,
          simpleCurve: null,
          slew: Number(parsed.slew ?? parsed.sl ?? parsed.headingChangePerDistance) || 0,
          strAng: readStrAng(parsed, readStrAng(terminalPose)),
          steeredWheelHeadingChange: Number(parsed.steeredWheelHeadingChange ?? readStrAng(parsed, readStrAng(terminalPose))) || 0,
          steeredWheelTravelDistance: Number(parsed.steeredWheelTravelDistance)
            || Number(parsed.curveLength)
            || 0,
          complexCurveLength: Number(parsed.complexCurveLength) || Number(parsed.curveLength) || 0,
          simpleCurveLength: 0,
          totalTravelDistance: Number(parsed.totalTravelDistance) || (Number(parsed.curveLength) || 0),
          spTravelDistance: Number(parsed.spTravelDistance) || (Number(parsed.curveLength) || 0),
          terminalCoord: parsed.terminalCoord || (finalPose
            ? createCoord(finalPose.x, finalPose.y, finalPose.angle, 1, VEHICLE_BODY_LABEL, "#7dd3fc")
            : null)
        };
      } catch {
        return null;
      }
    }

    function solveSimpleArc(arc = getSimpleArcGeometry()) {
      const serverSolution = solveSimpleArcFromServer(arc);
      if (serverSolution) {
        return serverSolution;
      }

      if (!arc?.valid) {
        return {
          success: false,
          swtd: SWTD_MIN,
          headingChange: 0,
          headingChangePerDistance: getSimpleArcSlew(arc, state.ui?.swtd),
          radius: Number(arc?.radius) || 0,
          arcLength: Number(arc?.arcLength) || 0,
          s: Number(arc?.arcLength) || 0,
          sl: getSimpleArcSlew(arc, state.ui?.swtd),
          slew: getSimpleArcSlew(arc, state.ui?.swtd),
          desStrAng: getSimpleArcDesStrAng(arc),
          turnAngle: Number(arc?.turnAngle) || 0,
          finalHeading: 0,
          strAng: 0,
          steeredWheelHeadingChange: 0,
          positionError: NaN,
          headingError: NaN,
          headingNormalAngle: NaN,
          headingNormalError: NaN,
          headingNormalSatisfied: false,
          terminalPose: null,
          complexTerminalPose: null,
          terminalCoord: null,
          vc: null,
          complexVc: null,
          terminalRadius: NaN,
          spTravelDistance: 0,
          steeredWheelTravelDistance: 0,
          pathPoints: [],
          passes: []
        };
      }
      return {
        success: false,
        edgeCase: false,
        edgeCaseReason: "server-unavailable",
        swtd: limitSwtdMinimum(arc?.arcLength),
        headingChange: Number(arc?.turnAngle) || 0,
        headingChangePerDistance: getSimpleArcSlew(arc, state.ui?.swtd),
        radius: Number(arc?.radius) || 0,
        arcLength: Number(arc?.arcLength) || 0,
        s: Number(arc?.arcLength) || 0,
        sl: getSimpleArcSlew(arc, state.ui?.swtd),
        slew: getSimpleArcSlew(arc, state.ui?.swtd),
        desStrAng: getSimpleArcDesStrAng(arc),
        turnAngle: Number(arc?.turnAngle) || 0,
        finalHeading: 0,
        strAng: 0,
        steeredWheelHeadingChange: 0,
        curveLength: 0,
        complexCurveLength: 0,
        simpleCurveLength: 0,
        totalTravelDistance: 0,
        spTravelDistance: 0,
        steeredWheelTravelDistance: 0,
        positionError: NaN,
        headingError: NaN,
        headingNormalAngle: NaN,
        headingNormalError: NaN,
        headingNormalSatisfied: false,
        vc: null,
        complexVc: null,
        terminalPose: null,
        complexTerminalPose: null,
        finalPose: null,
        terminalCoord: null,
        complexCurve: null,
        simpleCurve: null,
        terminalRadius: NaN,
        pathPoints: [],
        bisector: null,
        steerMax: Number(arc?.steerMax) || 0,
        passes: []
      };
    }

    function sampleSimpleArcPoints(arc = getSimpleArcGeometry(), sampleCount = Math.max(24, Math.ceil(Math.abs(Number(arc?.turnAngle) || 0) * 48))) {
      if (!arc?.valid) return [];
      const points = [];
      const radius = Math.abs(Number(arc.radius) || 0);
      const count = Math.max(2, sampleCount);
      for (let i = 0; i <= count; i += 1) {
        const t = count === 0 ? 0 : i / count;
        const strAng = arc.startAngle + arc.turnAngle * t;
        points.push({
          x: arc.center.x + Math.cos(strAng) * radius,
          y: arc.center.y + Math.sin(strAng) * radius
        });
      }
      return points;
    }

    function getCircleLineIntersections(center, radius, lineOrigin, lineDirection) {
      const directionLength = Math.hypot(Number(lineDirection?.x) || 0, Number(lineDirection?.y) || 0);
      if (directionLength <= 1e-12) return [];
      const direction = {
        x: Number(lineDirection.x) / directionLength,
        y: Number(lineDirection.y) / directionLength
      };
      const ox = Number(lineOrigin?.x) || 0;
      const oy = Number(lineOrigin?.y) || 0;
      const cx = Number(center?.x) || 0;
      const cy = Number(center?.y) || 0;
      const fx = ox - cx;
      const fy = oy - cy;
      const projection = fx * direction.x + fy * direction.y;
      const perpSq = fx * fx + fy * fy - projection * projection;
      const radiusSq = Math.max(0, Number(radius) || 0) ** 2;
      if (perpSq > radiusSq + 1e-9) return [];
      const offset = Math.sqrt(Math.max(0, radiusSq - perpSq));
      const tValues = offset <= 1e-12
        ? [-projection]
        : [-projection - offset, -projection + offset];
      return tValues.map((t) => ({
        x: ox + direction.x * t,
        y: oy + direction.y * t,
        t
      })).sort((a, b) => a.t - b.t);
    }

    function sampleCircularArcPoints(center, radius, startAngle, turnAngle, sampleCount = Math.max(24, Math.ceil(Math.abs(Number(turnAngle) || 0) * 48))) {
      const points = [];
      const count = Math.max(2, sampleCount);
      const safeRadius = Math.abs(Number(radius) || 0);
      const origin = {
        x: Number(center?.x) || 0,
        y: Number(center?.y) || 0
      };
      const start = Number(startAngle) || 0;
      const delta = Number(turnAngle) || 0;
      for (let i = 0; i <= count; i += 1) {
        const t = count === 0 ? 0 : i / count;
        const strAng = start + delta * t;
        points.push({
          x: origin.x + Math.cos(strAng) * safeRadius,
          y: origin.y + Math.sin(strAng) * safeRadius
        });
      }
      return points;
    }

    function buildSimpleCurveGeometry(solution = state.simpleArcSolution || solveSimpleArc()) {
      const terminalPose = solution?.terminalPose || null;
      const vc = solution?.vc || null;
      const bisector = solution?.bisector || null;
      if (!terminalPose || !vc || !bisector?.valid) {
        return {
          valid: false,
          center: null,
          radius: 0,
          startPoint: null,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const center = {
        x: Number(vc.x) || 0,
        y: Number(vc.y) || 0
      };
      const startPoint = {
        x: Number(terminalPose.x) || 0,
        y: Number(terminalPose.y) || 0
      };
      const radius = Math.hypot(startPoint.x - center.x, startPoint.y - center.y);
      if (!Number.isFinite(radius) || radius <= 1e-9) {
        return {
          valid: false,
          center,
          radius: 0,
          startPoint,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const intersections = getCircleLineIntersections(center, radius, bisector.center, bisector.bisectorDir);
      if (!intersections.length) {
        return {
          valid: false,
          center,
          radius,
          startPoint,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const startAngle = Math.atan2(startPoint.y - center.y, startPoint.x - center.x);
      const candidates = intersections.map((point) => {
        const endAngle = Math.atan2(point.y - center.y, point.x - center.x);
        const turnAngle = wrapAngle(endAngle - startAngle);
        return {
          point,
          endAngle,
          turnAngle,
          arcLength: Math.abs(turnAngle) * radius
        };
      });
      candidates.sort((a, b) => {
        if (a.arcLength < b.arcLength - 1e-12) return -1;
        if (a.arcLength > b.arcLength + 1e-12) return 1;
        if (Math.abs(a.turnAngle) < Math.abs(b.turnAngle) - 1e-12) return -1;
        if (Math.abs(a.turnAngle) > Math.abs(b.turnAngle) + 1e-12) return 1;
        return a.point.t - b.point.t;
      });

      const chosen = candidates[0];
      const sampleCount = Math.max(12, Math.ceil(Math.abs(chosen.turnAngle) * 48));
      const pathPoints = sampleCircularArcPoints(center, radius, startAngle, chosen.turnAngle, sampleCount);
      const endPoint = pathPoints[pathPoints.length - 1] || chosen.point;
      const endAngle = startAngle + chosen.turnAngle;
      const endHeading = chosen.turnAngle >= 0 ? endAngle + Math.PI / 2 : endAngle - Math.PI / 2;

      return {
        valid: true,
        center,
        radius,
        startPoint,
        endPoint,
        startAngle,
        endAngle,
        turnAngle: chosen.turnAngle,
        arcLength: Math.abs(chosen.turnAngle) * radius,
        pathPoints,
        startPose: {
          x: startPoint.x,
          y: startPoint.y,
          angle: Number(terminalPose.angle) || 0,
          strAng: Number(terminalPose.strAng) || 0
        },
        endPose: {
          x: endPoint.x,
          y: endPoint.y,
          angle: endHeading,
          heading: endHeading,
          strAng: Number(terminalPose.strAng) || 0
        },
        bisectorPoint: chosen.point,
        bisector
      };
    }

    function getSimpleCurvePathTraces(solution = state.simpleArcSolution || solveSimpleArc()) {
      const simpleCurve = solution?.simpleCurve || null;
      const pathPoints = Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : [];
      return {
        pathPoints,
        worldPoints: pathPoints.map(point => ({
          x: Number(point.x) || 0,
          y: Number(point.y) || 0
        }))
      };
    }

    function getSimpleArcPathTraces(solution = state.simpleArcSolution || solveSimpleArc()) {
      const simpleCurve = solution?.simpleCurve || null;
      const pathPoints = Array.isArray(solution?.pathPoints)
        ? solution.pathPoints
        : (Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : []);
      return {
        pathPoints,
        rpWorldPoints: pathPoints.map(point => ({
          x: Number(point.x) || 0,
          y: Number(point.y) || 0
        }))
      };
    }

    function getSimpleArcBisectorPoint(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) return null;
      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const radius = Math.abs(Number(arc.radius) || 0);
      return {
        x: arc.center.x + Math.cos(bisectorAngle) * radius,
        y: arc.center.y + Math.sin(bisectorAngle) * radius
      };
    }

    function drawSimpleArcBisectorLine(arc, centerS) {
      if (!arc?.valid || !centerS) return;
      const bisectorEnd = getSimpleArcBisectorPoint(arc);
      if (!bisectorEnd) return;
      const bisectorEndS = worldToScreen(bisectorEnd.x, bisectorEnd.y);
      const bisectorRayEndS = extendRayToCanvasEdge(centerS, bisectorEndS);

      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "rgba(249,115,22,0.95)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(centerS.x, centerS.y);
      ctx.lineTo(bisectorRayEndS.x, bisectorRayEndS.y);
      ctx.stroke();
      ctx.restore();
    }

    function extendRayToCanvasEdge(start, through) {
      const rect = canvas.getBoundingClientRect();
      const dx = Number(through?.x) - Number(start?.x);
      const dy = Number(through?.y) - Number(start?.y);
      const candidates = [];
      const eps = 1e-9;

      if (Math.abs(dx) > eps) {
        const tRight = (rect.width - Number(start?.x)) / dx;
        const yRight = Number(start?.y) + dy * tRight;
        if (tRight > 0 && yRight >= 0 && yRight <= rect.height) {
          candidates.push({ t: tRight, x: rect.width, y: yRight, edge: "right" });
        }
        const tLeft = (0 - Number(start?.x)) / dx;
        const yLeft = Number(start?.y) + dy * tLeft;
        if (tLeft > 0 && yLeft >= 0 && yLeft <= rect.height) {
          candidates.push({ t: tLeft, x: 0, y: yLeft, edge: "left" });
        }
      }

      if (Math.abs(dy) > eps) {
        const tBottom = (rect.height - Number(start?.y)) / dy;
        const xBottom = Number(start?.x) + dx * tBottom;
        if (tBottom > 0 && xBottom >= 0 && xBottom <= rect.width) {
          candidates.push({ t: tBottom, x: xBottom, y: rect.height, edge: "bottom" });
        }
        const tTop = (0 - Number(start?.y)) / dy;
        const xTop = Number(start?.x) + dx * tTop;
        if (tTop > 0 && xTop >= 0 && xTop <= rect.width) {
          candidates.push({ t: tTop, x: xTop, y: 0, edge: "top" });
        }
      }

      if (!candidates.length) return through;
      candidates.sort((a, b) => {
        const aAxis = a.edge === "bottom" || a.edge === "right" ? 0 : 1;
        const bAxis = b.edge === "bottom" || b.edge === "right" ? 0 : 1;
        if (aAxis !== bAxis) return aAxis - bAxis;
        return a.t - b.t;
      });
      return candidates[0];
    }

    function drawSimpleArc() {
      const arc = getSimpleArcGeometry();
      if (!arc.valid) return;

      const arcPoints = sampleSimpleArcPoints(arc);

      const originS = worldToScreen(0, 0);
      const centerS = worldToScreen(arc.center.x, arc.center.y);

      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(74,222,128,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(centerS.x, centerS.y);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(74,222,128,0.25)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < arcPoints.length; i += 1) {
        const p = worldToScreen(arcPoints[i].x, arcPoints[i].y);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.beginPath();
      ctx.arc(centerS.x, centerS.y, 4.5, 0, Math.PI * 2);
      ctx.fill();

      drawSimpleArcBisectorLine(arc, centerS);

      const endS = worldToScreen(arcPoints[arcPoints.length - 1].x, arcPoints[arcPoints.length - 1].y);
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(COMPLEX_CURVE_LABEL, centerS.x + 8, centerS.y - 24);
      ctx.fillText(VC_LABEL, centerS.x + 8, centerS.y - 8);
      ctx.fillText(`${TERMINAL_RADIUS_LABEL} = ${Math.abs(arc.radius).toFixed(2)}, arcLength = ${(arc.arcLength).toFixed(2)}`, endS.x + 10, endS.y - 8);
      ctx.restore();
    }

    function drawVehicleInstance(instance, options = {}) {
      const alpha = options.alpha ?? 1;
      const bodyWidth = options.bodyWidth ?? 3;
      const steerWidth = options.steerWidth ?? 2.5;
      const bodyLabel = options.label ?? VEHICLE_BODY_LABEL;
      const steerLabel = options.steerLabel ?? VEHICLE_STEER_LABEL;
      const bodyAngle = Number(instance.angle) || 0;
      const strAng = Number(instance.strAng) || 0;
      const rear = { x: Number(instance.x) || 0, y: Number(instance.y) || 0 };
      const front = {
        x: rear.x + Math.cos(bodyAngle),
        y: rear.y + Math.sin(bodyAngle)
      };
      const rearS = worldToScreen(rear.x, rear.y);
      const frontS = worldToScreen(front.x, front.y);
      const steerEnd = {
        x: front.x + Math.cos(bodyAngle + strAng) * 0.25,
        y: front.y + Math.sin(bodyAngle + strAng) * 0.25
      };
      const steerStartS = worldToScreen(front.x, front.y);
      const steerEndS = worldToScreen(steerEnd.x, steerEnd.y);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `rgba(125,211,252,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = bodyWidth;
      ctx.beginPath();
      ctx.moveTo(rearS.x, rearS.y);
      ctx.lineTo(frontS.x, frontS.y);
      ctx.stroke();

      ctx.strokeStyle = `rgba(251,191,36,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = steerWidth;
      drawArrow(steerStartS, steerEndS, ctx.strokeStyle, ctx.strokeStyle, steerWidth);
      const perpendicularIntersection = getVehiclePerpendicularIntersection(rear, bodyAngle, front, bodyAngle + strAng);
      if (perpendicularIntersection) {
        drawSteerPerpendicularLine(front, bodyAngle + strAng, alpha, steerWidth * 0.9);
        drawVehiclePerpendicularLine(rear, bodyAngle, alpha, bodyWidth * 0.65);
        drawVehicleIntersectionPoint(perpendicularIntersection, alpha);
      }

      drawNode(rearS.x, rearS.y, `rgba(125,211,252,${Math.min(1, 0.9 * alpha)})`);
      drawNode(frontS.x, frontS.y, `rgba(251,191,36,${Math.min(1, 0.9 * alpha)})`);
      drawOffsetLabel(rearS.x, rearS.y, bodyLabel);
      drawOffsetLabel(frontS.x, frontS.y, steerLabel);

      ctx.fillStyle = `rgba(237,243,255,${Math.min(1, 0.7 * alpha)})`;
      ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`${bodyLabel} + ${steerLabel}`, rearS.x + 10, rearS.y - 10);
      ctx.restore();
    }

    function drawVehicle() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      if (!solution?.terminalPose) return;
      const pose = solution.terminalPose;
      drawVehicleInstance(pose, {
        alpha: 1,

        steerWidth: 2.5,
        label: VEHICLE_BODY_LABEL,
        steerLabel: solution?.edgeCase ? `${VEHICLE_STEER_LABEL} (limit)` : VEHICLE_STEER_LABEL
      });

        `${solution?.edgeCase ? EDGE_CASE_LABEL : TERMINAL_POSE_LABEL}  ψ = ${formatAngle(Number(pose.heading) || Number(pose.angle) || 0)}`,

    function drawComplexTerminalPose() {

    function drawComplexVcPoint() {
      const vc = state.simpleArcSolution?.vc || state.simpleArcSolution?.complexVc || null;
      if (!vc) return;
      const vcS = worldToScreen(Number(vc.x) || 0, Number(vc.y) || 0);
      const vcLabel = `${VC_LABEL} (${formatFixed3(Number(vc.x) || 0)}, ${formatFixed3(Number(vc.y) || 0)})`;
      ctx.save();
      ctx.fillStyle = "rgba(251,191,36,0.95)";
      ctx.beginPath();

    function drawVehicleCorToBisectorNormal() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      const vcSource = solution?.complexCurve?.vc || solution?.vc || solution?.complexVc || null;
      const bisector = solution?.bisector || getSimpleArcBisectorGeometry(getSimpleArcGeometry());
      if (!vcSource || !bisector?.valid) return;

      const vc = {
        x: Number(vcSource?.x) || 0,
        y: Number(vcSource?.y) || 0
      };
      const center = {
        x: Number(bisector.center?.x) || 0,
        y: Number(bisector.center?.y) || 0
      };
      const bisectorDir = bisector.bisectorDir || {
        x: Number(bisector.bisectorNormal?.y) || 0,
        y: -(Number(bisector.bisectorNormal?.x) || 0)
      };
      const bisectorLength = Math.hypot(bisectorDir.x, bisectorDir.y) || 1;
      const unitBisector = {
        x: bisectorDir.x / bisectorLength,
        y: bisectorDir.y / bisectorLength
      };
      const offset = {
        x: vc.x - center.x,
        y: vc.y - center.y
      };
      const projectionDistance = offset.x * unitBisector.x + offset.y * unitBisector.y;
      const projectedPoint = {
        x: center.x + unitBisector.x * projectionDistance,
        y: center.y + unitBisector.y * projectionDistance
      };
      const pErr = Number.isFinite(Number(solution?.pErr))
        ? Number(solution.pErr)
        : getSignedBisectorDistance(vc, bisector);
      const vcS = worldToScreen(vc.x, vc.y);
      const projectedS = worldToScreen(projectedPoint.x, projectedPoint.y);
      const lengthPx = Math.hypot(projectedS.x - vcS.x, projectedS.y - vcS.y);

      ctx.save();
      if (lengthPx > 1) {
        drawArrow(vcS, projectedS, "rgba(248,113,113,0.95)", "rgba(248,113,113,0.95)", 3);
      }
      ctx.fillStyle = "rgba(251,113,133,0.95)";
      ctx.beginPath();
      ctx.arc(projectedS.x, projectedS.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(vcS.x, vcS.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`pErr ${formatFixed3(pErr)}`, projectedS.x + 8, projectedS.y - 8);
      ctx.restore();
    }

    function drawVehicleCopies() {
      const complexCopies = Array.isArray(state.vehicleCopies) ? state.vehicleCopies : [];
      if (!complexCopies.length) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const combined = complexCopies.map((copy, index) => ({
        copy,
        label: index === 0 ? "vehicleCopies[0]" : "",
        bodyWidth: 2.5,
        steerWidth: 1.9
      }));

      const total = Math.max(1, combined.length - 1);
      for (let i = 0; i < combined.length; i += 1) {
        const entry = combined[i];
        const t = total === 0 ? 1 : i / total;
        const alpha = 0.30 + 0.60 * Math.pow(t, 0.9);
        drawVehicleInstance(entry.copy, {
          alpha,
          bodyWidth: entry.bodyWidth,
          steerWidth: entry.steerWidth,
          label: entry.label,
          steerLabel: ""
        });
      }

      ctx.restore();
    }

    function getVehicleCopyTracePoints(copies) {
      const points = [];
      if (!Array.isArray(copies)) {
        return points;
      }
      for (const copy of copies) {
        const x = Number(copy?.x);
        const y = Number(copy?.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        points.push({ x, y });
      }
      return points;
    }

    function drawVehiclePathTrace() {
      const complexPoints = getVehicleCopyTracePoints(state.vehicleCopies).map(point => worldToScreen(point.x, point.y));
      if (complexPoints.length < 2) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const drawTrace = (points, strokeStyle, width, startFill, endFill) => {
        if (points.length < 2) return;
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        const start = points[0];
        const end = points[points.length - 1];
        ctx.fillStyle = startFill;
        ctx.beginPath();
        ctx.arc(start.x, start.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = endFill;
        ctx.beginPath();
        ctx.arc(end.x, end.y, 3, 0, Math.PI * 2);
        ctx.fill();
      };

      // Complex Rp trace is red and thin.
      drawTrace(
        complexPoints,
        "rgba(248,113,113,0.82)",
        1.5,
        "rgba(248,113,113,0.95)",
        "rgba(248,113,113,0.95)"
      );

      ctx.restore();
    }

    function drawNode(x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + 8, y - 8);
    }

    function drawOffsetLabel(x, y, label, offsetX = 12, offsetY = -18) {
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + offsetX, y + offsetY);
    }

    function drawHandle(x, y, color) {
      ctx.fillStyle = "#070b16";
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "rgba(6, 10, 20, 0.38)";
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (initialVehicleSequenceFitPending) {
        fitView();
        initialVehicleSequenceFitPending = false;
        scheduleRender();
      }
      drawGrid();
      drawAxes();
      if (state.ui.vehicle) {
      drawVehiclePathTrace();
      }
      drawVehicleCopies();
      drawSimpleArc();
      drawComplexTerminalPose();
      drawComplexVcPoint();
      if (state.ui.vehicle) {
        drawVehicle();
        drawVehicleCorToBisectorNormal();
      }

    function updateMetrics() {
      coordsReadout.textContent = lastPointerWorld
        ? `x: ${lastPointerWorld.x.toFixed(3)}, y: ${lastPointerWorld.y.toFixed(3)}`
        : "x: 0.000, y: 0.000";
    }

    function updateJson() {
      if (jsonOutput) {
        const snapshot = buildLiveDebugSnapshot();
        jsonOutput.value = jsonCompactView
          ? JSON.stringify(snapshot)
          : JSON.stringify(snapshot, null, 2);
      }
    }

    function getJsonSnapshotText() {
      return jsonOutput ? String(jsonOutput.value || "") : "";
    }

    function getJsonSnapshotObject() {
      const text = getJsonSnapshotText();
      if (!text) {
        return null;
      }
      try {
        return JSON.parse(text);
      } catch {
        return null;
      }
    }

    async function copyJsonSnapshot() {
      const snapshot = getJsonSnapshotText() || (jsonCompactView
        ? JSON.stringify(buildLiveDebugSnapshot())
        : JSON.stringify(buildLiveDebugSnapshot(), null, 2));
      try {
        await navigator.clipboard.writeText(snapshot);
        if (copyJsonButton) {
          const prev = copyJsonButton.textContent;
          copyJsonButton.textContent = "Copied";
          window.setTimeout(() => {
            if (copyJsonButton) {
              copyJsonButton.textContent = prev;
            }
          }, 1000);

        if (jsonOutput) {
          jsonOutput.focus();
          jsonOutput.select();
          document.execCommand("copy");

      jsonCompactView = !!compact;

    function pickPassCandidate(pass) {
      const candidates = [pass?.steerBest, pass?.pathBest].filter(Boolean);
      return candidates.reduce((best, current) => {
        if (!best) return current;
        const bestScore = [
          best?.positionError,
          best?.headingError,
          best?.pathLength,
          best?.finalSteer
        ].reduce((count, value) => count + (Number.isFinite(Number(value)) ? 1 : 0), 0);
        const currentScore = [
          current?.positionError,
          current?.headingError,
          current?.pathLength,
          current?.finalSteer
        ].reduce((count, value) => count + (Number.isFinite(Number(value)) ? 1 : 0), 0);
        return currentScore > bestScore ? current : best;
      }, null);
    }

    function buildPassPreviewSolution(pass, index, sourceSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc()) {
      const arc = getSimpleArcGeometry();
      const sourcePasses = Array.isArray(sourceSolution?.passes) ? sourceSolution.passes : [];
      const isLastPass = Boolean(sourceSolution?.showShadows) && sourcePasses.length > 0 && Number(index) === sourcePasses.length - 1;
      const candidate = pickPassCandidate(pass);
      const swtd = limitSwtdMinimum(pass?.swtd ?? pass?.pathCenter ?? candidate?.pathLength ?? sourceSolution?.swtd);
      const headingChange = Number(pass?.headingChange ?? pass?.steerCenter ?? candidate?.finalSteer ?? sourceSolution?.headingChange ?? 0) || 0;
      const desStrAng = Number(pass?.desStrAng ?? sourceSolution?.desStrAng);
      const headingChangePerDistanceDerived = deriveHeadingRateFromDesStrAng(desStrAng, swtd);
      const headingChangePerDistance = Number.isFinite(headingChangePerDistanceDerived)
        ? headingChangePerDistanceDerived
        : (Number(pass?.hRt ?? pass?.headingChangePerDistance ?? candidate?.Slew ?? sourceSolution?.headingChangePerDistance ?? sourceSolution?.sl ?? sourceSolution?.slew ?? (Math.abs(swtd) > 1e-12 ? headingChange / swtd : 0)) || 0);
      const terminalPose = pass?.terminalPose || candidate?.Path?.TerminalPose || candidate?.result?.terminalPose || candidate?.terminalPose || sourceSolution?.terminalPose || sourceSolution?.finalPose || null;
      const vc = pass?.vc || pass?.complexVc || candidate?.vc || candidate?.complexVc || sourceSolution?.vc || sourceSolution?.complexVc || (terminalPose ? getSimpleArcVC(terminalPose) : null);
      const bisector = sourceSolution?.bisector || getSimpleArcBisectorGeometry(arc);
      const terminalRadius = Number.isFinite(Number(sourceSolution?.terminalRadius))
        ? Number(sourceSolution.terminalRadius)
        : getDerivedTerminalRadius(terminalPose, vc, Number(state.arc?.radius) || 0);
      const headingError = Number(candidate?.headingError ?? sourceSolution?.headingError ?? 0);
      const positionError = Number(candidate?.positionError ?? sourceSolution?.positionError ?? 0);
      const headingNormalError = getSignedHeadingNormalError(terminalPose, bisector);
      return {
        ...(sourceSolution || {}),
        success: Boolean(sourceSolution?.success) || (Number.isFinite(positionError) && Number.isFinite(headingError)),
        edgeCase: Boolean(sourceSolution?.edgeCase),
        edgeCaseReason: sourceSolution?.edgeCaseReason || null,
        passIndex: Number(index) || 0,
        pass: Number.isFinite(Number(index)) ? Number(index) : 0,
        hEst: getHeadingEstimateIndex(sourceSolution),
        desStrAng: Number.isFinite(desStrAng) ? desStrAng : sourceSolution?.desStrAng,
        passCandidate: candidate || null,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        swtd,
        headingChange,
        headingChangePerDistance,
        s: swtd,
        slew: headingChangePerDistance,
        sl: headingChangePerDistance,
        turnAngle: headingChange,
        strAng: headingChange,
        finalHeading: Number.isFinite(Number(terminalPose?.angle)) ? Number(terminalPose.angle) : 0,
        showShadows: isLastPass,
        curveLength: swtd,
        complexCurveLength: swtd,
        steeredWheelTravelDistance: swtd,
        simpleCurveLength: 0,
        totalTravelDistance: swtd,
        spTravelDistance: swtd,
        positionError: Number.isFinite(positionError) ? Math.abs(positionError) : NaN,
        headingError: Number.isFinite(headingError) ? Math.abs(headingError) : NaN,
        headingNormalAngle: Number.isFinite(Number(terminalPose?.angle))
          ? normalizePositiveAngle(Number(terminalPose.angle) + Math.PI / 2)
          : NaN,
        headingNormalError: Number.isFinite(headingNormalError) ? Math.abs(headingNormalError) : NaN,
        hErr: headingNormalError,
        headingNormalSatisfied: Number.isFinite(headingNormalError) ? Math.abs(headingNormalError) <= 1e-5 : false,
        vc,
        terminalPose,
        finalPose: terminalPose,
        complexTerminalPose: terminalPose,
        complexVc: vc,
        terminalRadius,
        terminalCoord: terminalPose ? createCoord(terminalPose.x, terminalPose.y, terminalPose.angle, 1, VEHICLE_BODY_LABEL, "#7dd3fc") : null,
        complexCurve: {
          valid: Boolean(terminalPose),
          center: vc ? { ...vc } : null,
          radius: terminalRadius,
          startAngle: 0,
          endAngle: 0,
          turnAngle: headingChange,
          arcLength: swtd,
          pathPoints: terminalPose ? [{
            x: Number(terminalPose.x) || 0,
            y: Number(terminalPose.y) || 0,
            heading: Number(terminalPose.angle) || 0,
            strAng: Number(terminalPose.strAng) || 0
          }] : [],
          terminalPose: terminalPose ? {
            x: Number(terminalPose.x) || 0,
            y: Number(terminalPose.y) || 0,
            angle: Number(terminalPose.angle) || 0,
            strAng: Number(terminalPose.strAng) || 0
          } : null,
          vc,
          bisector: sourceSolution?.bisector || null
        },
        simpleCurve: null,
        pathPoints: terminalPose ? [{
          x: Number(terminalPose.x) || 0,
          y: Number(terminalPose.y) || 0,
          heading: Number(terminalPose.angle) || 0,
          strAng: Number(terminalPose.strAng) || 0
        }] : [],
        bisector,
        steerMax: Number(arc.steerMax) || 0,

    }

    function cloneLoggedPass(pass, index, sourceSolution = simpleArcFullSolution || state.simpleArcTrace || state.simpleArcSolution || solveSimpleArc()) {
      const candidate = pickPassCandidate(pass);
      const swtd = limitSwtdMinimum(pass?.swtd ?? pass?.pathCenter ?? candidate?.pathLength ?? sourceSolution?.swtd);
      const headingChange = Number(pass?.headingChange ?? pass?.steerCenter ?? candidate?.finalSteer ?? sourceSolution?.headingChange ?? 0) || 0;
      const desStrAng = Number(pass?.desStrAng ?? sourceSolution?.desStrAng);
      const headingChangePerDistanceDerived = deriveHeadingRateFromDesStrAng(desStrAng, swtd);
      const headingChangePerDistance = Number.isFinite(headingChangePerDistanceDerived)
        ? headingChangePerDistanceDerived
        : (Number(pass?.hRt ?? pass?.headingChangePerDistance ?? candidate?.Slew ?? sourceSolution?.headingChangePerDistance ?? sourceSolution?.sl ?? sourceSolution?.slew ?? (Math.abs(swtd) > 1e-12 ? headingChange / swtd : 0)) || 0);
      const terminalPose = sourceSolution?.terminalPose || sourceSolution?.finalPose || pass?.terminalPose || candidate?.Path?.TerminalPose || candidate?.result?.terminalPose || candidate?.terminalPose || null;
      const vc = sourceSolution?.vc || sourceSolution?.complexVc || pass?.vc || pass?.complexVc || candidate?.vc || candidate?.complexVc || (terminalPose ? getSimpleArcVC(terminalPose) : null);
      const bisector = sourceSolution?.bisector || getSimpleArcBisectorGeometry(getSimpleArcGeometry());
      const terminalRadius = Number.isFinite(Number(sourceSolution?.terminalRadius))
        ? Number(sourceSolution.terminalRadius)
        : getDerivedTerminalRadius(terminalPose, vc, Number(state.arc?.radius) || 0);
      const headingError = Number(pass?.headingError ?? candidate?.headingError ?? sourceSolution?.headingError ?? 0);
      const positionError = Number(pass?.positionError ?? candidate?.positionError ?? sourceSolution?.positionError ?? 0);
      const headingNormalError = getSignedHeadingNormalError(terminalPose, bisector);
      const signedPositionError = Number(pass?.pErr ?? candidate?.pErr ?? positionError);
      const signedHeadingError = Number(pass?.hErr ?? candidate?.hErr ?? headingNormalError);
      return {
        ...(sourceSolution || {}),
        passIndex: Number(index) || 0,
        pass: Number.isFinite(Number(index)) ? Number(index) : 0,
