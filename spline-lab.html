<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spline-Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --bg-2: #0c1224;
      --panel: rgba(13, 18, 34, 0.92);
      --panel-strong: rgba(18, 25, 46, 0.98);
      --line: rgba(157, 173, 212, 0.18);
      --line-strong: rgba(157, 173, 212, 0.28);
      --text: #edf3ff;
      --muted: #95a2c9;
      --accent: #7dd3fc;
      --accent-2: #7ef0bf;
      --warn: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(126, 240, 191, 0.12), transparent 24%),
        linear-gradient(180deg, #060914 0%, var(--bg) 55%, #05070f 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
      padding: 18px 20px 14px;
    }
    .titleblock h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(125, 211, 252, 0.08);
      color: var(--accent);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 364px;
      gap: 14px;
      padding: 0 20px 20px;
    }
    .stage-shell, .side {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .stage-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }
    .toolbar:empty {
      height: 0;
      min-height: 0;
      padding: 0;
      border-bottom: 0;
      background: none;
      overflow: hidden;
    }
    .stage-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hint {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.02);
    }
    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .side-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .side-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.04em;
    }
    .side-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel:last-child {
      border-bottom: 0;
    }
    .panel-title {
      margin: 0 0 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .control {
      display: grid;
      gap: 6px;
    }
    .control.full {
      grid-column: 1 / -1;
    }
    .control.compact {
      gap: 4px;
    }
    .control.compact label {
      font-size: 11px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input[type="number"], input[type="text"], input[type="color"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }
    input[type="range"] {
      width: 100%;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat .k {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .stat .v {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .json {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 8, 16, 0.6);
      color: #dce7ff;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 1080px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .workspace {
        grid-template-columns: 1fr;
      }
      .stage-shell {
        min-height: 66vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="titleblock">
        <h1>Spline-Lab</h1>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-shell">
        <div class="toolbar" aria-hidden="true"></div>
        <div class="stage-wrap">
          <canvas id="stage"></canvas>
        </div>
        <div class="hint">
          <div id="coordsReadout">x: 0.00, y: 0.00</div>
          <div id="renderStatus" class="sub" style="margin-top: 8px; font-size: 12px;"></div>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="controls">
            <div class="control">
              <label for="arcRadius">Radius</label>
              <input id="arcRadius" type="number" min="-100" max="100" step="0.01" value="1.00" />
            </div>
            <div class="control">
              <label for="arcAngle">Delta Psi (DP)</label>
              <input id="arcAngle" type="number" min="0" max="180" step="1" value="90" inputmode="numeric" />
              <div id="arcAngleDisplay" class="sub" style="margin: 0; font-size: 12px;">1.571 (90)</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div id="dependentList" class="controls"></div>
        </section>

      </aside>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "vehicle-vector-lab-state-v1";
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const arcRadiusInput = document.getElementById("arcRadius");
    const arcAngleInput = document.getElementById("arcAngle");
    const arcAngleDisplay = document.getElementById("arcAngleDisplay");
    const dependentList = document.getElementById("dependentList");
    const jsonOutput = document.getElementById("jsonOutput");
    const coordsReadout = document.getElementById("coordsReadout");
    const renderStatus = document.getElementById("renderStatus");

    const COLORS = ["#7dd3fc", "#7ef0bf", "#fbbf24", "#fb7185", "#c084fc", "#f97316"];
    const randomId = () => {
      if (window.crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    };

    const state = loadState() ?? createDefaultState();
    Object.defineProperty(state, "vehicle", {
      get() {
        return state.Vehicles[0] || null;
      },
      set(value) {
        state.Vehicles[0] = value;
      }
    });
    let needsRender = true;
    let animationFrame = 0;
    let drag = null;
    let dependentListDirty = true;
    let initialized = false;
    let initialVehicleSequenceFitPending = true;

    function createCoord(X = 0, Y = 0, Psi = 0, length = 1, label = "Coord", color = "#7dd3fc") {
      const coord = {
        X: Number(X) || 0,
        Y: Number(Y) || 0,
        Psi: Number(Psi) || 0,
        length: Number.isFinite(Number(length)) ? Number(length) : 1,
        label,
        color
      };
      Object.defineProperties(coord, {
        x: {
          get() { return coord.X; },
          set(value) { coord.X = Number(value) || 0; }
        },
        y: {
          get() { return coord.Y; },
          set(value) { coord.Y = Number(value) || 0; }
        },
        angle: {
          get() { return coord.Psi; },
          set(value) { coord.Psi = Number(value) || 0; }
        }
      });
      return coord;
    }

    function createVehicle(overrides = {}) {
      const vehicle = {
        Rp: overrides.Rp ? normalizeCoord(overrides.Rp, { label: "Rp", length: 1, color: "#7dd3fc" }) : createCoord(0, 0, 0, 1, "Rp", "#7dd3fc"),
        Sp: overrides.Sp ? normalizeCoord(overrides.Sp, { label: "Sp", length: 0.25, color: "#fbbf24" }) : createCoord(0, 0, 0, 0.25, "Sp", "#fbbf24"),
        sl: Number.isFinite(Number(overrides.sl)) ? Number(overrides.sl) : Math.PI / 4
      };
      Object.defineProperty(vehicle, "headingChange", {
        enumerable: false,
        get() {
          return Number(vehicle.Sp?.Psi) || 0;
        },
        set(value) {
          if (!vehicle.Sp) {
            vehicle.Sp = createCoord(0, 0, 0, 0.25, "Sp", "#fbbf24");
          }
          vehicle.Sp.Psi = Number(value) || 0;
        }
      });
      Object.defineProperty(vehicle, "finalPose", {
        enumerable: false,
        configurable: true,
        writable: true,
        value: overrides.finalPose || null
      });
      return vehicle;
    }

    function createAnchorVehicle(sl = Math.PI / 4) {
      return createVehicle({
        Rp: createCoord(0, 0, 0, 1, "Rp", "#7dd3fc"),
        Sp: createCoord(0, 0, 0, 0.25, "Sp", "#fbbf24"),
        sl
      });
    }

    function createDefaultState() {
      return {
        view: { scale: 150, offsetX: 0, offsetY: 0 },
        radius: 4,
        ui: { guides: true, vehicle: true },
        arc: { radius: 1, deltaPsi: Math.PI / 2, angle: Math.PI / 2, length: Math.PI / 2 },
        Vehicles: [createAnchorVehicle()],
        vehicleCopies: [],
        simpleArcSolution: null,
        selectedId: null,
        vectors: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;
        const defaultState = createDefaultState();
        const parsedVehicle = parsed.vehicle || {};
        const parsedVehicles = Array.isArray(parsed.Vehicles) ? parsed.Vehicles : (parsed.vehicle ? [parsed.vehicle] : []);
        const normalizedVehicles = parsedVehicles.length
          ? parsedVehicles.map(normalizeVehicle)
          : defaultState.Vehicles.map(normalizeVehicle);
        if (normalizedVehicles[0]) {
          normalizedVehicles[0] = createAnchorVehicle(normalizedVehicles[0].sl);
        }
        return {
          ...defaultState,
          ...parsed,
          radius: Number.isFinite(Number(parsed.radius))
            ? Number(parsed.radius)
            : (Number.isFinite(Number(parsedVehicle.radius))
              ? Number(parsedVehicle.radius)
              : defaultState.radius),
          view: { ...defaultState.view, ...(parsed.view || {}) },
          ui: { ...defaultState.ui, ...(parsed.ui || {}), vehicle: true },
          arc: {
            ...defaultState.arc,
            ...(parsed.arc || {}),
            deltaPsi: snapDeltaPsiToWholeDegrees(Number.isFinite(Number(parsed.arc?.deltaPsi))
              ? Number(parsed.arc.deltaPsi)
              : (Number.isFinite(Number(parsed.arc?.angle))
                ? Number(parsed.arc.angle)
                : (Number.isFinite(Number(parsed.arc?.length)) && Number.isFinite(Number(parsed.arc?.radius))
                  ? Number(parsed.arc.length) / Math.max(1e-9, Math.abs(Number(parsed.arc.radius)))
                  : defaultState.arc.deltaPsi))),
            angle: snapDeltaPsiToWholeDegrees(Number.isFinite(Number(parsed.arc?.deltaPsi))
              ? Number(parsed.arc.deltaPsi)
              : (Number.isFinite(Number(parsed.arc?.angle))
                ? Number(parsed.arc.angle)
                : (Number.isFinite(Number(parsed.arc?.length)) && Number.isFinite(Number(parsed.arc?.radius))
                  ? Number(parsed.arc.length) / Math.max(1e-9, Math.abs(Number(parsed.arc.radius)))
                  : defaultState.arc.angle))),
            length: Math.abs(Number(Number.isFinite(Number(parsed.arc?.radius)) ? Number(parsed.arc.radius) : defaultState.arc.radius))
              * snapDeltaPsiToWholeDegrees(Number.isFinite(Number(parsed.arc?.deltaPsi))
                ? Number(parsed.arc.deltaPsi)
                : (Number.isFinite(Number(parsed.arc?.angle))
                  ? Number(parsed.arc.angle)
                  : (Number.isFinite(Number(parsed.arc?.length)) && Number.isFinite(Number(parsed.arc?.radius))
                    ? Number(parsed.arc.length) / Math.max(1e-9, Math.abs(Number(parsed.arc.radius)))
                    : defaultState.arc.deltaPsi)))
          },
          Vehicles: normalizedVehicles,
          vehicleCopies: [],
          simpleArcSolution: null,
          vectors: normalizeVectors(Array.isArray(parsed.vectors) ? parsed.vectors : defaultState.vectors),
        };
      } catch {
        return null;
      }
    }

    function normalizeCoord(coord, defaults = {}) {
      const X = Number.isFinite(Number(coord?.X)) ? Number(coord.X) : (Number.isFinite(Number(coord?.x)) ? Number(coord.x) : Number(defaults.X) || 0);
      const Y = Number.isFinite(Number(coord?.Y)) ? Number(coord.Y) : (Number.isFinite(Number(coord?.y)) ? Number(coord.y) : Number(defaults.Y) || 0);
      const Psi = Number.isFinite(Number(coord?.Psi)) ? Number(coord.Psi) : (Number.isFinite(Number(coord?.angle)) ? Number(coord.angle) : Number(defaults.Psi) || 0);
      const length = Number.isFinite(Number(coord?.length)) ? Number(coord.length) : (Number.isFinite(Number(defaults.length)) ? Number(defaults.length) : 1);
      const label = coord?.label || defaults.label || "Coord";
      const color = coord?.color || defaults.color || "#7dd3fc";
      return createCoord(X, Y, Psi, length, label, color);
    }

    function normalizeVehicle(vehicle) {
      const raw = vehicle || {};
      const rpSource = raw.Rp || raw.rp || raw.rear || raw;
      const spSource = raw.Sp || raw.sp || {};
      const rp = normalizeCoord(rpSource, { label: "Rp", length: 1, color: "#7dd3fc" });
      const sp = normalizeCoord(spSource, { label: "Sp", length: 0.25, color: "#fbbf24" });
      if (!Number.isFinite(Number(spSource?.Psi)) && Number.isFinite(Number(raw.headingChange))) {
        sp.Psi = Number(raw.headingChange) || 0;
      }
      if (!Number.isFinite(Number(sp.Psi))) {
        sp.Psi = 0;
      }
      return createVehicle({
        Rp: rp,
        Sp: sp,
        sl: Number.isFinite(Number(raw.sl)) ? Number(raw.sl) : 0.01,
        finalPose: null
      });
    }

    function normalizeVector(vector) {
      const angle = Number(vector?.angle) || 0;
      return {
        ...vector,
        angle: Math.abs(angle) > Math.PI * 2 ? degToRad(angle) : angle
      };
    }

    function normalizeVectors(vectors) {
      const cleaned = [];
      for (const vector of vectors) {
        const normalized = normalizeVector(vector);
        if (normalized.label === "Veh" || normalized.label === "Vehicle vector" || normalized.label === "Heading" || normalized.label === "Sv" || normalized.label === "Steer vector") continue;
        cleaned.push(normalized);
      }
      return cleaned;
    }

    function isSteerVector(vector) {
      return vector?.label === "Sv" || vector?.label === "Steer vector";
    }

    function isThetaVector(vector) {
      return isSteerVector(vector);
    }

    function normalizeVehicleCopies(copies) {
      return copies
        .map(copy => ({
          id: copy?.id || randomId(),
          x: Number(copy?.x) || 0,
          y: Number(copy?.y) || 0,
          angle: Number(copy?.angle) || 0,
          theta: Number(copy?.theta) || 0,
          radius: Number(copy?.radius) || 0,
          curveLength: Number(copy?.curveLength) || 0,
          label: copy?.label || "Veh",
          steerLabel: copy?.steerLabel || "Sv"
        }))
        .filter(copy => Number.isFinite(copy.x) && Number.isFinite(copy.y) && Number.isFinite(copy.angle));
    }

    const vehiclePoseQuadratureNodes = [
      -0.9602898564975363,
      -0.7966664774136267,
      -0.525532409916329,
      -0.1834346424956498,
      0.1834346424956498,
      0.525532409916329,
      0.7966664774136267,
      0.9602898564975363
    ];

    const vehiclePoseQuadratureWeights = [
      0.10122853629037626,
      0.22238103445337448,
      0.31370664587788727,
      0.36268378337836196,
      0.36268378337836196,
      0.31370664587788727,
      0.22238103445337448,
      0.10122853629037626
    ];

    const vehiclePoseBesselCache = {
      slew: NaN,
      limit: -1,
      values: []
    };

    function complexAdd(a, b) {
      return { re: a.re + b.re, im: a.im + b.im };
    }

    function complexScale(a, scale) {
      return { re: a.re * scale, im: a.im * scale };
    }

    function complexMul(a, b) {
      return {
        re: a.re * b.re - a.im * b.im,
        im: a.re * b.im + a.im * b.re
      };
    }

    function complexExp(angle) {
      return { re: Math.cos(angle), im: Math.sin(angle) };
    }

    function powMinusI(power) {
      switch ((((power % 4) + 4) % 4)) {
        case 0: return { re: 1, im: 0 };
        case 1: return { re: 0, im: -1 };
        case 2: return { re: -1, im: 0 };
        default: return { re: 0, im: 1 };
      }
    }

    function besselJ(order, x) {
      const n = Math.abs(Math.trunc(order));
      if (x === 0) return n === 0 ? 1 : 0;
      let term = Math.pow(x / 2, n) / factorial(n);
      let sum = term;
      const x2 = -(x * x) / 4;
      for (let m = 1; m < 80; m += 1) {
        term *= x2 / (m * (m + n));
        sum += term;
        if (Math.abs(term) < Math.abs(sum) * 1e-13 + 1e-15) break;
      }
      return order < 0 && (n % 2 === 1) ? -sum : sum;
    }

    function factorial(n) {
      let result = 1;
      for (let i = 2; i <= n; i += 1) result *= i;
      return result;
    }

    function getBesselTable(slew, limit) {
      if (vehiclePoseBesselCache.slew === slew && vehiclePoseBesselCache.limit >= limit) {
        return vehiclePoseBesselCache.values;
      }
      const values = [];
      for (let order = 0; order <= limit; order += 1) {
        values[order] = besselJ(order, 1 / slew);
      }
      vehiclePoseBesselCache.slew = slew;
      vehiclePoseBesselCache.limit = limit;
      vehiclePoseBesselCache.values = values;
      return values;
    }

    function integrateVehiclePoseFront(vehicleVector, distance) {
      const slew = Number(state.vehicle.sl) || 0;
      const invSlew = 1 / slew;
      const phase = invSlew;
      const travel = distance;
      const phaseSpan = slew * travel;
      const harmonicLimit = Math.max(12, Math.ceil(Math.abs(invSlew) + 24));
      const besselValues = getBesselTable(slew, harmonicLimit + 1);
      let integral = { re: 0, im: 0 };

      for (let m = -harmonicLimit; m <= harmonicLimit; m += 1) {
        const besselOrder = m - 1;
        const besselValue = besselValues[Math.abs(besselOrder)] || 0;
        const besselTerm = besselOrder < 0 && (Math.abs(besselOrder) % 2 === 1) ? -besselValue : besselValue;
        const harmonic = m === 0
          ? { re: phaseSpan, im: 0 }
          : {
              re: Math.sin(m * phaseSpan) / m,
              im: (1 - Math.cos(m * phaseSpan)) / m
            };
        const term = complexMul(
          complexMul(powMinusI(m - 1), { re: besselTerm, im: 0 }),
          harmonic
        );
        integral = complexAdd(integral, term);
      }

      integral = complexScale(integral, 1 / slew);
      const front = complexMul(complexExp(phase), integral);
      const bodyDelta = (2 * Math.sin(phaseSpan / 2) ** 2) / slew;
      const bodyVector = complexExp(bodyDelta);
      const localRear = {
        re: 1 + front.re - bodyVector.re,
        im: front.im - bodyVector.im
      };
      return {
        x: localRear.re,
        y: localRear.im,
        angle: bodyDelta,
        theta: slew * travel
      };
    }

    function integrateVehiclePoseFallback(vehicleVector, distance) {
      const slew = Number(state.vehicle.sl) || 0;
      const travel = distance;
      const bodyDelta = slew === 0 ? 0 : (2 * Math.sin((slew * travel) / 2) ** 2) / slew;
      const integralNodes = vehiclePoseQuadratureNodes;
      const integralWeights = vehiclePoseQuadratureWeights;
      const halfTravel = travel / 2;
      let frontX = 1;
      let frontY = 0;

      for (let i = 0; i < integralNodes.length; i += 1) {
        const s = halfTravel * (integralNodes[i] + 1);
        const phase = slew * s + (slew === 0 ? 0 : (2 * Math.sin((slew * s) / 2) ** 2) / slew);
        frontX += integralWeights[i] * Math.cos(phase) * halfTravel;
        frontY += integralWeights[i] * Math.sin(phase) * halfTravel;
      }

      const rearX = frontX - Math.cos(bodyDelta);
      const rearY = frontY - Math.sin(bodyDelta);
      return {
        x: rearX,
        y: rearY,
        angle: bodyDelta,
        theta: slew * travel
      };
    }

    function sampleVehiclePose(vehicleVector, distance) {
      const curveLength = Math.max(0, getCurveLengthFromGeometry(getVehicleGeometry()));
      const slew = Number(state.vehicle.sl) || 0;
      const baseX = Number(vehicleVector?.x) || 0;
      const baseY = Number(vehicleVector?.y) || 0;
      const localPose = Math.abs(slew) < 0.001
        ? integrateVehiclePoseFallback(vehicleVector, distance)
        : integrateVehiclePoseFront(vehicleVector, distance);
      const baseAngle = Number(vehicleVector?.angle) || 0;
      const cosBase = Math.cos(baseAngle);
      const sinBase = Math.sin(baseAngle);
      return {
        x: baseX + localPose.x * cosBase - localPose.y * sinBase,
        y: baseY + localPose.x * sinBase + localPose.y * cosBase,
        angle: baseAngle + localPose.angle,
        theta: localPose.theta,
        radius: Number(state.radius) || 0,
        curveLength
      };
    }

    function buildVehicleCopies(vehicleVector = getVehicleVector(), terminalPose = getActiveVehicle()?.finalPose, curveLengthOverride = getCurveLengthFromGeometry(getVehicleGeometry())) {
      if (!vehicleVector) return [];
      const curveLength = Math.max(0, Number(curveLengthOverride) || 0);
      const slew = Number(getActiveVehicle()?.sl) || 0;
      return buildVehicleCopiesForSlew(vehicleVector, curveLength, slew, Number(state.radius) || 0, terminalPose);
    }

    function buildVehicleCopiesForSlew(vehicleVector, curveLength, slew, radius = 0, terminalPose = null) {
      const sampleCount = curveLength === 0 ? 1 : Math.max(6, Math.ceil(curveLength * 4));
      const copies = [];
      for (let i = 0; i < sampleCount; i += 1) {
        const t = sampleCount === 1 ? 0 : i / (sampleCount - 1);
        const pose = sampleVehiclePoseForSlew(vehicleVector, curveLength * t, slew, curveLength, radius);
        copies.push({
          id: `vehicle-copy-${sampleCount}-${i}`,
          x: pose.x,
          y: pose.y,
          angle: pose.angle,
          theta: i === 0 ? 0 : pose.theta,
          radius: pose.radius,
          curveLength: pose.curveLength,
          label: "Veh",
          steerLabel: "Sv",
          pathDistance: curveLength * t
        });
      }
      if (copies.length && terminalPose && Number.isFinite(Number(terminalPose.x)) && Number.isFinite(Number(terminalPose.y))) {
        const lastIndex = copies.length - 1;
        copies[lastIndex] = {
          ...copies[lastIndex],
          x: Number(terminalPose.x) || 0,
          y: Number(terminalPose.y) || 0,
          angle: Number(terminalPose.angle) || 0,
          theta: Number(terminalPose.theta) || 0,
          radius: Number(terminalPose.radius) || radius,
          curveLength: Number(terminalPose.curveLength) || curveLength,
          pathDistance: curveLength
        };
      }
      return copies;
    }

    function sampleVehiclePoseForSlew(vehicleVector, distance, slew = 0, curveLength = 0, radius = 0) {
      const baseX = Number(vehicleVector?.x) || 0;
      const baseY = Number(vehicleVector?.y) || 0;
      const localPose = Math.abs(slew) < 0.001
        ? integrateVehiclePoseFallbackForSlew(slew, distance)
        : integrateVehiclePoseFrontForSlew(slew, distance);
      const baseAngle = Number(vehicleVector?.angle) || 0;
      const cosBase = Math.cos(baseAngle);
      const sinBase = Math.sin(baseAngle);
      return {
        x: baseX + localPose.x * cosBase - localPose.y * sinBase,
        y: baseY + localPose.x * sinBase + localPose.y * cosBase,
        angle: baseAngle + localPose.angle,
        theta: localPose.theta,
        radius,
        curveLength
      };
    }

    function integrateVehiclePoseFrontForSlew(slew, distance) {
      const invSlew = 1 / slew;
      const phase = invSlew;
      const travel = distance;
      const phaseSpan = slew * travel;
      const harmonicLimit = Math.max(12, Math.ceil(Math.abs(invSlew) + 24));
      const besselValues = getBesselTable(slew, harmonicLimit + 1);
      let integral = { re: 0, im: 0 };

      for (let m = -harmonicLimit; m <= harmonicLimit; m += 1) {
        const besselOrder = m - 1;
        const besselValue = besselValues[Math.abs(besselOrder)] || 0;
        const besselTerm = besselOrder < 0 && (Math.abs(besselOrder) % 2 === 1) ? -besselValue : besselValue;
        const harmonic = m === 0
          ? { re: phaseSpan, im: 0 }
          : {
              re: Math.sin(m * phaseSpan) / m,
              im: (1 - Math.cos(m * phaseSpan)) / m
            };
        const term = complexMul(
          complexMul(powMinusI(m - 1), { re: besselTerm, im: 0 }),
          harmonic
        );
        integral = complexAdd(integral, term);
      }

      integral = complexScale(integral, 1 / slew);
      const front = complexMul(complexExp(phase), integral);
      const bodyDelta = (2 * Math.sin(phaseSpan / 2) ** 2) / slew;
      const bodyVector = complexExp(bodyDelta);
      const localRear = {
        re: 1 + front.re - bodyVector.re,
        im: front.im - bodyVector.im
      };
      return {
        x: localRear.re,
        y: localRear.im,
        angle: bodyDelta,
        theta: slew * travel
      };
    }

    function integrateVehiclePoseFallbackForSlew(slew, distance) {
      const travel = distance;
      const bodyDelta = slew === 0 ? 0 : (2 * Math.sin((slew * travel) / 2) ** 2) / slew;
      const integralNodes = vehiclePoseQuadratureNodes;
      const integralWeights = vehiclePoseQuadratureWeights;
      const halfTravel = travel / 2;
      let frontX = 1;
      let frontY = 0;

      for (let i = 0; i < integralNodes.length; i += 1) {
        const s = halfTravel * (integralNodes[i] + 1);
        const phase = slew * s + (slew === 0 ? 0 : (2 * Math.sin((slew * s) / 2) ** 2) / slew);
        frontX += integralWeights[i] * Math.cos(phase) * halfTravel;
        frontY += integralWeights[i] * Math.sin(phase) * halfTravel;
      }

      const rearX = frontX - Math.cos(bodyDelta);
      const rearY = frontY - Math.sin(bodyDelta);
      return {
        x: rearX,
        y: rearY,
        angle: bodyDelta,
        theta: slew * travel
      };
    }

    function evaluateVehicleStampedPathForSl(candidateSl, vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      if (!vehicleVector) return [];
      const curveLength = Math.max(0, getCurveLengthFromGeometry(geometry));
      return buildVehicleCopiesForSlew(vehicleVector, curveLength, Number(candidateSl) || 0, Number(geometry?.radius) || 0);
    }

    function getCurrentTurnBisectorGeometry(vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      const radius = Number(geometry?.radius) || 0;
      const curveLength = Math.max(0, getCurveLengthFromGeometry(geometry));
      if (!vehicleVector || radius === 0) {
        return {
          valid: false,
          radius,
          curveLength,
          turnAngle: 0,
          center: null,
          bisectorAngle: 0,
          bisectorOrigin: null,
          bisectorDir: null
        };
      }
      const turnAngle = curveLength / radius;
      const center = getVehicleCorPoint(geometry);
      const startAngle = radius >= 0 ? -Math.PI / 2 : Math.PI / 2;
      const bisectorAngle = startAngle + turnAngle / 2;
      const bisectorDir = {
        x: Math.cos(bisectorAngle),
        y: Math.sin(bisectorAngle)
      };
      return {
        valid: true,
        radius,
        curveLength,
        turnAngle,
        center,
        startAngle,
        bisectorAngle,
        bisectorOrigin: center,
        bisectorDir
      };
    }

    function getVehicleCorPoint(geometry = state.vehicle) {
      const radius = Number(geometry?.radius) || 0;
      return { x: 0, y: radius };
    }

    function getVehicleBisectorContactSolution(vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      const activeVehicle = getActiveVehicle();
      if (!vehicleVector || !activeVehicle) return null;
      const solved = solveVehicleSlForBisectorAlignment(getSolverInitialSl(activeVehicle.sl), vehicleVector, geometry);
      if (!solved?.success || !solved.evaluation?.endPose) return null;
      const coordinate = {
        x: Number(solved.evaluation.endPose.x) || 0,
        y: Number(solved.evaluation.endPose.y) || 0
      };
      return {
        coordinate,
        svTravelDistance: Number(solved.curveLength) || 0,
        cor: getVehicleCorPoint(geometry),
        sl: Number(solved.sl) || 0,
        headingChange: Number(solved.headingChange) || 0,
        success: true
      };
    }

    function scoreVehicleBisectorAlignment(evaluation, geometry = state.vehicle) {
      if (!evaluation || !evaluation.geometry?.valid) {
        return {
          score: NaN,
          lineError: NaN,
          normalizedLineError: NaN,
          perpendicularError: NaN,
          distanceScale: NaN
        };
      }
      const lineError = Number(evaluation.rearDistance);
      const bodyAlignment = Number(evaluation.bodyAlignment);
      if (!Number.isFinite(lineError) || !Number.isFinite(bodyAlignment)) {
        return {
          score: NaN,
          lineError,
          normalizedLineError: NaN,
          perpendicularError: NaN,
          distanceScale: NaN
        };
      }
      const perpendicularError = Math.asin(clamp(bodyAlignment, -1, 1));
      const distanceScale = Math.max(
        1,
        Math.abs(Number(evaluation.geometry?.radius) || 0),
        Math.abs(Number(evaluation.geometry?.curveLength) || 0),
        Math.abs(Number(geometry?.radius) || 0),
        Math.abs(getCurveLengthFromGeometry(geometry))
      );
      const normalizedLineError = lineError / distanceScale;
      return {
        score: normalizedLineError ** 2 + perpendicularError ** 2,
        lineError,
        normalizedLineError,
        perpendicularError,
        distanceScale
      };
    }

    function normalizePointDirection(vector) {
      const length = Math.hypot(Number(vector?.x) || 0, Number(vector?.y) || 0);
      if (!length) return null;
      return {
        x: (Number(vector?.x) || 0) / length,
        y: (Number(vector?.y) || 0) / length
      };
    }

    function dot2(a, b) {
      return (Number(a?.x) || 0) * (Number(b?.x) || 0) + (Number(a?.y) || 0) * (Number(b?.y) || 0);
    }

    function cross2(a, b) {
      return (Number(a?.x) || 0) * (Number(b?.y) || 0) - (Number(a?.y) || 0) * (Number(b?.x) || 0);
    }

    function findPolylineBisectorIntersection(polyline, bisectorOrigin, bisectorDir) {
      if (!Array.isArray(polyline) || polyline.length < 2 || !bisectorOrigin || !bisectorDir) return null;
      const lineDir = normalizePointDirection(bisectorDir);
      if (!lineDir) return null;
      let best = null;
      let pathDistance = 0;

      for (let i = 0; i < polyline.length - 1; i += 1) {
        const a = polyline[i];
        const b = polyline[i + 1];
        const segment = { x: b.x - a.x, y: b.y - a.y };
        const denom = cross2(segment, lineDir);
        if (Math.abs(denom) < 1e-12) {
          pathDistance += Math.hypot(segment.x, segment.y);
          continue;
        }
        const diff = { x: bisectorOrigin.x - a.x, y: bisectorOrigin.y - a.y };
        const u = cross2(diff, lineDir) / denom;
        const v = cross2(diff, segment) / denom;
        if (u < -1e-9 || u > 1 + 1e-9 || v < -1e-9) {
          pathDistance += Math.hypot(segment.x, segment.y);
          continue;
        }
        const clampedU = clamp(u, 0, 1);
        const intersection = {
          x: a.x + segment.x * clampedU,
          y: a.y + segment.y * clampedU
        };
        const tangent = normalizePointDirection(segment);
        const candidate = {
          point: intersection,
          tangent,
          segmentIndex: i,
          segmentT: clampedU,
          pathDistance: pathDistance + Math.hypot(segment.x, segment.y) * clampedU,
          lineT: v
        };
        if (!best || candidate.pathDistance < best.pathDistance) {
          best = candidate;
        }
        pathDistance += Math.hypot(segment.x, segment.y);
      }

      return best;
    }

    function resolveFinalVehiclePose(vehicleVector, geometry, terminalPose) {
      if (!terminalPose) return null;
      return {
        x: Number(terminalPose.x) || 0,
        y: Number(terminalPose.y) || 0,
        angle: Number(terminalPose.angle) || 0,
        theta: Number(terminalPose.theta) || 0,
        radius: Number(geometry?.radius) || 0,
        curveLength: getCurveLengthFromGeometry(geometry)
      };
    }

    function solveVehicleHeadingChangeForBisectorAlignment(candidateSl, vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      const bisectorGeometry = getCurrentTurnBisectorGeometry(vehicleVector, geometry);
      if (!bisectorGeometry.valid) {
        return {
          success: false,
          headingChange: NaN,
          curveLength: NaN,
          error: NaN,
          reason: "invalid-geometry",
          geometry: bisectorGeometry,
          evaluation: null,
          bracket: null,
          iterations: 0
        };
      }
      const startHeadingChange = Math.max(0, getHeadingChange(geometry));
      const maxSpan = Number.isFinite(Number(geometry?.maxHeadingChange)) ? Math.abs(Number(geometry.maxHeadingChange)) : 100;
      const initialSpan = Math.max(0.5, startHeadingChange * 0.5 + 0.5);
      const fn = (headingChange) => evaluateVehicleBisectorAlignmentError(
        candidateSl,
        vehicleVector,
        { ...geometry, headingChange }
      ).rearDistance;

      const bracket = findPositiveSignChangeBracket(fn, startHeadingChange, initialSpan, maxSpan);
      if (bracket) {
        const solved = solveBracketedRoot(fn, bracket.a, bracket.b, bracket.fa, bracket.fb, {
          tolerance: 1e-7,
          maxIterations: 64
        });
        const headingChange = Math.max(0, Number.isFinite(Number(solved.root)) ? Number(solved.root) : startHeadingChange);
        const evaluation = evaluateVehicleBisectorAlignmentError(candidateSl, vehicleVector, { ...geometry, headingChange });
        return {
          success: solved.success && Number.isFinite(evaluation.rearDistance) && Math.abs(evaluation.rearDistance) <= 1e-7,
          headingChange,
          curveLength: getCurveLengthFromGeometry({ ...geometry, headingChange }),
          error: evaluation.rearDistance,
          reason: solved.success ? "converged" : solved.reason,
          geometry: evaluation.geometry,
          evaluation,
          bracket: solved.bracket,
          iterations: solved.iterations,
          value: evaluation.rearDistance
        };
      }

      const fallback = searchPositiveMinimum(
        (headingChange) => {
          const evaluation = evaluateVehicleBisectorAlignmentError(candidateSl, vehicleVector, { ...geometry, headingChange });
          const alignmentScore = scoreVehicleBisectorAlignment(evaluation, geometry);
          return Number.isFinite(alignmentScore.score) ? alignmentScore.score : Infinity;
        },
        startHeadingChange,
        maxSpan,
        5,
        21
      );
      const headingChange = Math.max(0, fallback.x);
      const evaluation = evaluateVehicleBisectorAlignmentError(candidateSl, vehicleVector, { ...geometry, headingChange });
      return {
        success: Number.isFinite(evaluation.rearDistance) && Math.abs(evaluation.rearDistance) <= 1e-7,
        headingChange,
        curveLength: getCurveLengthFromGeometry({ ...geometry, headingChange }),
        error: evaluation.rearDistance,
        reason: "minimum-search",
        geometry: evaluation.geometry,
        evaluation,
        bracket: null,
        iterations: fallback.evaluations,
        value: evaluation.rearDistance
      };
    }

    function evaluateVehicleBisectorAlignmentError(candidateSl, vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      const bisectorGeometry = getCurrentTurnBisectorGeometry(vehicleVector, geometry);
      if (!bisectorGeometry.valid) {
        return {
          sl: candidateSl,
          error: NaN,
          geometry: bisectorGeometry,
          intersection: null,
          endPose: null,
          rearDistance: NaN,
          bodyAlignment: NaN
        };
      }
      const curveLength = Math.max(0, getCurveLengthFromGeometry(geometry));
      const radius = Number(geometry?.radius) || 0;
      const endPose = sampleVehiclePoseForSlew(vehicleVector, curveLength, Number(candidateSl) || 0, curveLength, radius);
      const rearDistance = cross2(
        { x: (Number(endPose.x) || 0) - bisectorGeometry.bisectorOrigin.x, y: (Number(endPose.y) || 0) - bisectorGeometry.bisectorOrigin.y },
        bisectorGeometry.bisectorDir
      );
      const bodyDirection = normalizePointDirection({
        x: Math.cos(Number(endPose.angle) || 0),
        y: Math.sin(Number(endPose.angle) || 0)
      });
      const bodyAlignment = bodyDirection ? dot2(bodyDirection, bisectorGeometry.bisectorDir) : NaN;
      const error = rearDistance;
      return {
        sl: candidateSl,
        error,
        geometry: bisectorGeometry,
        pathCopies: [],
        intersection: null,
        endPose,
        rearDistance,
        bodyAlignment
      };
    }

    function evaluateVehicleCombinedAlignment(candidateSl, vehicleVector = getVehicleVector(), geometry = state.vehicle) {
      const inner = solveVehicleHeadingChangeForBisectorAlignment(candidateSl, vehicleVector, geometry);
      const evaluation = inner.evaluation || evaluateVehicleBisectorAlignmentError(candidateSl, vehicleVector, { ...geometry, headingChange: inner.headingChange });
      if (!evaluation.geometry?.valid || !Number.isFinite(evaluation.endPose?.x) || !Number.isFinite(evaluation.endPose?.y)) {
        return {
          ...evaluation,
          inner,
          bodyAngleError: NaN,
          score: NaN
        };
      }
      const alignmentScore = scoreVehicleBisectorAlignment(evaluation, geometry);
      const bodyAngleError = alignmentScore.perpendicularError;
      const score = alignmentScore.score;
      return {
        ...evaluation,
        inner,
        headingChange: inner.headingChange,
        curveLength: inner.curveLength,
        bodyAngleError,
        lineDistanceError: alignmentScore.lineError,
        normalizedLineDistanceError: alignmentScore.normalizedLineError,
        score
      };
    }

    function buildBracketedSamples(fn, center, span, sampleCount) {
      const samples = [];
      const count = Math.max(2, sampleCount);
      for (let i = 0; i < count; i += 1) {
        const t = count === 1 ? 0 : i / (count - 1);
        const x = center - span + (2 * span) * t;
        const y = fn(x);
        samples.push({ x, y });
      }
      return samples;
    }

    function findPositiveSignChangeBracket(fn, center, initialSpan = 0.5, maxSpan = 128) {
      let span = Math.max(1e-3, Math.abs(initialSpan) || 0.5);
      const start = Math.max(0, Number(center) || 0);
      for (let attempt = 0; attempt < 12 && span <= maxSpan; attempt += 1) {
        const left = Math.max(0, start - span);
        const right = Math.max(left + 1e-6, start + span);
        const samples = buildBracketedSamples(fn, (left + right) / 2, (right - left) / 2, 11);
        for (let i = 0; i < samples.length - 1; i += 1) {
          const leftSample = samples[i];
          const rightSample = samples[i + 1];
          if (!Number.isFinite(leftSample.y) || !Number.isFinite(rightSample.y)) continue;
          if (leftSample.y === 0) {
            return { a: leftSample.x, b: leftSample.x, fa: leftSample.y, fb: leftSample.y, samples };
          }
          if (rightSample.y === 0) {
            return { a: rightSample.x, b: rightSample.x, fa: rightSample.y, fb: rightSample.y, samples };
          }
          if (leftSample.y * rightSample.y < 0) {
            return { a: leftSample.x, b: rightSample.x, fa: leftSample.y, fb: rightSample.y, samples };
          }
        }
        span *= 2;
      }
      return null;
    }

    function searchPositiveMinimum(fn, center, maxSpan = 128, passes = 5, sampleCount = 21) {
      const clampSl = (value) => clamp(Number(value) || 0, 0, maxSpan);
      const seed = clampSl(center);
      let span = Math.max(0.25, Math.abs(seed) * 0.5);
      let left = clampSl(seed - span);
      let right = clampSl(seed + span);
      let best = { x: seed, y: Infinity };
      let evaluations = 0;

      const evaluate = (x) => {
        const value = fn(x);
        evaluations += 1;
        if (Number.isFinite(value) && value < best.y) {
          best = { x, y: value };
        }
        return value;
      };

      evaluate(best.x);

      for (let pass = 0; pass < passes; pass += 1) {
        const count = Math.max(5, sampleCount - pass * 2);
        const width = Math.max(1e-6, right - left);
        let localBestX = best.x;
        let localBestY = best.y;
        let localBestIndex = 0;
        evaluate(left);

        for (let i = 1; i < count; i += 1) {
          const t = i / (count - 1);
          const x = left + width * t;
          const y = evaluate(x);
          if (Number.isFinite(y) && y < localBestY) {
            localBestX = x;
            localBestY = y;
            localBestIndex = i;
          }
        }

        const step = width / (count - 1);
        span = Math.max(step * 2, Math.min(maxSpan, Math.max(0.25, width * 0.5)));
        left = clampSl(localBestX - span);
        right = clampSl(localBestX + span);
        if (Math.abs(right - left) <= 1e-6) {
          break;
        }
        if (localBestIndex === 0) {
          right = Math.min(maxSpan, left + Math.max(step * 2, 1e-3));
        } else if (localBestIndex === count - 1) {
          left = Math.max(0, right - Math.max(step * 2, 1e-3));
        }
      }

      const finalEvaluation = fn(best.x);
      evaluations += 1;
      return {
        x: best.x,
        y: finalEvaluation,
        evaluations
      };
    }

    function findSignChangeBracket(fn, center, initialSpan = 0.5, maxSpan = 128) {
      let span = Math.max(1e-3, Math.abs(initialSpan) || 0.5);
      for (let attempt = 0; attempt < 12 && span <= maxSpan; attempt += 1) {
        const samples = buildBracketedSamples(fn, center, span, 11);
        for (let i = 0; i < samples.length - 1; i += 1) {
          const left = samples[i];
          const right = samples[i + 1];
          if (!Number.isFinite(left.y) || !Number.isFinite(right.y)) continue;
          if (left.y === 0) {
            return { a: left.x, b: left.x, fa: left.y, fb: left.y, samples };
          }
          if (right.y === 0) {
            return { a: right.x, b: right.x, fa: right.y, fb: right.y, samples };
          }
          if (left.y * right.y < 0) {
            return { a: left.x, b: right.x, fa: left.y, fb: right.y, samples };
          }
        }
        span *= 2;
      }
      return null;
    }

    function solveBracketedRoot(fn, a, b, fa = fn(a), fb = fn(b), options = {}) {
      const tolerance = options.tolerance ?? 1e-7;
      const maxIterations = options.maxIterations ?? 64;
      let left = a;
      let right = b;
      let fLeft = fa;
      let fRight = fb;
      if (!Number.isFinite(fLeft) || !Number.isFinite(fRight) || fLeft * fRight > 0) {
        return {
          success: false,
          reason: "invalid-bracket",
          root: NaN,
          iterations: 0,
          bracket: { left, right, fLeft, fRight }
        };
      }
      if (Math.abs(fLeft) <= tolerance) {
        return {
          success: true,
          reason: "endpoint-root",
          root: left,
          iterations: 0,
          bracket: { left, right, fLeft, fRight }
        };
      }
      if (Math.abs(fRight) <= tolerance) {
        return {
          success: true,
          reason: "endpoint-root",
          root: right,
          iterations: 0,
          bracket: { left, right, fLeft, fRight }
        };
      }

      let candidate = left;
      let fCandidate = fLeft;

      for (let iteration = 1; iteration <= maxIterations; iteration += 1) {
        candidate = Number.isFinite(fLeft) && Number.isFinite(fRight) && fRight !== fLeft
          ? right - (fRight * (right - left)) / (fRight - fLeft)
          : (left + right) / 2;
        if (!Number.isFinite(candidate) || candidate <= Math.min(left, right) || candidate >= Math.max(left, right)) {
          candidate = (left + right) / 2;
        }
        fCandidate = fn(candidate);
        if (!Number.isFinite(fCandidate)) {
          candidate = (left + right) / 2;
          fCandidate = fn(candidate);
        }
        if (!Number.isFinite(fCandidate)) {
          return {
            success: false,
            reason: "non-finite-evaluation",
            root: NaN,
            iterations: iteration,
            bracket: { left, right, fLeft, fRight }
          };
        }
        if (Math.abs(fCandidate) <= tolerance || Math.abs(right - left) <= tolerance) {
          return {
            success: true,
            reason: "converged",
            root: candidate,
            iterations: iteration,
            bracket: { left, right, fLeft, fRight },
            value: fCandidate
          };
        }
        if (fLeft * fCandidate <= 0) {
          right = candidate;
          fRight = fCandidate;
        } else {
          left = candidate;
          fLeft = fCandidate;
        }
      }

      return {
        success: false,
        reason: "max-iterations",
        root: candidate,
        iterations: maxIterations,
        bracket: { left, right, fLeft, fRight },
        value: fCandidate
      };
    }

    function solveVehicleSlForBisectorAlignment(vehicleVector, options = {}) {
      if (!vehicleVector) {
        return {
          success: false,
          sl: NaN,
          error: NaN,
          reason: "missing-vehicle-vector",
          initialSl: Number.isFinite(Number(options.initialSl)) ? Number(options.initialSl) : Math.PI / 4,
          initialSpan: Number.isFinite(Number(options.initialSpan)) ? Math.abs(Number(options.initialSpan)) : 0.5,
          maxSpan: Number.isFinite(Number(options.maxSpan)) ? Math.abs(Number(options.maxSpan)) : 128,
          geometry: options.geometry || { radius: 4, headingChange: 0 },
          evaluation: null,
          bracket: null,
          iterations: 0
        };
      }
      const geometry = options.geometry || { radius: 4, headingChange: 0 };
      const startSl = Math.max(0, Number.isFinite(Number(options.initialSl))
        ? Number(options.initialSl)
        : Math.PI / 4);
      const maxSpan = Number.isFinite(Number(options.maxSpan)) ? Math.abs(Number(options.maxSpan)) : 128;
      const fn = (sl) => evaluateVehicleCombinedAlignment(sl, vehicleVector, geometry).score;
      const outerPasses = Number.isFinite(Number(options.passes)) ? Math.max(1, Number(options.passes)) : 5;
      const outerSamples = Number.isFinite(Number(options.sampleCount)) ? Math.max(5, Number(options.sampleCount)) : 21;
      const solved = searchPositiveMinimum(fn, startSl, maxSpan, outerPasses, outerSamples);
      const evaluation = evaluateVehicleCombinedAlignment(solved.x, vehicleVector, geometry);
      const tolerance = Number.isFinite(Number(options.tolerance)) ? Math.abs(Number(options.tolerance)) : 1e-7;
      const bodyTolerance = Number.isFinite(Number(options.bodyTolerance)) ? Math.abs(Number(options.bodyTolerance)) : 1e-6;
      const rearAligned = Number.isFinite(evaluation.rearDistance) && Math.abs(evaluation.rearDistance) <= tolerance;
      const bodyAligned = Number.isFinite(evaluation.bodyAlignment) && Math.abs(evaluation.bodyAlignment) <= bodyTolerance;
      return {
        success: Boolean(rearAligned && bodyAligned),
        sl: Math.max(0, solved.x),
        headingChange: Math.max(0, Number(evaluation.headingChange) || 0),
        curveLength: Math.max(0, Number(evaluation.curveLength) || 0),
        error: evaluation.score,
        reason: rearAligned && bodyAligned ? "converged" : "alignment-mismatch",
        initialSl: startSl,
        maxSpan,
        geometry: evaluation.geometry,
        intersection: evaluation.intersection,
        evaluation,
        inner: evaluation.inner || null,
        iterations: solved.evaluations,
        value: evaluation.score,
        rearDistance: evaluation.rearDistance,
        bodyAlignment: evaluation.bodyAlignment,
        bodyAngleError: evaluation.bodyAngleError
      };
    }

    function getThetaValue() {
      return Number(state.vehicleCopies[0]?.theta) || 0;
    }

    function getRccPoint(vehicleVector = getVehicleVector()) {
      if (!vehicleVector) return null;
      const theta = getThetaValue();
      if (theta === 0) return null;
      const rear = { x: vehicleVector.x, y: vehicleVector.y };
      const front = {
        x: rear.x + Math.cos(vehicleVector.angle) * vehicleVector.length,
        y: rear.y + Math.sin(vehicleVector.angle) * vehicleVector.length
      };
      const rearNormal = { x: -Math.sin(vehicleVector.angle), y: Math.cos(vehicleVector.angle) };
      const steerNormal = { x: -Math.sin(vehicleVector.angle + theta), y: Math.cos(vehicleVector.angle + theta) };
      return intersectLines(rear, rearNormal, front, steerNormal);
    }

    function saveState() {
      enforceAnchors();
      enforceVectorAnchor();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableState()));
    }

    function getActiveVehicle() {
      return enforceAnchors();
    }

    function getVehicleVector() {
      const activeVehicle = getActiveVehicle();
      const rp = activeVehicle?.Rp || null;
      if (!rp) {
        return createCoord(0, 0, 0, 1, "Rp", "#7dd3fc");
      }
      const x = Number(rp.X) || 0;
      const y = Number(rp.Y) || 0;
      const psi = Number(rp.Psi) || 0;
      if (x === 0 && y === 0 && psi === 0) {
        return createCoord(0, 0, 0, 1, "Rp", "#7dd3fc");
      }
      return rp;
    }

    function getVehicleGeometry() {
      const activeVehicle = getActiveVehicle();
      return {
        Rp: activeVehicle?.Rp || null,
        Sp: activeVehicle?.Sp || null,
        sl: Number(activeVehicle?.sl) || 0,
        finalPose: activeVehicle?.finalPose || null,
        headingChange: Number(activeVehicle?.Sp?.Psi) || 0,
        radius: Number(state.radius) || 0
      };
    }

    function getVehicleEnd(vehicleVector = getVehicleVector()) {
      if (!vehicleVector) return { x: 1, y: 0 };
      return {
        x: vehicleVector.x + Math.cos(vehicleVector.angle) * vehicleVector.length,
        y: vehicleVector.y + Math.sin(vehicleVector.angle) * vehicleVector.length
      };
    }

    function getVehicleSv(vehicle = state.Vehicles[0] || null) {
      const rp = vehicle?.Rp || null;
      const sp = vehicle?.Sp || null;
      if (!rp || !sp) return null;
      const rpLength = Number.isFinite(Number(rp.length)) ? Number(rp.length) : 1;
      const rpHeading = Number(rp.Psi) || 0;
      return createCoord(
        (Number(rp.X) || 0) + Math.cos(rpHeading) * rpLength,
        (Number(rp.Y) || 0) + Math.sin(rpHeading) * rpLength,
        rpHeading + (Number(sp.Psi) || 0),
        Number.isFinite(Number(sp.length)) ? Number(sp.length) : 0.25,
        "Sv",
        "#fbbf24"
      );
    }

    function vehicleToPose(vehicle) {
      const rp = vehicle?.Rp || null;
      const sp = vehicle?.Sp || null;
      if (!rp || !sp) return null;
      return {
        x: Number(rp.X) || 0,
        y: Number(rp.Y) || 0,
        angle: Number(rp.Psi) || 0,
        theta: Number(sp.Psi) || 0,
        radius: Number(state.radius) || 0,
        curveLength: Number(vehicle?.finalPose?.curveLength) || 0
      };
    }

    function buildVehicleSweepFromTerminalSl(solution, count = 9) {
      const activeVehicle = getActiveVehicle();
      const anchor = createAnchorVehicle(getSolverInitialSl(activeVehicle?.sl));
      const terminalSl = Number(solution?.sl ?? activeVehicle?.sl) || 0;
      const vehicleVector = getVehicleVector();
      const geometry = getVehicleGeometry();
      const shadows = [];
      const poseCopies = [];
      for (let n = 1; n <= count; n += 1) {
        const fraction = n / (count + 1);
        const candidateSl = terminalSl * fraction;
        const stampedPath = evaluateVehicleStampedPathForSl(candidateSl, vehicleVector, {
          ...geometry,
          headingChange: candidateSl
        });
        const pose = Array.isArray(stampedPath) && stampedPath.length
          ? stampedPath[stampedPath.length - 1]
          : null;
        if (!pose) continue;
        const shadow = createVehicle({
          Rp: createCoord(pose.x, pose.y, pose.angle, 1, `Rp ${n}`, "#7dd3fc"),
          Sp: createCoord(0, 0, pose.theta, 0.25, "Sp", "#fbbf24"),
          sl: candidateSl,
          finalPose: {
            x: Number(pose.x) || 0,
            y: Number(pose.y) || 0,
            angle: Number(pose.angle) || 0,
            theta: Number(pose.theta) || 0,
            radius: Number(pose.radius) || 0,
            curveLength: Number(pose.curveLength) || 0
          }
        });
        shadows.push(shadow);
        poseCopies.push(vehicleToPose(shadow));
      }
      state.Vehicles = [anchor, ...shadows];
      return [vehicleToPose(anchor), ...poseCopies].filter(Boolean);
    }

    function syncVehicleShadows(solution = state.simpleArcSolution || solveSimpleArc()) {
      state.vehicleCopies = buildVehicleSweepFromTerminalSl(solution, 9);
      dependentListDirty = true;
    }

    function enforceAnchors() {
      let activeVehicle = state.Vehicles[0] || null;
      if (!activeVehicle) {
        activeVehicle = createAnchorVehicle();
        state.Vehicles[0] = activeVehicle;
      }
      if (!activeVehicle.Rp) {
        activeVehicle.Rp = createCoord(0, 0, 0, 1, "Rp", "#7dd3fc");
      }
      activeVehicle.Rp.X = 0;
      activeVehicle.Rp.Y = 0;
      activeVehicle.Rp.Psi = 0;
      activeVehicle.Rp.length = 1;
      activeVehicle.Rp.label = "Rp";
      activeVehicle.Rp.color = "#7dd3fc";
      if (!activeVehicle.Sp) {
        activeVehicle.Sp = createCoord(0, 0, 0, 0.25, "Sp", "#fbbf24");
      }
      activeVehicle.Sp.X = 0;
      activeVehicle.Sp.Y = 0;
      activeVehicle.Sp.Psi = 0;
      activeVehicle.Sp.length = 0.25;
      activeVehicle.Sp.label = "Sp";
      activeVehicle.Sp.color = "#fbbf24";
      return activeVehicle;
    }

    function enforceVectorAnchor() {
      const activeVehicle = getActiveVehicle();
      if (!activeVehicle?.Rp) return null;
      state.vectors[0] = activeVehicle.Rp;
      if (!state.vectors[0].id) {
        state.vectors[0].id = randomId();
      }
      state.vectors[0].label = "";
      state.vectors[0].color = state.vectors[0].color || COLORS[0];
      state.vectors[0].length = Number.isFinite(Number(state.vectors[0].length))
        ? Number(state.vectors[0].length)
        : 1.2;
      return state.vectors[0];
    }

    function serializableState() {
      return {
        view: state.view,
        radius: state.radius,
        ui: state.ui,
        Vehicles: state.Vehicles,
        vehicleCopies: [],
        selectedId: state.selectedId,
        vectors: state.vectors
      };
    }

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const parent = canvas.parentElement;
      const rect = parent ? parent.getBoundingClientRect() : canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) {
        return false;
      }
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return true;
    }

    function scheduleRender() {
      needsRender = true;
      if (animationFrame) return;
      animationFrame = requestAnimationFrame(() => {
        animationFrame = 0;
        if (!needsRender) return;
        needsRender = false;
        try {
          draw();
          const rect = canvas.getBoundingClientRect();
          renderStatus.textContent = `Render: ok ${Math.round(rect.width)}x${Math.round(rect.height)}`;
        } catch (error) {
          console.error(error);
          renderStatus.textContent = `Render error: ${error?.message || error}`;
        }
      });
    }

    function worldToScreen(x, y) {
      const rect = canvas.getBoundingClientRect();
      const scale = state.view.scale;
      const cx = rect.width / 2 + state.view.offsetX;
      const cy = rect.height / 2 + state.view.offsetY;
      return {
        x: cx + x * scale,
        y: cy - y * scale
      };
    }

    function screenToWorld(x, y) {
      const rect = canvas.getBoundingClientRect();
      const scale = state.view.scale;
      const cx = rect.width / 2 + state.view.offsetX;
      const cy = rect.height / 2 + state.view.offsetY;
      return {
        x: (x - cx) / scale,
        y: -(y - cy) / scale
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function intersectLines(p1, d1, p2, d2) {
      const det = d1.x * d2.y - d1.y * d2.x;
      if (Math.abs(det) < 1e-9) return null;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const t = (dx * d2.y - dy * d2.x) / det;
      return {
        x: p1.x + d1.x * t,
        y: p1.y + d1.y * t
      };
    }

    function chooseGridStep(scale) {
      const targetPixels = 80;
      const raw = targetPixels / scale;
      const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10];
      return steps.find(step => step >= raw) ?? 10;
    }

    function drawGrid() {
      if (!state.ui.guides) return;
      const rect = canvas.getBoundingClientRect();
      const step = chooseGridStep(state.view.scale);
      const start = screenToWorld(0, rect.height);
      const end = screenToWorld(rect.width, 0);
      ctx.lineWidth = 1;

      const xMin = Math.floor(start.x / step) * step;
      const xMax = Math.ceil(end.x / step) * step;
      const yMin = Math.floor(start.y / step) * step;
      const yMax = Math.ceil(end.y / step) * step;
      const labelEvery = 5;

      for (let x = xMin, ix = 0; x <= xMax + 1e-9; x += step, ix += 1) {
        const p = worldToScreen(x, 0);
        ctx.strokeStyle = Math.abs(x) < 1e-9 ? "rgba(237,243,255,0.34)" : "rgba(157,173,212,0.14)";
        ctx.beginPath();
        ctx.moveTo(p.x, 0);
        ctx.lineTo(p.x, rect.height);
        ctx.stroke();
        if (Math.abs(x) < 1e-9 || ix % labelEvery !== 0) continue;
        ctx.fillStyle = "rgba(149,162,201,0.85)";
        ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(formatTick(x), p.x + 4, rect.height / 2 + state.view.offsetY + 4);
      }
      for (let y = yMin, iy = 0; y <= yMax + 1e-9; y += step, iy += 1) {
        const p = worldToScreen(0, y);
        ctx.strokeStyle = Math.abs(y) < 1e-9 ? "rgba(237,243,255,0.34)" : "rgba(157,173,212,0.14)";
        ctx.beginPath();
        ctx.moveTo(0, p.y);
        ctx.lineTo(rect.width, p.y);
        ctx.stroke();
        if (Math.abs(y) < 1e-9 || iy % labelEvery !== 0) continue;
        ctx.fillStyle = "rgba(149,162,201,0.85)";
        ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(formatTick(y), rect.width / 2 + state.view.offsetX + 4, p.y + 4);
      }
    }

    function formatTick(value) {
      return value.toFixed(2);
    }

    function drawAxes() {
      const rect = canvas.getBoundingClientRect();
      const ox = worldToScreen(0, 0).x;
      const oy = worldToScreen(0, 0).y;
      ctx.strokeStyle = "rgba(237,243,255,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ox, 0);
      ctx.lineTo(ox, rect.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, oy);
      ctx.lineTo(rect.width, oy);
      ctx.stroke();
      ctx.fillStyle = "rgba(237,243,255,0.85)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("y", ox + 8, 12);
      ctx.fillText("x", rect.width - 14, oy - 18);
    }

    function drawArrow(a, b, stroke, fill, width = 3) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const angle = Math.atan2(dy, dx);
      const head = Math.max(8, 16 / (window.devicePixelRatio || 1));

      ctx.strokeStyle = stroke;
      ctx.fillStyle = fill;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - Math.cos(angle - Math.PI / 8) * head, b.y - Math.sin(angle - Math.PI / 8) * head);
      ctx.lineTo(b.x - Math.cos(angle + Math.PI / 8) * head, b.y - Math.sin(angle + Math.PI / 8) * head);
      ctx.closePath();
      ctx.fill();
    }

    function drawVehiclePerpendicularLine(origin, bodyAngle, alpha = 1, width = 2) {
      const rect = canvas.getBoundingClientRect();
      const length = (Math.hypot(rect.width, rect.height) / Math.max(1, state.view.scale)) + 1;
      const end = {
        x: origin.x - Math.sin(bodyAngle) * length,
        y: origin.y + Math.cos(bodyAngle) * length
      };
      const originS = worldToScreen(origin.x, origin.y);
      const endS = worldToScreen(end.x, end.y);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = `rgba(125,211,252,${Math.min(1, 0.25 * alpha)})`;
      ctx.lineWidth = Math.max(1.5, width);
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(endS.x, endS.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawSteerPerpendicularLine(origin, steerAngle, alpha = 1, width = 2) {
      const rect = canvas.getBoundingClientRect();
      const length = (Math.hypot(rect.width, rect.height) / Math.max(1, state.view.scale)) + 1;
      const end = {
        x: origin.x - Math.sin(steerAngle) * length,
        y: origin.y + Math.cos(steerAngle) * length
      };
      const originS = worldToScreen(origin.x, origin.y);
      const endS = worldToScreen(end.x, end.y);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = `rgba(251,191,36,${Math.min(1, 0.25 * alpha)})`;
      ctx.lineWidth = Math.max(1.5, width);
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(endS.x, endS.y);
      ctx.stroke();
      ctx.restore();
    }

    function getVehiclePerpendicularIntersection(rear, bodyAngle, front, steerAngle) {
      const blueOrigin = rear;
      const blueDirection = {
        x: -Math.sin(bodyAngle),
        y: Math.cos(bodyAngle)
      };
      const yellowOrigin = front;
      const yellowDirection = {
        x: -Math.sin(steerAngle),
        y: Math.cos(steerAngle)
      };
      return intersectLines(blueOrigin, blueDirection, yellowOrigin, yellowDirection);
    }

    function drawVehicleIntersectionPoint(point, alpha = 1) {
      if (!point) return;
      const p = worldToScreen(point.x, point.y);
      ctx.save();
      ctx.fillStyle = `rgba(125,211,252,${Math.min(1, 0.75 * alpha)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function getSimpleArcDeltaPsi(arc = state.arc) {
      const deltaPsi = Number(arc?.deltaPsi);
      if (Number.isFinite(deltaPsi)) {
        return deltaPsi;
      }
      const angle = Number(arc?.angle);
      return Number.isFinite(angle) ? angle : Math.PI / 2;
    }

    function getSimpleArcLength(arc = state.arc) {
      const radius = Math.abs(Number(arc?.radius) || 0);
      return radius * getSimpleArcDeltaPsi(arc);
    }

    function getSimpleArcGeometry() {
      const radius = Number(state.arc?.radius) || 1;
      const deltaPsi = getSimpleArcDeltaPsi();
      const arcLength = getSimpleArcLength();
      const center = { x: 0, y: radius };
      const startAngle = radius >= 0 ? -Math.PI / 2 : Math.PI / 2;
      const turnAngle = Number.isFinite(radius) && Math.abs(radius) > 1e-9
        ? arcLength / radius
        : 0;
      return {
        radius,
        deltaPsi,
        arcLength,
        turnAngle,
        center,
        startAngle,
        endAngle: startAngle + turnAngle,
        valid: Number.isFinite(radius) && Number.isFinite(deltaPsi) && Math.abs(radius) > 1e-9 && deltaPsi !== 0
      };
    }

    function thetaProfile(value) {
      const t = clamp(Number(value) || 0, 0, 1);
      return t;
    }

    function getSimpleArcBisectorGeometry(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) {
        return {
          valid: false,
          center: null,
          bisectorPoint: null,
          bisectorAngle: 0,
          bisectorDir: null,
          bisectorNormal: null
        };
      }
      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const bisectorDir = {
        x: Math.cos(bisectorAngle),
        y: Math.sin(bisectorAngle)
      };
      const bisectorNormal = {
        x: -bisectorDir.y,
        y: bisectorDir.x
      };
      const radius = Math.abs(Number(arc.radius) || 0);
      const bisectorPoint = {
        x: arc.center.x + bisectorDir.x * radius,
        y: arc.center.y + bisectorDir.y * radius
      };
      return {
        valid: true,
        center: { ...arc.center },
        bisectorPoint,
        bisectorAngle,
        bisectorDir,
        bisectorNormal,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        turnAngle: Number(arc.turnAngle) || 0
      };
    }

    function wrapAngle(angle) {
      let wrapped = Number(angle) || 0;
      while (wrapped > Math.PI) wrapped -= Math.PI * 2;
      while (wrapped < -Math.PI) wrapped += Math.PI * 2;
      return wrapped;
    }

    function signedDistanceToLine(point, origin, direction) {
      if (!point || !origin || !direction) return NaN;
      return (Number(point.x) - Number(origin.x)) * Number(direction.y)
        - (Number(point.y) - Number(origin.y)) * Number(direction.x);
    }

    function angleDistanceToPerpendicular(angle, lineAngle) {
      const targetAngles = [lineAngle + Math.PI / 2, lineAngle - Math.PI / 2];
      let best = Infinity;
      for (const target of targetAngles) {
        const error = Math.abs(wrapAngle(Number(angle) - target));
        if (error < best) best = error;
      }
      return best;
    }

    function integrateLinearSteerPath(finalSteer, pathLength, sampleCount = Math.max(48, Math.ceil(Math.abs(Number(pathLength) || 0) * 96))) {
      const count = Math.max(8, sampleCount);
      const ds = (Number(pathLength) || 0) / count;
      const points = [];
      let x = 0;
      let y = 0;
      let psi = 0;
      points.push({
        x,
        y,
        heading: psi,
        theta: 0
      });
      for (let i = 0; i <= count; i += 1) {
        if (i === count) break;
        const u = (i + 0.5) / count;
        const theta = (Number(finalSteer) || 0) * thetaProfile(u);
        psi += Math.tan(theta) * ds;
        x += Math.cos(psi) * ds;
        y += Math.sin(psi) * ds;
        points.push({
          x,
          y,
          heading: psi,
          theta
        });
      }
      return {
        points,
        terminalPose: {
          x,
          y,
          angle: psi,
          theta: Number(finalSteer) || 0
        }
      };
    }

    function solveSimpleArc(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) {
        return {
          success: false,
          radius: Number(arc?.radius) || 0,
          arcLength: Number(arc?.arcLength) || 0,
          s: Number(arc?.arcLength) || 0,
          sl: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
          turnAngle: Number(arc?.turnAngle) || 0,
          finalHeading: 0,
          positionError: NaN,
          headingError: NaN,
          terminalPose: null,
          terminalCoord: null,
          pathPoints: [],
          passes: []
        };
      }
      const bisector = getSimpleArcBisectorGeometry(arc);
      const turnDirection = Number(arc.radius) >= 0 ? 1 : -1;
      const initialSteer = turnDirection * (Math.PI / 4);
      const initialPathLength = Math.max(
        Math.abs(Number(arc.arcLength) || 0) * 1.25,
        Math.abs(Number(arc.radius) || 0) * 1.5,
        0.5
      );
      const maxPathLength = Math.max(
        Math.abs(Number(arc.arcLength) || 0) * 8,
        Math.abs(Number(arc.radius) || 0) * 12,
        8
      );
      const maxSteer = Math.PI / 2 - 0.01;
      const steerMin = turnDirection >= 0 ? 0 : -maxSteer;
      const steerMax = turnDirection >= 0 ? maxSteer : 0;
      const positionTolerance = 1e-5;
      const headingTolerance = 1e-5;
      const scoreCandidate = (finalSteer, pathLength) => {
        const result = integrateLinearSteerPath(finalSteer, pathLength);
        const terminalPose = result.terminalPose || {};
        const positionError = Math.abs(signedDistanceToLine(terminalPose, bisector.center, bisector.bisectorDir));
        const headingError = angleDistanceToPerpendicular(Number(terminalPose.angle) || 0, bisector.bisectorAngle);
        const distanceScale = Math.max(
          1,
          Math.abs(Number(bisector.center?.x) || 0),
          Math.abs(Number(bisector.center?.y) || 0),
          Math.abs(Number(bisector.bisectorPoint?.x) || 0),
          Math.abs(Number(bisector.bisectorPoint?.y) || 0),
          Math.abs(Number(arc.radius) || 0),
          Math.abs(Number(arc.arcLength) || 0)
        );
        return {
          score: (positionError / distanceScale) ** 2 + headingError ** 2,
          result,
          positionError,
          headingError
        };
      };

      const trace = [];
      let best = null;
      let steerCenter = clamp(initialSteer, steerMin, steerMax);
      let pathCenter = clamp(initialPathLength, 0.05, maxPathLength);
      let steerSpan = Math.max(Math.PI / 6, Math.abs(initialSteer) * 0.75 + Math.PI / 12);
      let pathSpan = Math.max(Math.abs(initialPathLength) * 0.75, Math.abs(Number(arc.arcLength) || 0), 0.75);

      const runStage = (stage) => {
        const passCount = Math.max(1, Number(stage?.passes) || 1);
        const steerSamples = Math.max(5, Number(stage?.steerSamples) || 9);
        const pathSamples = Math.max(5, Number(stage?.pathSamples) || 9);
        const shrink = Number.isFinite(Number(stage?.shrink)) ? Math.max(0.05, Math.min(0.5, Number(stage.shrink))) : 0.25;
        const steerFloor = Math.max(1e-6, Number(stage?.steerFloor) || 0);
        const pathFloor = Math.max(1e-6, Number(stage?.pathFloor) || 0);

        for (let pass = 0; pass < passCount; pass += 1) {
          const steerLeft = clamp(steerCenter - steerSpan, steerMin, steerMax);
          const steerRight = clamp(steerCenter + steerSpan, steerMin, steerMax);
          const pathLeft = clamp(pathCenter - pathSpan, 0.05, maxPathLength);
          const pathRight = clamp(pathCenter + pathSpan, 0.05, maxPathLength);
          let passBest = null;

          for (let i = 0; i < steerSamples; i += 1) {
            const steerT = steerSamples === 1 ? 0 : i / (steerSamples - 1);
            const finalSteer = steerLeft + (steerRight - steerLeft) * steerT;
            for (let j = 0; j < pathSamples; j += 1) {
              const pathT = pathSamples === 1 ? 0 : j / (pathSamples - 1);
              const pathLength = pathLeft + (pathRight - pathLeft) * pathT;
              const scored = scoreCandidate(finalSteer, pathLength);
              if (!best || scored.score < best.score) {
                best = {
                  finalSteer,
                  pathLength,
                  ...scored
                };
              }
              if (!passBest || scored.score < passBest.score) {
                passBest = {
                  finalSteer,
                  pathLength,
                  ...scored
                };
              }
            }
          }

          trace.push({
            pass: trace.length,
            steerCenter,
            pathCenter,
            steerSpan,
            pathSpan,
            steerLeft,
            steerRight,
            pathLeft,
            pathRight,
            best: passBest ? {
              finalSteer: passBest.finalSteer,
              pathLength: passBest.pathLength,
              positionError: passBest.positionError,
              headingError: passBest.headingError,
              score: passBest.score
            } : null
          });

          if (!best) break;
          if (best.positionError <= positionTolerance && best.headingError <= headingTolerance) {
            break;
          }

          steerCenter = best.finalSteer;
          pathCenter = best.pathLength;
          steerSpan = Math.max((steerRight - steerLeft) * shrink, steerFloor);
          pathSpan = Math.max((pathRight - pathLeft) * shrink, pathFloor);
        }
      };

      runStage({
        passes: 5,
        steerSamples: 9,
        pathSamples: 9,
        shrink: 0.25,
        steerFloor: Math.PI / 180,
        pathFloor: 1e-3
      });

      if (!best || best.positionError > positionTolerance || best.headingError > headingTolerance) {
        runStage({
          passes: 10,
          steerSamples: 21,
          pathSamples: 21,
          shrink: 0.2,
          steerFloor: 1e-7,
          pathFloor: 1e-7
        });
      }

      if (!best) {
        return {
          success: false,
          radius: Number(arc?.radius) || 0,
          arcLength: Number(arc?.arcLength) || 0,
          s: Number(arc?.arcLength) || 0,
          sl: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
          turnAngle: 0,
          finalHeading: 0,
          positionError: NaN,
          headingError: NaN,
          terminalPose: null,
          terminalCoord: null,
          pathPoints: [],
          passes: trace
        };
      }

      const pathPoints = best.result.points;
      const terminalPose = {
        x: Number(best.result.terminalPose.x) || 0,
        y: Number(best.result.terminalPose.y) || 0,
        angle: Number(best.result.terminalPose.angle) || 0,
        theta: Number(best.finalSteer) || 0,
        heading: Number(best.result.terminalPose.angle) || 0,
        radius: Number(arc.radius) || 0,
        curveLength: Number(best.pathLength) || 0
      };
      return {
        success: Number.isFinite(best.score),
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        s: Number(best.pathLength) || 0,
        sl: Number(best.pathLength) ? Number(best.finalSteer) / Number(best.pathLength) : 0,
        turnAngle: Number(best.finalSteer) || 0,
        finalHeading: Number(best.result.terminalPose.angle) || 0,
        curveLength: Number(best.pathLength) || 0,
        positionError: Number(best.positionError) || 0,
        headingError: Number(best.headingError) || 0,
        terminalPose,
        terminalCoord: createCoord(terminalPose.x, terminalPose.y, terminalPose.angle, 1, "Rp", "#7dd3fc"),
        pathPoints,
        bisector,
        passes: trace
      };
    }

    function sampleSimpleArcPoints(arc = getSimpleArcGeometry(), sampleCount = Math.max(24, Math.ceil(Math.abs(Number(arc?.turnAngle) || 0) * 48))) {
      if (!arc?.valid) return [];
      const points = [];
      const radius = Math.abs(Number(arc.radius) || 0);
      const count = Math.max(2, sampleCount);
      for (let i = 0; i <= count; i += 1) {
        const t = count === 0 ? 0 : i / count;
        const theta = arc.startAngle + arc.turnAngle * t;
        points.push({
          x: arc.center.x + Math.cos(theta) * radius,
          y: arc.center.y + Math.sin(theta) * radius
        });
      }
      return points;
    }

    function getSimpleArcBisectorPoint(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) return null;
      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const radius = Math.abs(Number(arc.radius) || 0);
      return {
        x: arc.center.x + Math.cos(bisectorAngle) * radius,
        y: arc.center.y + Math.sin(bisectorAngle) * radius
      };
    }

    function drawSimpleArc() {
      const arc = getSimpleArcGeometry();
      if (!arc.valid) return;

      const arcPoints = sampleSimpleArcPoints(arc);
      const bisectorEnd = getSimpleArcBisectorPoint(arc);

      const originS = worldToScreen(0, 0);
      const centerS = worldToScreen(arc.center.x, arc.center.y);

      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(126,240,191,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(centerS.x, centerS.y);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < arcPoints.length; i += 1) {
        const p = worldToScreen(arcPoints[i].x, arcPoints[i].y);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.beginPath();
      ctx.arc(centerS.x, centerS.y, 4.5, 0, Math.PI * 2);
      ctx.fill();

      if (bisectorEnd) {
        const bisectorEndS = worldToScreen(bisectorEnd.x, bisectorEnd.y);
