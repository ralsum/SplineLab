      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const bisectorDir = {
        x: Math.cos(bisectorAngle),
        y: Math.sin(bisectorAngle)
      };
      const bisectorNormal = {
        x: -bisectorDir.y,
        y: bisectorDir.x
      };
      const radius = Math.abs(Number(arc.radius) || 0);
      const bisectorPoint = {
        x: arc.center.x + bisectorDir.x * radius,
        y: arc.center.y + bisectorDir.y * radius
      };
      return {
        valid: true,
        center: { ...arc.center },
        bisectorPoint,
        bisectorAngle,
        bisectorDir,
        bisectorNormal,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        turnAngle: Number(arc.turnAngle) || 0
      };
    }

    function wrapAngle(angle) {
      let wrapped = Number(angle) || 0;
      while (wrapped > Math.PI) wrapped -= Math.PI * 2;
      while (wrapped < -Math.PI) wrapped += Math.PI * 2;
      return wrapped;
    }

    function normalizePositiveAngle(angle) {
      let wrapped = wrapAngle(angle);
      if (wrapped < 0) wrapped += Math.PI * 2;
      return wrapped;
    }

    function signedDistanceToLine(point, origin, direction) {
      if (!point || !origin || !direction) return NaN;
      return (Number(point.x) - Number(origin.x)) * Number(direction.y)
        - (Number(point.y) - Number(origin.y)) * Number(direction.x);
    }

    function angleDistanceToPerpendicular(angle, lineAngle) {
      const targetAngles = [lineAngle + Math.PI / 2, lineAngle - Math.PI / 2];
      let best = Infinity;
      for (const target of targetAngles) {
        const error = Math.abs(wrapAngle(Number(angle) - target));
        if (error < best) best = error;
      }
      return best;
    }

    function integrateLinearSteerPath(finalSteer, pathLength, sampleCount = Math.max(48, Math.ceil(Math.abs(Number(pathLength) || 0) * 96))) {
      const count = Math.max(2, sampleCount);
      const totalPathLength = Math.max(0, Number(pathLength) || 0);
      const slew = totalPathLength === 0 ? 0 : (Number(finalSteer) || 0) / totalPathLength;
      const points = [];
      for (let i = 0; i < count; i += 1) {
        const t = count === 1 ? 0 : i / (count - 1);
        const distance = totalPathLength * t;
        const pose = sampleVehiclePoseForSlew({ x: 0, y: 0, angle: 0 }, distance, slew, totalPathLength, 0);
        points.push({
          x: Number(pose.x) || 0,
          y: Number(pose.y) || 0,
          heading: Number(pose.angle) || 0,
          theta: Number(pose.theta) || 0
        });
      }
      const terminalPose = sampleVehiclePoseForSlew({ x: 0, y: 0, angle: 0 }, totalPathLength, slew, totalPathLength, 0);
      return {
        points,
        terminalPose: {
          x: Number(terminalPose.x) || 0,
          y: Number(terminalPose.y) || 0,
          angle: Number(terminalPose.angle) || 0,
          theta: Number(terminalPose.theta) || 0
        }
      };
    }

    function solveSimpleArcFromServer(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) return null;

      const vehicleVector = getVehicleVector() || { x: 0, y: 0, angle: 0 };

      try {
        const params = new URLSearchParams({
          radius: String(Number(arc.radius) || 0),
          deltaPsi: String(Number(arc.deltaPsi) || 0),
          steerMax: String(Number(arc.steerMax) || 0),
          initialSl: String(getSolverInitialSl(getActiveVehicle()?.sl)),
          vehicleX: String(Number(vehicleVector.x) || 0),
          vehicleY: String(Number(vehicleVector.y) || 0),
          vehicleAngle: String(Number(vehicleVector.angle) || 0)
        });
        const xhr = new XMLHttpRequest();
        xhr.open("GET", `/api/solve-simple-arc?${params.toString()}`, false);
        xhr.send(null);
        if (xhr.status < 200 || xhr.status >= 300 || !xhr.responseText) {
          return null;
        }
        const parsed = JSON.parse(xhr.responseText);
        if (!parsed || !parsed.ok) {
          return parsed || null;
        }

        const bisector = getSimpleArcBisectorGeometry(arc);
        const terminalPose = parsed.terminalPose || null;
        const vc = parsed.vc || null;
        const complexTerminalPose = parsed.complexTerminalPose || terminalPose;
        const complexVc = parsed.complexVc || vc;
        const terminalRadius = Number.isFinite(Number(parsed.terminalRadius))
          ? Number(parsed.terminalRadius)
          : getDerivedTerminalRadius(complexTerminalPose, complexVc, Number(parsed.radius) || 0);
        const simpleCurve = parsed.simpleCurve || (terminalPose && vc
          ? buildSimpleCurveGeometry({ ...parsed, terminalPose, vc, bisector })
          : null);
        const finalPose = simpleCurve?.endPose || parsed.finalPose || terminalPose || null;
        const pathPoints = Array.isArray(parsed.pathPoints) && parsed.pathPoints.length
          ? parsed.pathPoints
          : Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : [];
        return {
          ...parsed,
          terminalPose,
          finalPose,
          vc,
          complexTerminalPose,
          complexVc,
          terminalRadius,
          bisector,
          pathPoints,
          simpleCurve,
          slew: Number(parsed.slew ?? parsed.sl) || 0,
          theta: Number(parsed.theta ?? terminalPose?.theta) || 0,
          steeredWheelHeadingChange: Number(parsed.steeredWheelHeadingChange ?? parsed.theta ?? terminalPose?.theta) || 0,
          steeredWheelTravelDistance: Number(parsed.steeredWheelTravelDistance)
            || Number(parsed.curveLength)
            || 0,
          complexCurveLength: Number(parsed.complexCurveLength) || Number(parsed.curveLength) || 0,
          simpleCurveLength: Number(simpleCurve?.arcLength) || 0,
          totalTravelDistance: Number(parsed.totalTravelDistance)
            || (Number(parsed.curveLength) || 0) + (Number(simpleCurve?.arcLength) || 0),
          spTravelDistance: Number(parsed.spTravelDistance)
            || (Number(parsed.curveLength) || 0) + (Number(simpleCurve?.arcLength) || 0),
          terminalCoord: parsed.terminalCoord || (finalPose
            ? createCoord(finalPose.x, finalPose.y, finalPose.angle, 1, "Rp", "#7dd3fc")
            : null)
        };
      } catch (error) {
        return null;
      }
    }

    function solveSimpleArc(arc = getSimpleArcGeometry()) {
      const serverSolution = solveSimpleArcFromServer(arc);
      if (serverSolution) {
        return serverSolution;
      }

      if (!arc?.valid) {
        return {
          success: false,
          radius: Number(arc?.radius) || 0,
          arcLength: Number(arc?.arcLength) || 0,
          s: Number(arc?.arcLength) || 0,
          sl: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
          slew: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
          turnAngle: Number(arc?.turnAngle) || 0,
          finalHeading: 0,
          theta: 0,
          steeredWheelHeadingChange: 0,
          positionError: NaN,
          headingError: NaN,
          headingNormalAngle: NaN,
          headingNormalError: NaN,
          headingNormalSatisfied: false,
          terminalPose: null,
          complexTerminalPose: null,
          terminalCoord: null,
          vc: null,
          complexVc: null,
          terminalRadius: NaN,
          spTravelDistance: 0,
          steeredWheelTravelDistance: 0,
          pathPoints: [],
          passes: []
        };
      }
      return {
        success: false,
        edgeCase: false,
        edgeCaseReason: "server-unavailable",
        radius: Number(arc?.radius) || 0,
        arcLength: Number(arc?.arcLength) || 0,
        s: Number(arc?.arcLength) || 0,
        sl: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
        slew: Number(arc?.radius) ? 1 / Number(arc.radius) : 0,
        turnAngle: Number(arc?.turnAngle) || 0,
        finalHeading: 0,
        theta: 0,
        steeredWheelHeadingChange: 0,
        curveLength: 0,
        complexCurveLength: 0,
        simpleCurveLength: 0,
        totalTravelDistance: 0,
        spTravelDistance: 0,
        steeredWheelTravelDistance: 0,
        positionError: NaN,
        headingError: NaN,
        headingNormalAngle: NaN,
        headingNormalError: NaN,
        headingNormalSatisfied: false,
        vc: null,
        complexVc: null,
        terminalPose: null,
        complexTerminalPose: null,
        finalPose: null,
        terminalCoord: null,
        complexCurve: null,
        simpleCurve: null,
        terminalRadius: NaN,
        pathPoints: [],
        bisector: null,
        steerMax: Number(arc?.steerMax) || 0,
        passes: []
      };
    }

    function sampleSimpleArcPoints(arc = getSimpleArcGeometry(), sampleCount = Math.max(24, Math.ceil(Math.abs(Number(arc?.turnAngle) || 0) * 48))) {
      if (!arc?.valid) return [];
      const points = [];
      const radius = Math.abs(Number(arc.radius) || 0);
      const count = Math.max(2, sampleCount);
      for (let i = 0; i <= count; i += 1) {
        const t = count === 0 ? 0 : i / count;
        const theta = arc.startAngle + arc.turnAngle * t;
        points.push({
          x: arc.center.x + Math.cos(theta) * radius,
          y: arc.center.y + Math.sin(theta) * radius
        });
      }
      return points;
    }

    function getCircleLineIntersections(center, radius, lineOrigin, lineDirection) {
      const directionLength = Math.hypot(Number(lineDirection?.x) || 0, Number(lineDirection?.y) || 0);
      if (directionLength <= 1e-12) return [];
      const direction = {
        x: Number(lineDirection.x) / directionLength,
        y: Number(lineDirection.y) / directionLength
      };
      const ox = Number(lineOrigin?.x) || 0;
      const oy = Number(lineOrigin?.y) || 0;
      const cx = Number(center?.x) || 0;
      const cy = Number(center?.y) || 0;
      const fx = ox - cx;
      const fy = oy - cy;
      const projection = fx * direction.x + fy * direction.y;
      const perpSq = fx * fx + fy * fy - projection * projection;
      const radiusSq = Math.max(0, Number(radius) || 0) ** 2;
      if (perpSq > radiusSq + 1e-9) return [];
      const offset = Math.sqrt(Math.max(0, radiusSq - perpSq));
      const tValues = offset <= 1e-12
        ? [-projection]
        : [-projection - offset, -projection + offset];
      return tValues.map((t) => ({
        x: ox + direction.x * t,
        y: oy + direction.y * t,
        t
      })).sort((a, b) => a.t - b.t);
    }

    function sampleCircularArcPoints(center, radius, startAngle, turnAngle, sampleCount = Math.max(24, Math.ceil(Math.abs(Number(turnAngle) || 0) * 48))) {
      const points = [];
      const count = Math.max(2, sampleCount);
      const safeRadius = Math.abs(Number(radius) || 0);
      const origin = {
        x: Number(center?.x) || 0,
        y: Number(center?.y) || 0
      };
      const start = Number(startAngle) || 0;
      const delta = Number(turnAngle) || 0;
      for (let i = 0; i <= count; i += 1) {
        const t = count === 0 ? 0 : i / count;
        const theta = start + delta * t;
        points.push({
          x: origin.x + Math.cos(theta) * safeRadius,
          y: origin.y + Math.sin(theta) * safeRadius
        });
      }
      return points;
    }

    function buildSimpleCurveGeometry(solution = state.simpleArcSolution || solveSimpleArc()) {
      const terminalPose = solution?.terminalPose || null;
      const vc = solution?.vc || null;
      const bisector = solution?.bisector || null;
      if (!terminalPose || !vc || !bisector?.valid) {
        return {
          valid: false,
          center: null,
          radius: 0,
          startPoint: null,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const center = {
        x: Number(vc.x) || 0,
        y: Number(vc.y) || 0
      };
      const startPoint = {
        x: Number(terminalPose.x) || 0,
        y: Number(terminalPose.y) || 0
      };
      const radius = Math.hypot(startPoint.x - center.x, startPoint.y - center.y);
      if (!Number.isFinite(radius) || radius <= 1e-9) {
        return {
          valid: false,
          center,
          radius: 0,
          startPoint,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const intersections = getCircleLineIntersections(center, radius, bisector.center, bisector.bisectorDir);
      if (!intersections.length) {
        return {
          valid: false,
          center,
          radius,
          startPoint,
          endPoint: null,
          startAngle: 0,
          endAngle: 0,
          turnAngle: 0,
          arcLength: 0,
          pathPoints: [],
          startPose: terminalPose,
          endPose: null,
          bisectorPoint: null,
          bisector
        };
      }

      const startAngle = Math.atan2(startPoint.y - center.y, startPoint.x - center.x);
      const candidates = intersections.map((point) => {
        const endAngle = Math.atan2(point.y - center.y, point.x - center.x);
        const turnAngle = wrapAngle(endAngle - startAngle);
        return {
          point,
          endAngle,
          turnAngle,
          arcLength: Math.abs(turnAngle) * radius
        };
      });
      candidates.sort((a, b) => {
        if (a.arcLength < b.arcLength - 1e-12) return -1;
        if (a.arcLength > b.arcLength + 1e-12) return 1;
        if (Math.abs(a.turnAngle) < Math.abs(b.turnAngle) - 1e-12) return -1;
        if (Math.abs(a.turnAngle) > Math.abs(b.turnAngle) + 1e-12) return 1;
        return a.point.t - b.point.t;
      });

      const chosen = candidates[0];
      const sampleCount = Math.max(12, Math.ceil(Math.abs(chosen.turnAngle) * 48));
      const pathPoints = sampleCircularArcPoints(center, radius, startAngle, chosen.turnAngle, sampleCount);
      const endPoint = pathPoints[pathPoints.length - 1] || chosen.point;
      const endAngle = startAngle + chosen.turnAngle;
      const endHeading = chosen.turnAngle >= 0 ? endAngle + Math.PI / 2 : endAngle - Math.PI / 2;

      return {
        valid: true,
        center,
        radius,
        startPoint,
        endPoint,
        startAngle,
        endAngle,
        turnAngle: chosen.turnAngle,
        arcLength: Math.abs(chosen.turnAngle) * radius,
        pathPoints,
        startPose: {
          x: startPoint.x,
          y: startPoint.y,
          angle: Number(terminalPose.angle) || 0,
          theta: Number(terminalPose.theta) || 0
        },
        endPose: {
          x: endPoint.x,
          y: endPoint.y,
          angle: endHeading,
          heading: endHeading,
          theta: Number(terminalPose.theta) || 0
        },
        bisectorPoint: chosen.point,
        bisector
      };
    }

    function getSimpleCurvePathTraces(solution = state.simpleArcSolution || solveSimpleArc()) {
      const simpleCurve = solution?.simpleCurve || null;
      const pathPoints = Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : [];
      return {
        pathPoints,
        worldPoints: pathPoints.map(point => ({
          x: Number(point.x) || 0,
          y: Number(point.y) || 0
        }))
      };
    }

    function getSimpleArcPathTraces(solution = state.simpleArcSolution || solveSimpleArc()) {
      const simpleCurve = solution?.simpleCurve || null;
      const pathPoints = Array.isArray(solution?.pathPoints)
        ? solution.pathPoints
        : (Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : []);
      return {
        pathPoints,
        rpWorldPoints: pathPoints.map(point => ({
          x: Number(point.x) || 0,
          y: Number(point.y) || 0
        }))
      };
    }

    function getSimpleArcBisectorPoint(arc = getSimpleArcGeometry()) {
      if (!arc?.valid) return null;
      const bisectorAngle = arc.startAngle + arc.turnAngle / 2;
      const radius = Math.abs(Number(arc.radius) || 0);
      return {
        x: arc.center.x + Math.cos(bisectorAngle) * radius,
        y: arc.center.y + Math.sin(bisectorAngle) * radius
      };
    }

    function extendRayToCanvasEdge(start, through) {
      const rect = canvas.getBoundingClientRect();
      const dx = Number(through?.x) - Number(start?.x);
      const dy = Number(through?.y) - Number(start?.y);
      const candidates = [];
      const eps = 1e-9;

      if (Math.abs(dx) > eps) {
        const tRight = (rect.width - Number(start?.x)) / dx;
        const yRight = Number(start?.y) + dy * tRight;
        if (tRight > 0 && yRight >= 0 && yRight <= rect.height) {
          candidates.push({ t: tRight, x: rect.width, y: yRight, edge: "right" });
        }
        const tLeft = (0 - Number(start?.x)) / dx;
        const yLeft = Number(start?.y) + dy * tLeft;
        if (tLeft > 0 && yLeft >= 0 && yLeft <= rect.height) {
          candidates.push({ t: tLeft, x: 0, y: yLeft, edge: "left" });
        }
      }

      if (Math.abs(dy) > eps) {
        const tBottom = (rect.height - Number(start?.y)) / dy;
        const xBottom = Number(start?.x) + dx * tBottom;
        if (tBottom > 0 && xBottom >= 0 && xBottom <= rect.width) {
          candidates.push({ t: tBottom, x: xBottom, y: rect.height, edge: "bottom" });
        }
        const tTop = (0 - Number(start?.y)) / dy;
        const xTop = Number(start?.x) + dx * tTop;
        if (tTop > 0 && xTop >= 0 && xTop <= rect.width) {
          candidates.push({ t: tTop, x: xTop, y: 0, edge: "top" });
        }
      }

      if (!candidates.length) return through;
      candidates.sort((a, b) => {
        const aAxis = a.edge === "bottom" || a.edge === "right" ? 0 : 1;
        const bAxis = b.edge === "bottom" || b.edge === "right" ? 0 : 1;
        if (aAxis !== bAxis) return aAxis - bAxis;
        return a.t - b.t;
      });
      return candidates[0];
    }

    function drawSimpleArc() {
      const arc = getSimpleArcGeometry();
      if (!arc.valid) return;

      const arcPoints = sampleSimpleArcPoints(arc);
      const bisectorEnd = getSimpleArcBisectorPoint(arc);

      const originS = worldToScreen(0, 0);
      const centerS = worldToScreen(arc.center.x, arc.center.y);

      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(74,222,128,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(originS.x, originS.y);
      ctx.lineTo(centerS.x, centerS.y);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(74,222,128,0.25)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < arcPoints.length; i += 1) {
        const p = worldToScreen(arcPoints[i].x, arcPoints[i].y);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.beginPath();
      ctx.arc(centerS.x, centerS.y, 4.5, 0, Math.PI * 2);
      ctx.fill();

      if (bisectorEnd) {
        const bisectorEndS = worldToScreen(bisectorEnd.x, bisectorEnd.y);
        const bisectorRayEndS = extendRayToCanvasEdge(centerS, bisectorEndS);
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerS.x, centerS.y);
        ctx.lineTo(bisectorRayEndS.x, bisectorRayEndS.y);
        ctx.stroke();
        ctx.restore();
      }

      const endS = worldToScreen(arcPoints[arcPoints.length - 1].x, arcPoints[arcPoints.length - 1].y);
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Complex curve", centerS.x + 8, centerS.y - 24);
      ctx.fillText("CCor", centerS.x + 8, centerS.y - 8);
      ctx.fillText(`Radius = ${Math.abs(arc.radius).toFixed(2)}, Al = ${(arc.arcLength).toFixed(2)}`, endS.x + 10, endS.y - 8);
      ctx.restore();
    }

    function drawSimpleCurve() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      const simpleCurve = solution?.simpleCurve || buildSimpleCurveGeometry(solution);
      if (!simpleCurve?.valid || !Array.isArray(simpleCurve.pathPoints) || simpleCurve.pathPoints.length < 2) return;

      const pathPoints = simpleCurve.pathPoints.map(point => worldToScreen(point.x, point.y));
      const centerS = worldToScreen(simpleCurve.center.x, simpleCurve.center.y);
      const startS = worldToScreen(simpleCurve.startPoint.x, simpleCurve.startPoint.y);
      const endS = worldToScreen(simpleCurve.endPoint.x, simpleCurve.endPoint.y);

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(74,222,128,0.84)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
      for (let i = 1; i < pathPoints.length; i += 1) {
        ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
      ctx.stroke();

      ctx.strokeStyle = "rgba(74,222,128,0.22)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
      for (let i = 1; i < pathPoints.length; i += 1) {
        ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
      ctx.stroke();

      ctx.fillStyle = "rgba(74,222,128,0.98)";
      ctx.beginPath();
      ctx.arc(startS.x, startS.y, 3.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(74,222,128,0.9)";
      ctx.beginPath();
      ctx.arc(endS.x, endS.y, 4.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.beginPath();
      ctx.arc(centerS.x, centerS.y, 4.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Simple curve", startS.x + 8, startS.y + 14);
      ctx.fillText("VCor", centerS.x + 8, centerS.y - 8);
      ctx.fillText(`Final Rp`, endS.x + 10, endS.y - 8);
      ctx.fillText(`R = ${Math.abs(simpleCurve.radius).toFixed(2)}, L = ${(simpleCurve.arcLength).toFixed(2)}`, endS.x + 10, endS.y + 10);

      ctx.restore();
    }

    function drawVehicleInstance(instance, options = {}) {
      const alpha = options.alpha ?? 1;
      const bodyWidth = options.bodyWidth ?? 3;
      const steerWidth = options.steerWidth ?? 2.5;
      const bodyLabel = options.label ?? "Veh";
      const steerLabel = options.steerLabel ?? "Sv";
      const bodyAngle = Number(instance.angle) || 0;
      const theta = Number(instance.theta) || 0;
      const rear = { x: Number(instance.x) || 0, y: Number(instance.y) || 0 };
      const front = {
        x: rear.x + Math.cos(bodyAngle),
        y: rear.y + Math.sin(bodyAngle)
      };
      const rearS = worldToScreen(rear.x, rear.y);
      const frontS = worldToScreen(front.x, front.y);
      const steerEnd = {
        x: front.x + Math.cos(bodyAngle + theta) * 0.25,
        y: front.y + Math.sin(bodyAngle + theta) * 0.25
      };
      const steerStartS = worldToScreen(front.x, front.y);
      const steerEndS = worldToScreen(steerEnd.x, steerEnd.y);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `rgba(125,211,252,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = bodyWidth;
      ctx.beginPath();
      ctx.moveTo(rearS.x, rearS.y);
      ctx.lineTo(frontS.x, frontS.y);
      ctx.stroke();

      ctx.strokeStyle = `rgba(251,191,36,${Math.min(1, 0.82 * alpha)})`;
      ctx.lineWidth = steerWidth;
      drawArrow(steerStartS, steerEndS, ctx.strokeStyle, ctx.strokeStyle, steerWidth);
      const perpendicularIntersection = getVehiclePerpendicularIntersection(rear, bodyAngle, front, bodyAngle + theta);
      if (perpendicularIntersection) {
        drawSteerPerpendicularLine(front, bodyAngle + theta, alpha, steerWidth * 0.9);
        drawVehiclePerpendicularLine(rear, bodyAngle, alpha, bodyWidth * 0.65);
        drawVehicleIntersectionPoint(perpendicularIntersection, alpha);
      }

      drawNode(rearS.x, rearS.y, `rgba(125,211,252,${Math.min(1, 0.9 * alpha)})`);
      drawNode(frontS.x, frontS.y, `rgba(251,191,36,${Math.min(1, 0.9 * alpha)})`);
      drawOffsetLabel(rearS.x, rearS.y, bodyLabel);
      drawOffsetLabel(frontS.x, frontS.y, steerLabel);

      ctx.fillStyle = `rgba(237,243,255,${Math.min(1, 0.7 * alpha)})`;
      ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`${bodyLabel} + ${steerLabel}`, rearS.x + 10, rearS.y - 10);
      ctx.restore();
    }

    function vectorEndpoints(vector) {
      const vehicleVector = getVehicleVector();
      const start = isSteerVector(vector)
          ? getVehicleEnd(vehicleVector)
          : { x: vector.x, y: vector.y };
      const length = isSteerVector(vector) ? 0.25 : vector.length;
      const end = {
        x: start.x + Math.cos(vector.angle) * length,
        y: start.y + Math.sin(vector.angle) * length
      };
      return { start, end };
    }

    function drawVehicle() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      if (!solution?.terminalPose) return;
      const pose = solution.terminalPose;
      drawVehicleInstance(pose, {
        alpha: 1,
        bodyWidth: 4,
        steerWidth: 2.5,
        label: "Rp",
        steerLabel: solution?.edgeCase ? "Sv (limit)" : "Sv"
      });
      const rearS = worldToScreen(Number(pose.x) || 0, Number(pose.y) || 0);
      ctx.save();
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "13px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(
        `${solution?.edgeCase ? "Edge case pose" : "Terminal pose"}  ψ = ${formatAngle(Number(pose.heading) || Number(pose.angle) || 0)}`,
        rearS.x + 12,
        rearS.y - 32
      );
      ctx.restore();
    }

    function drawComplexTerminalPose() {
      const pose = state.simpleArcSolution?.complexCurve?.terminalPose || null;
      if (!pose) return;
      drawVehicleInstance(pose, {
        alpha: 1,
        bodyWidth: 4,
        steerWidth: 2.5,
        label: "Rp",
        steerLabel: "Sv"
      });
      const rearS = worldToScreen(Number(pose.x) || 0, Number(pose.y) || 0);
      ctx.save();
      ctx.fillStyle = "rgba(237,243,255,0.88)";
      ctx.font = "13px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(
        `Complex terminal pose  ψ = ${formatAngle(Number(pose.heading) || Number(pose.angle) || 0)}`,
        rearS.x + 12,
        rearS.y - 32
      );
      ctx.restore();
    }

    function drawVehicleCorToBisectorNormal() {
      const solution = state.simpleArcSolution || solveSimpleArc();
      if (!solution?.success || !solution?.vc || !solution?.bisector?.valid) return;

      const vcSource = solution?.complexCurve?.vc || solution?.vc || null;
      const vc = {
        x: Number(vcSource?.x) || 0,
        y: Number(vcSource?.y) || 0
      };
      const bisector = solution.bisector;
      const center = {
        x: Number(bisector.center?.x) || 0,
        y: Number(bisector.center?.y) || 0
      };
      const normalDir = bisector.bisectorNormal || {
        x: -(Number(bisector.bisectorDir?.y) || 0),
        y: Number(bisector.bisectorDir?.x) || 0
      };
      const normalLength = Math.hypot(normalDir.x, normalDir.y) || 1;
      const unitNormal = {
        x: normalDir.x / normalLength,
        y: normalDir.y / normalLength
      };
      const offset = {
        x: vc.x - center.x,
        y: vc.y - center.y
      };
      const projectionDistance = offset.x * unitNormal.x + offset.y * unitNormal.y;
      const projectedPoint = {
        x: center.x + unitNormal.x * projectionDistance,
        y: center.y + unitNormal.y * projectionDistance
      };
      const vcS = worldToScreen(vc.x, vc.y);
      const projectedS = worldToScreen(projectedPoint.x, projectedPoint.y);

      ctx.save();
      ctx.strokeStyle = "rgba(251,113,133,0.9)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.moveTo(vcS.x, vcS.y);
      ctx.lineTo(projectedS.x, projectedS.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(251,113,133,0.95)";
      ctx.beginPath();
      ctx.arc(projectedS.x, projectedS.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Complex VCor -> normal", projectedS.x + 8, projectedS.y - 8);
      ctx.restore();
    }

    function drawVehicleCopies() {
      const complexCopies = Array.isArray(state.vehicleCopies) ? state.vehicleCopies : [];
      const simpleCopies = Array.isArray(state.simpleVehicleCopies) ? state.simpleVehicleCopies : [];
      if (!complexCopies.length && !simpleCopies.length) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const combined = [];
      for (let i = 0; i < complexCopies.length; i += 1) {
        combined.push({
          copy: complexCopies[i],
          label: i === 0 ? "Start" : "",
          bodyWidth: 2.5,
          steerWidth: 1.9
        });
      }
      for (let i = 0; i < simpleCopies.length; i += 1) {
        combined.push({
          copy: simpleCopies[i],
          label: i === 0 ? "Simple" : "",
          bodyWidth: 2.5,
          steerWidth: 1.9
        });
      }

      const total = Math.max(1, combined.length - 1);
      for (let i = 0; i < combined.length; i += 1) {
        const entry = combined[i];
        const t = total === 0 ? 1 : i / total;
        const alpha = 0.30 + 0.60 * Math.pow(t, 0.9);
        drawVehicleInstance(entry.copy, {
          alpha,
          bodyWidth: entry.bodyWidth,
          steerWidth: entry.steerWidth,
          label: entry.label,
          steerLabel: ""
        });
      }

      ctx.restore();
    }

    function getVehicleCopyTracePoints(copies) {
      const points = [];
      if (!Array.isArray(copies)) {
        return points;
      }
      for (const copy of copies) {
        const x = Number(copy?.x);
        const y = Number(copy?.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        points.push({ x, y });
      }
      return points;
    }

    function drawVehiclePathTrace() {
      const complexPoints = getVehicleCopyTracePoints(state.vehicleCopies).map(point => worldToScreen(point.x, point.y));
      const simplePoints = getVehicleCopyTracePoints(state.simpleVehicleCopies).map(point => worldToScreen(point.x, point.y));
      if (complexPoints.length < 2 && simplePoints.length < 2) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const drawTrace = (points, strokeStyle, width, startFill, endFill) => {
        if (points.length < 2) return;
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        const start = points[0];
        const end = points[points.length - 1];
        ctx.fillStyle = startFill;
        ctx.beginPath();
        ctx.arc(start.x, start.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = endFill;
        ctx.beginPath();
        ctx.arc(end.x, end.y, 3, 0, Math.PI * 2);
        ctx.fill();
      };

      // Complex Rp trace is red and thin.
      drawTrace(
        complexPoints,
        "rgba(248,113,113,0.82)",
        1.5,
        "rgba(248,113,113,0.95)",
        "rgba(248,113,113,0.95)"
      );

      // Simple Rp trace stays green and thin.
      drawTrace(
        simplePoints,
        "rgba(126,240,191,0.82)",
        1.5,
        "rgba(126,240,191,0.95)",
        "rgba(126,240,191,0.95)"
      );

      ctx.restore();
    }

    function drawNode(x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + 8, y - 8);
    }

    function drawOffsetLabel(x, y, label, offsetX = 12, offsetY = -18) {
      if (!label) return;
      ctx.fillStyle = "rgba(237,243,255,0.9)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(label, x + offsetX, y + offsetY);
    }

    function drawVectors() {
      for (let index = 0; index < state.vectors.length; index += 1) {
        const vector = state.vectors[index];
        if (index === 0) continue;
        const { start, end } = vectorEndpoints(vector);
        const s = worldToScreen(start.x, start.y);
        const e = worldToScreen(end.x, end.y);
        const selected = state.selectedId === vector.id;
        const thetaVector = isThetaVector(vector);
        const vehicleVector = getVehicleVector();
        const thetaAngle = (vehicleVector ? vehicleVector.angle : 0) + getThetaValue();
        const thetaTip = thetaVector
          ? worldToScreen(
              start.x + Math.cos(thetaAngle) * 0.22,
              start.y + Math.sin(thetaAngle) * 0.22
            )
          : null;

        if (thetaVector) {
          drawArrow(s, thetaTip, selected ? "rgba(255,255,255,0.92)" : vector.color, vector.color, 3);
        } else {
          drawArrow(s, e, selected ? "rgba(255,255,255,0.92)" : vector.color, vector.color, selected ? 4 : 3);
        }
        drawNode(s.x, s.y, vector.color, index === 0 ? "" : (vector.label?.trim() ? vector.label.trim()[0].toUpperCase() : "V"));
        drawHandle(s.x, s.y, selected ? "#ffffff" : vector.color);
        if (!thetaVector) {
          drawHandle(e.x, e.y, selected ? "#ffffff" : vector.color);
        }

        ctx.fillStyle = "rgba(237,243,255,0.88)";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        const labelPoint = thetaVector ? thetaTip : e;
        if (index !== 0) {
          ctx.fillText(vector.label || "Vector", labelPoint.x + 8, labelPoint.y - 8);
        }
      }
    }

    function drawHandle(x, y, color) {
      ctx.fillStyle = "#070b16";
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "rgba(6, 10, 20, 0.38)";
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (initialVehicleSequenceFitPending) {
        fitView();
        initialVehicleSequenceFitPending = false;
        scheduleRender();
      }
      drawGrid();
      drawAxes();
      if (state.ui.vehicle) {
        drawVehiclePathTrace();
      }
      drawVehicleCopies();
      drawSimpleArc();
      drawSimpleCurve();
      drawComplexTerminalPose();
      if (state.ui.vehicle) {
        drawVehicle();
        drawVehicleCorToBisectorNormal();
      }
      drawVectors();

      updateMetrics();
      updateDependentList();
      updateJson();
    }

    function updateMetrics() {
      coordsReadout.textContent = lastPointerWorld
        ? `x: ${lastPointerWorld.x.toFixed(3)}, y: ${lastPointerWorld.y.toFixed(3)}`
        : "x: 0.000, y: 0.000";
    }

    function updateJson() {
      if (jsonOutput) {
        jsonOutput.value = JSON.stringify(serializableState(), null, 2);
      }
    }

    function updateDebugData(solution) {
      if (!debugData) return;
      debugData.textContent = "";
      const passes = Array.isArray(solution?.passes) ? solution.passes : [];
      if (!passes.length) {
        debugData.textContent = "No solver trace yet.";
        return;
      }

      const lines = ["#  Slew     s        posErr    headErr   terminal pose"];
      passes.forEach((pass, index) => {
        const candidate = pass?.steerBest || pass?.pathBest || null;
        const pathLength = Number(candidate?.pathLength ?? pass?.pathCenter);
        const finalSteer = Number(candidate?.finalSteer ?? pass?.steerCenter);
        const slew = Number.isFinite(pathLength) && Math.abs(pathLength) > 1e-12
          ? finalSteer / pathLength
          : NaN;
        const positionError = Number(candidate?.positionError);
        const headingError = Number(candidate?.headingError);
        const terminalPose = pass?.terminalPose || candidate?.result?.terminalPose || candidate?.terminalPose || null;
        const terminalPoseText = terminalPose
          ? `(${formatDebugNumber(terminalPose.x)},${formatDebugNumber(terminalPose.y)},${formatDebugNumber(terminalPose.angle)})`
          : "(NaN,NaN,NaN)";
        lines.push([
          String(index + 1).padStart(2, " "),
          formatDebugNumber(slew).padStart(8, " "),
          formatDebugNumber(pathLength).padStart(8, " "),
          formatDebugNumber(positionError).padStart(8, " "),
          formatDebugNumber(headingError).padStart(8, " "),
          terminalPoseText
        ].join(" "));
      });

      debugData.textContent = lines.join("\n");
    }

    function updateDependentList() {
      if (!dependentListDirty) return;
      dependentList.innerHTML = "";
      const solution = state.simpleArcSolution || solveSimpleArc();
      const entries = [{
        label: "Complex terminal",
        value: formatComplexTerminalSummary(solution),
        full: true
      }, {
        label: "CCor",
        value: formatVcSummary(solution),
        full: true
      }, {
        label: "Travel",
        value: formatFixed3(Number(solution?.steeredWheelTravelDistance)
          || Number(solution?.curveLength)
          || 0),
        full: true
      }, {
        label: "Radius",
        value: formatFixed3(Number(solution?.terminalRadius)
          || Number(solution?.radius)
          || 0),
        full: true
      }, {
        label: "Errors",
        value: formatErrorSummary(solution),
        full: true
      }, ...(solution?.edgeCase ? [{
        label: "Status",
        value: "Edge case: steer max reached before CCor could hit the bisector.",
        full: true
      }] : [])];
      for (const entry of entries) {
        const control = document.createElement("div");
        control.className = entry.full ? "control full" : "control";
        control.innerHTML = `
          <label>${escapeHtml(entry.label)}</label>
          <input type="text" value="${escapeHtml(entry.value)}" readonly />
          ${entry.note ? `<div class="sub" style="margin: 0; font-size: 12px;">${escapeHtml(entry.note)}</div>` : ""}
        `;
        dependentList.appendChild(control);
      }
      updateDebugData(solution);
      dependentListDirty = false;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function degToRad(value) {
      return (value * Math.PI) / 180;
    }

    function getHeadingChangeStep() {
      return degToRad(5);
    }

    function snapHeadingChange(value) {
      const step = getHeadingChangeStep();
      const numeric = Math.max(0, Number(value) || 0);
      return Math.round(numeric / step) * step;
    }

    function getHeadingChange(geometry = state.vehicle) {
      return Math.max(0, Number(geometry?.headingChange) || 0);
    }

    function getSolverInitialSl(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) && numeric > 0.1 ? numeric : Math.PI / 4;
    }

    function getDerivedTerminalRadius(terminalPose, vc, fallbackRadius = NaN) {
      const poseX = Number(terminalPose?.x);
      const poseY = Number(terminalPose?.y);
      const vcX = Number(vc?.x);
      const vcY = Number(vc?.y);
      if (Number.isFinite(poseX) && Number.isFinite(poseY) && Number.isFinite(vcX) && Number.isFinite(vcY)) {
        const distance = Math.hypot(poseX - vcX, poseY - vcY);
        if (Number.isFinite(distance) && distance > 0) {
          return distance;
        }
      }
      const numericFallback = Number(fallbackRadius);
      return Number.isFinite(numericFallback) ? Math.abs(numericFallback) : NaN;
    }

    function getCurveLengthFromGeometry(geometry = state.vehicle) {
      const radius = Number(geometry?.radius) || 0;
      return radius * getHeadingChange(geometry);
    }

    function radToDeg(value) {
      return (value * 180) / Math.PI;
    }

    function formatAngle(rad) {
      const value = Number(rad) || 0;
      return `${value.toFixed(3)} rad (${radToDeg(value).toFixed(0)}°)`;
    }

    function formatDeltaPsiDisplay(rad) {
      const value = Number(rad) || 0;
      return `${value.toFixed(3)} (${radToDeg(value).toFixed(0)})`;
    }

    function snapDeltaPsiToWholeDegrees(rad) {
      return degToRad(Math.round(radToDeg(Number(rad) || 0)));
    }

    function clampDeltaPsiDegrees(degrees) {
      return clamp(Number(degrees) || 0, 0, 180);
    }

    function getDeltaPsiStep(degrees) {
      const value = clamp(Number(degrees) || 0, 0, 180);
      const distanceToLimit = Math.min(value, 180 - value);
      if (distanceToLimit <= 1) return 0.1;
      if (distanceToLimit <= 5) return 0.5;
      if (distanceToLimit <= 15) return 1;
      if (distanceToLimit <= 45) return 5;
      return 10;
    }

    function normalizeDeltaPsiDegrees(degrees) {
      const clamped = clampDeltaPsiDegrees(degrees);
      const step = getDeltaPsiStep(clamped);
      return Math.round(clamped / step) * step;
    }

    function formatDeltaPsiDegreesValue(degrees) {
      return Number(clampDeltaPsiDegrees(degrees) || 0).toFixed(1);
    }

    function normalizeDeltaPsi(rad) {
      return degToRad(normalizeDeltaPsiDegrees(radToDeg(Number(rad) || 0)));
    }

    function formatFixed2(value) {
      return (Number(value) || 0).toFixed(2);
    }

    function formatFixed3(value) {
      return (Number(value) || 0).toFixed(3);
    }

    function formatDebugNumber(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return "NaN";
      const abs = Math.abs(numeric);
      if ((abs > 0 && abs < 0.0001) || abs >= 1000) {
        return numeric.toExponential(3);
      }
      return numeric.toFixed(5).replace(/\.?0+$/, "");
    }

    function getRadiusStep(value) {
      const magnitude = Math.abs(Number(value) || 0);
      if (magnitude < 0.01) return 0.001;
      if (magnitude < 0.05) return 0.005;
      if (magnitude < 0.1) return 0.01;
      if (magnitude < 0.5) return 0.05;
      if (magnitude < 1) return 0.1;
      if (magnitude < 5) return 0.5;
      if (magnitude < 25) return 1;
      return 5;
    }

    function normalizeRadiusValue(value) {
      const numeric = clamp(Number(value) || 0, -100, 100);
      const sign = numeric < 0 ? -1 : 1;
      const magnitude = Math.abs(numeric);
      const step = getRadiusStep(magnitude);
      const normalized = Math.round(magnitude / step) * step;
      if (normalized < 0.0005) return 0;
      return Number((sign * normalized).toFixed(3));
    }

    function formatRadiusValue(value) {
      return Number(value || 0).toFixed(3);
    }

    function getSteerMaxStepDegrees(value) {
      const degrees = clamp(Number(value) || 0, 45, 90);
      const distanceToLimit = Math.min(degrees - 45, 90 - degrees);
      if (distanceToLimit <= 1) return 0.1;
      if (distanceToLimit <= 5) return 0.5;
      if (distanceToLimit <= 15) return 1;
      if (distanceToLimit <= 30) return 2;
      return 5;
    }

    function normalizeSteerMaxDegrees(degrees) {
      const clamped = clamp(Number(degrees) || 0, 45, 90);
      const step = getSteerMaxStepDegrees(clamped);
      if (step >= 1) return Math.round(clamped / step) * step;
      if (step === 0.5) return Math.round(clamped * 2) / 2;
      if (step === 0.1) return Math.round(clamped * 10) / 10;
      if (step === 0.01) return Math.round(clamped * 100) / 100;
      return Math.round(clamped * 1000) / 1000;
    }

    function formatSteerMaxValue(value) {
      return Number(value || 0).toFixed(2);
    }

    function formatCoordSummary(coord, pathLength = null) {
      if (!coord) return "NaN";
      const coordText = `(${formatFixed3(coord.X)}, ${formatFixed3(coord.Y)}, ${formatFixed3(coord.Psi)})`;
      if (!Number.isFinite(Number(pathLength))) return coordText;
      return `${coordText} ${formatFixed3(pathLength)}`;
    }

    function formatPointSummary(point) {
      if (!point) return "NaN";
      return `(${formatFixed3(point.x)}, ${formatFixed3(point.y)})`;
    }

    function formatComplexTerminalSummary(solution) {
      const pose = solution?.complexTerminalPose || solution?.terminalPose || null;
      if (!pose) return "NaN";
      const poseText = `(${formatFixed3(pose.x)}, ${formatFixed3(pose.y)}, ${formatFixed3(pose.angle)})`;
      const theta = Number.isFinite(Number(solution?.theta ?? pose.theta))
        ? ` theta ${formatFixed3(Number(solution?.theta ?? pose.theta))}`
        : "";
      const radius = Number.isFinite(Number(solution?.terminalRadius))
        ? Number(solution.terminalRadius)
        : Number(pose.radius);
      const radiusText = Number.isFinite(radius)
        ? ` r ${formatFixed3(radius)}`
        : "";
      return `${poseText}${theta}${radiusText}`;
    }

    function formatVcSummary(solution) {
      const vc = solution?.complexVc || solution?.vc || null;
      if (!vc) return "NaN";
      const radius = Number.isFinite(Number(solution?.terminalRadius))
        ? ` r ${formatFixed3(Number(solution.terminalRadius))}`
        : "";
      return `${formatPointSummary(vc)}${radius}`;
    }

    function formatErrorSummary(solution) {
      if (!solution) return "NaN";
      const position = formatFixed3(solution.positionError);
      const heading = formatFixed3(solution.headingError);
      return `Position ${position}, Heading ${heading}`;
    }

    function vectorAtPoint(point, baseAngle, length, label, color) {
      return {
        id: randomId(),
        label,
        x: point.x,
        y: point.y,
        angle: baseAngle,
        length,
        color
      };
    }

    function findHit(point) {
      const hitRadius = 10;
      for (let i = state.vectors.length - 1; i >= 0; i -= 1) {
        const vector = state.vectors[i];
        const { start, end } = vectorEndpoints(vector);
        const s = worldToScreen(start.x, start.y);
        const e = worldToScreen(end.x, end.y);
        const px = point.x;
        const py = point.y;
        if (dist({ x: px, y: py }, s) <= hitRadius) {
          return { vector, kind: "origin", start, end };
        }
        if (!isSteerVector(vector) && dist({ x: px, y: py }, e) <= hitRadius) {
          return { vector, kind: "end", start, end };
        }
        if (!isSteerVector(vector) && distanceToSegment(point, s, e) <= 8) {
          return { vector, kind: "body", start, end };
        }
      }
      return null;
    }

    function distanceToSegment(point, a, b) {
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const apx = point.x - a.x;
      const apy = point.y - a.y;
      const denom = abx * abx + aby * aby;
      const t = denom === 0 ? 0 : Math.max(0, Math.min(1, (apx * abx + apy * aby) / denom));
      const cx = a.x + abx * t;
      const cy = a.y + aby * t;
      return Math.hypot(point.x - cx, point.y - cy);
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    let lastPointerWorld = null;

    canvas.addEventListener("pointermove", (event) => {
      const p = canvasPoint(event);
      lastPointerWorld = screenToWorld(p.x, p.y);

      if (drag) {
        if (drag.type === "pan") {
          state.view.offsetX = drag.startOffsetX + (event.clientX - drag.startClientX);
          state.view.offsetY = drag.startOffsetY + (event.clientY - drag.startClientY);
        } else if (drag.type === "vector") {
          const vector = state.vectors.find(v => v.id === drag.vectorId);
          if (!vector) return;
          const world = screenToWorld(p.x, p.y);
          const vehicleVector = getVehicleVector();
          const vehicleEnd = getVehicleEnd(vehicleVector);
          if (drag.kind === "origin") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              vector.x = world.x;
              vector.y = world.y;
            }
          } else if (drag.kind === "end" || drag.kind === "placing") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              const dx = world.x - vector.x;
              const dy = world.y - vector.y;
              vector.length = Math.max(0.01, Math.hypot(dx, dy));
              vector.angle = Math.atan2(dy, dx);
            }
          } else if (drag.kind === "body") {
            if (isSteerVector(vector)) {
              vector.x = vehicleEnd.x;
              vector.y = vehicleEnd.y;
              vector.length = 0.25;
              vector.angle = Math.atan2(world.y - vehicleEnd.y, world.x - vehicleEnd.x);
            } else {
              vector.x = world.x - drag.grabOffset.x;
              vector.y = world.y - drag.grabOffset.y;
            }
          }
          dependentListDirty = true;
        }
        saveState();
        scheduleRender();
        return;
      }

      const hit = findHit(p);
      canvas.style.cursor = hit ? "grab" : "crosshair";
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      const p = canvasPoint(event);
      const world = screenToWorld(p.x, p.y);

      const hit = findHit(p);
      if (hit) {
        dependentListDirty = true;
        state.selectedId = hit.vector.id;
        drag = {
          type: "vector",
          vectorId: hit.vector.id,
          kind: hit.kind,
          grabOffset: hit.kind === "body"
            ? {
              x: world.x - hit.vector.x,
              y: world.y - hit.vector.y
            }
            : null
        };
        saveState();
        scheduleRender();
        return;
      }

      drag = {
        type: "pan",
        startClientX: event.clientX,
        startClientY: event.clientY,
        startOffsetX: state.view.offsetX,
        startOffsetY: state.view.offsetY
      };
      state.selectedId = null;
      dependentListDirty = true;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointerup", () => {
      if (!drag) return;
      if (drag.type === "vector") {
        const vector = state.vectors.find(v => v.id === drag.vectorId);
        if (vector && isSteerVector(vector)) {
          vector.length = 0.25;
        } else if (vector && vector.length < 0.02) {
          vector.length = 0.02;
        }
      }
      drag = null;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("pointercancel", () => {
      drag = null;
      scheduleRender();
    });

    canvas.addEventListener("pointerleave", () => {
      lastPointerWorld = null;
    });

    canvas.addEventListener("dblclick", (event) => {
      const p = canvasPoint(event);
      const hit = findHit(p);
      if (hit) return;
      const world = screenToWorld(p.x, p.y);
      const vector = vectorAtPoint(world, 0, 1.2, `Vector ${state.vectors.length + 1}`, COLORS[state.vectors.length % COLORS.length]);
      state.vectors.push(vector);
      state.selectedId = vector.id;
      dependentListDirty = true;
      saveState();
      scheduleRender();
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const zoomFactor = Math.exp(-event.deltaY * 0.0012);
      const rect = canvas.getBoundingClientRect();
      const cursorX = event.clientX - rect.left;
      const cursorY = event.clientY - rect.top;
      const before = screenToWorld(cursorX, cursorY);
      state.view.scale = Math.max(1e-6, state.view.scale * zoomFactor);
      state.view.offsetX = cursorX - rect.width / 2 - before.x * state.view.scale;
      state.view.offsetY = cursorY - rect.height / 2 + before.y * state.view.scale;
      saveState();
      scheduleRender();
    }, { passive: false });

    function syncInputs() {
      const radius = Number(state.arc?.radius) || 1;
      arcRadiusInput.step = String(getRadiusStep(radius));
      if (document.activeElement !== arcRadiusInput) {
        arcRadiusInput.value = formatRadiusValue(radius);
      }
      const deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      const deltaPsiDegrees = normalizeDeltaPsiDegrees(radToDeg(deltaPsi));
      arcAngleInput.step = String(getDeltaPsiStep(deltaPsiDegrees));
      if (document.activeElement !== arcAngleInput) {
        arcAngleInput.value = formatDeltaPsiDegreesValue(deltaPsiDegrees);
      }
      const steerMax = normalizeSteerMax(getSimpleArcSteerMax());
      const steerMaxDegrees = normalizeSteerMaxDegrees(radToDeg(steerMax));
      arcSteerMaxInput.step = String(getSteerMaxStepDegrees(steerMaxDegrees));
      if (document.activeElement !== arcSteerMaxInput) {
        arcSteerMaxInput.value = formatSteerMaxValue(steerMaxDegrees);
      }
      const complexShadowCount = getShadowCountFromHeadingChange(Number(state.simpleArcSolution?.turnAngle) || getSimpleArcGeometry().turnAngle, 10, 3);
      const simpleShadowCount = getShadowCountFromHeadingChange(Number(state.simpleArcSolution?.simpleCurve?.turnAngle) || getSimpleArcGeometry().turnAngle, 10, 2);
      arcComplexShadowCountInput.value = String(complexShadowCount);
      arcSimpleShadowCountInput.value = String(simpleShadowCount);
    }

    function recalculateVehicleSolution(options = {}) {
      const persist = options.persist !== false;
      const render = options.render !== false;
      if (debugData) {
        debugData.textContent = "";
      }
      const activeVehicle = getActiveVehicle();
      const arc = getSimpleArcGeometry();
      const vehicleVector = getVehicleVector();
      const geometry = {
        ...getVehicleGeometry(),
        radius: Number(arc.radius) || 0,
        headingChange: Number(arc.turnAngle) || 0
      };
      const solved = solveVehicleSlForBisectorAlignment(vehicleVector, {
        initialSl: getSolverInitialSl(activeVehicle?.sl),
        maxSpan: Number.isFinite(Number(geometry?.maxHeadingChange))
          ? Math.abs(Number(geometry.maxHeadingChange))
          : 128,
        geometry
      });
      const evaluation = solved?.evaluation || null;
      const terminalPose = evaluation?.endPose || null;
      const vc = evaluation?.cor || evaluation?.intersection || null;
      const bisector = getSimpleArcBisectorGeometry(arc);
      const terminalPoseForCurve = terminalPose ? {
        x: Number(terminalPose.x) || 0,
        y: Number(terminalPose.y) || 0,
        angle: Number(terminalPose.angle) || 0,
        theta: Number(solved?.theta ?? solved?.sl) || 0
      } : null;
      const complexTerminalPose = evaluation?.complexTerminalPose || terminalPoseForCurve || terminalPose || null;
      const complexVc = evaluation?.complexVc || vc || null;
      const terminalRadius = getDerivedTerminalRadius(complexTerminalPose, complexVc, Number(arc.radius) || 0);
      const simpleCurve = buildSimpleCurveGeometry({
        terminalPose: terminalPoseForCurve,
        vc,
        bisector
      });
      const finalPose = simpleCurve?.endPose || terminalPoseForCurve || null;
      const positionError = Number(solved?.rearDistance);
      const headingError = Number.isFinite(Number(solved?.bodyAngleError))
        ? Math.abs(Number(solved.bodyAngleError))
        : (Number.isFinite(Number(solved?.bodyAlignment))
          ? Math.abs(Math.asin(clamp(Number(solved.bodyAlignment) || 0, -1, 1)))
          : NaN);
      const headingNormalAngle = finalPose ? normalizePositiveAngle(Number(finalPose.angle) + Math.PI / 2) : NaN;
      const bisectorHeading = bisector?.valid ? normalizePositiveAngle(bisector.bisectorAngle) : NaN;
      const headingNormalError = Number.isFinite(headingNormalAngle) && Number.isFinite(bisectorHeading)
        ? Math.abs(wrapAngle(headingNormalAngle - bisectorHeading))
        : NaN;
      const success = Boolean(solved?.success)
        && Number.isFinite(positionError)
        && Number.isFinite(headingError)
        && Math.abs(positionError) <= 1e-7
        && headingError <= 1e-6;
      const result = {
        success,
        edgeCase: false,
        edgeCaseReason: null,
        radius: Number(arc.radius) || 0,
        arcLength: Number(arc.arcLength) || 0,
        s: Number(solved?.curveLength) || 0,
        slew: Number(solved?.slew ?? solved?.sl) || 0,
        sl: Number(solved?.sl) || 0,
        turnAngle: Number(solved?.headingChange) || 0,
        theta: Number(solved?.theta ?? terminalPoseForCurve?.theta) || 0,
        finalHeading: Number(finalPose?.angle) || 0,
        curveLength: Number(solved?.curveLength) || 0,
        complexCurveLength: Number(solved?.curveLength) || 0,
        steeredWheelTravelDistance: Number(solved?.steeredWheelTravelDistance ?? solved?.curveLength) || 0,
        simpleCurveLength: Number(simpleCurve?.arcLength) || 0,
        totalTravelDistance: (Number(solved?.curveLength) || 0) + (Number(simpleCurve?.arcLength) || 0),
        spTravelDistance: Number(solved?.curveLength) || 0,
        positionError: Number.isFinite(positionError) ? Math.abs(positionError) : NaN,
        headingError,
        headingNormalAngle,
        headingNormalError,
        headingNormalSatisfied: Number.isFinite(headingNormalError) && headingNormalError <= 1e-5,
        vc,
        terminalPose: finalPose,
        finalPose,
        complexTerminalPose,
        complexVc,
        terminalRadius,
        terminalCoord: finalPose ? createCoord(finalPose.x, finalPose.y, finalPose.angle, 1, "Rp", "#7dd3fc") : null,
        complexCurve: {
          valid: Boolean(arc?.valid),
          center: { ...arc.center },
          radius: Number(arc.radius) || 0,
          startAngle: Number(arc.startAngle) || 0,
          endAngle: Number(arc.endAngle) || 0,
          turnAngle: Number(arc.turnAngle) || 0,
          arcLength: Number(arc.arcLength) || 0,
          pathPoints: sampleSimpleArcPoints(arc),
          terminalPose: terminalPoseForCurve,
          vc,
          bisector
        },
        simpleCurve,
        pathPoints: Array.isArray(simpleCurve?.pathPoints) ? simpleCurve.pathPoints : [],
        bisector,
        steerMax: Number(arc.steerMax) || 0,
        passes: Array.isArray(solved?.passes)
          ? solved.passes
          : (solved?.evaluation ? [solved.evaluation] : [])
      };
      state.simpleArcSolution = result;
      state.arc.deltaPsi = getSimpleArcDeltaPsi();
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncVehicleShadows(result);
      if (activeVehicle) {
        activeVehicle.finalPose = result?.terminalPose ? { ...result.terminalPose } : null;
        if (Number.isFinite(Number(result?.sl))) {
          activeVehicle.sl = Number(result.sl);
        }
      }
      dependentListDirty = true;
      syncInputs();
      if (persist) saveState();
      if (render) scheduleRender();
      return result;
    }

    arcRadiusInput.addEventListener("input", () => {
      const value = Number(arcRadiusInput.value);
      state.arc.radius = clamp(value || 0, -100, 100);
      syncInputs();
      recalculateVehicleSolution();
    });

    arcRadiusInput.addEventListener("blur", () => {
      state.arc.radius = normalizeRadiusValue(state.arc.radius);
      syncInputs();
      recalculateVehicleSolution();
    });

    arcRadiusInput.addEventListener("focus", () => {
      const radius = Number(state.arc?.radius) || 1;
      arcRadiusInput.step = String(getRadiusStep(radius));
      arcRadiusInput.value = formatRadiusValue(radius);
      arcRadiusInput.select();
    });
    arcAngleInput.addEventListener("input", () => {
      const value = Number(arcAngleInput.value);
      state.arc.deltaPsi = degToRad(normalizeDeltaPsiDegrees(Number.isFinite(value) ? value : 0));
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution();
    });

    arcAngleInput.addEventListener("blur", () => {
      state.arc.deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution();
    });

    arcAngleInput.addEventListener("focus", () => {
      const deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      arcAngleInput.value = formatDeltaPsiDegreesValue(normalizeDeltaPsiDegrees(radToDeg(deltaPsi)));
      arcAngleInput.select();
    });

    arcSteerMaxInput.addEventListener("input", () => {
      const value = Number(arcSteerMaxInput.value);
      const degrees = Number.isFinite(value) ? value : 90;
      const normalizedDegrees = normalizeSteerMaxDegrees(degrees);
      state.arc.steerMax = normalizeSteerMax(degToRad(normalizedDegrees));
      arcSteerMaxInput.step = String(getSteerMaxStepDegrees(normalizedDegrees));
      syncInputs();
      recalculateVehicleSolution();
    });

    arcSteerMaxInput.addEventListener("focus", () => {
      const steerMax = normalizeSteerMax(getSimpleArcSteerMax());
      const steerMaxDegrees = normalizeSteerMaxDegrees(radToDeg(steerMax));
      arcSteerMaxInput.step = String(getSteerMaxStepDegrees(steerMaxDegrees));
      arcSteerMaxInput.value = formatSteerMaxValue(steerMaxDegrees);
      arcSteerMaxInput.select();
    });

    arcSteerMaxInput.addEventListener("blur", () => {
      state.arc.steerMax = normalizeSteerMax(state.arc.steerMax);
      syncInputs();
      recalculateVehicleSolution();
    });

    window.addEventListener("keydown", (event) => {
      if ((event.key === "Delete" || event.key === "Backspace") && state.selectedId) {
        const selected = state.vectors.find(v => v.id === state.selectedId) || null;
        state.vectors = state.vectors.filter(v => v.id !== state.selectedId);
        state.selectedId = null;
        dependentListDirty = true;
        saveState();
        scheduleRender();
      }
    });

    window.addEventListener("resize", () => {
      if (setupCanvas()) {
        scheduleRender();
      }
    });

    const canvasResizeObserver = typeof ResizeObserver === "function"
      ? new ResizeObserver(() => {
          if (setupCanvas()) {
            scheduleRender();
          }
        })
      : null;
    if (canvasResizeObserver) {
      canvasResizeObserver.observe(canvas);
    }

    function fitView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [0];
      const ys = [0];
      const arc = getSimpleArcGeometry();
      if (arc.valid) {
        const arcPoints = sampleSimpleArcPoints(arc, 48);
        xs.push(0, arc.center.x, ...arcPoints.map(point => point.x));
        ys.push(0, arc.center.y, ...arcPoints.map(point => point.y));
      }
      const finalPose = state.simpleArcSolution?.terminalPose || getActiveVehicle()?.finalPose || null;
      if (finalPose) {
        const finalFront = {
          x: (Number(finalPose.x) || 0) + Math.cos(Number(finalPose.angle) || 0),
          y: (Number(finalPose.y) || 0) + Math.sin(Number(finalPose.angle) || 0)
        };
        xs.push(Number(finalPose.x) || 0, finalFront.x);
        ys.push(Number(finalPose.y) || 0, finalFront.y);
      }
      const traces = getSimpleArcPathTraces();
      for (const point of traces.pathPoints) {
        xs.push(Number(point.x) || 0);
        ys.push(Number(point.y) || 0);
      }
      const simpleTraces = getSimpleCurvePathTraces();
      for (const point of simpleTraces.pathPoints) {
        xs.push(Number(point.x) || 0);
        ys.push(Number(point.y) || 0);
      }
      for (const copy of state.vehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const theta = Number(copy.theta) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle),
          y: rear.y + Math.sin(bodyAngle)
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + theta) * 0.25,
          y: front.y + Math.sin(bodyAngle + theta) * 0.25
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      for (const copy of state.simpleVehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const theta = Number(copy.theta) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle),
          y: rear.y + Math.sin(bodyAngle)
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + theta) * 0.25,
          y: front.y + Math.sin(bodyAngle + theta) * 0.25
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      for (const vector of state.vectors) {
        const { start, end } = vectorEndpoints(vector);
        xs.push(start.x, end.x);
        ys.push(start.y, end.y);
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.4, rangeXRaw * 0.08);
      const paddingY = Math.max(0.4, rangeYRaw * 0.08);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.96);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function fitVehicleSequenceView() {
      const rect = canvas.getBoundingClientRect();
      const xs = [];
      const ys = [];
      const vehicleWidth = 1;
      const steerLength = 0.25;
      for (const copy of state.vehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const theta = Number(copy.theta) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle) * vehicleWidth,
          y: rear.y + Math.sin(bodyAngle) * vehicleWidth
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + theta) * steerLength,
          y: front.y + Math.sin(bodyAngle + theta) * steerLength
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      for (const copy of state.simpleVehicleCopies) {
        const rear = { x: Number(copy.x) || 0, y: Number(copy.y) || 0 };
        const bodyAngle = Number(copy.angle) || 0;
        const theta = Number(copy.theta) || 0;
        const front = {
          x: rear.x + Math.cos(bodyAngle) * vehicleWidth,
          y: rear.y + Math.sin(bodyAngle) * vehicleWidth
        };
        const steerEnd = {
          x: front.x + Math.cos(bodyAngle + theta) * steerLength,
          y: front.y + Math.sin(bodyAngle + theta) * steerLength
        };
        xs.push(rear.x, front.x, steerEnd.x);
        ys.push(rear.y, front.y, steerEnd.y);
      }
      if (!xs.length || !ys.length) {
        return;
      }
      const minXRaw = Math.min(...xs);
      const maxXRaw = Math.max(...xs);
      const minYRaw = Math.min(...ys);
      const maxYRaw = Math.max(...ys);
      const rangeXRaw = Math.max(0.01, maxXRaw - minXRaw);
      const rangeYRaw = Math.max(0.01, maxYRaw - minYRaw);
      const paddingX = Math.max(0.25, rangeXRaw * 0.06);
      const paddingY = Math.max(0.25, rangeYRaw * 0.06);
      const minX = minXRaw - paddingX;
      const maxX = maxXRaw + paddingX;
      const minY = minYRaw - paddingY;
      const maxY = maxYRaw + paddingY;
      const rangeX = Math.max(0.01, maxX - minX);
      const rangeY = Math.max(0.01, maxY - minY);
      const scaleX = rect.width / rangeX;
      const scaleY = rect.height / rangeY;
      state.view.scale = Math.max(1e-6, Math.min(scaleX, scaleY) * 0.98);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.view.offsetX = -centerX * state.view.scale;
      state.view.offsetY = centerY * state.view.scale;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function initialize() {
      if (initialized) return;
      renderStatus.textContent = "Render: booting";
      if (!setupCanvas()) {
        renderStatus.textContent = "Render: waiting for layout";
        requestAnimationFrame(initialize);
        return;
      }
      initialized = true;
      state.Vehicles[0] = createAnchorVehicle(getSolverInitialSl(state.Vehicles[0]?.sl));
      enforceVectorAnchor();
      state.ui.vehicle = true;
      state.arc.deltaPsi = normalizeDeltaPsi(getSimpleArcDeltaPsi());
      state.arc.angle = state.arc.deltaPsi;
      state.arc.length = getSimpleArcLength();
      syncInputs();
      recalculateVehicleSolution({ persist: false, render: false });
      fitView();
      setupCanvas();
      saveState();
      scheduleRender();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  </script>
</body>
</html>
