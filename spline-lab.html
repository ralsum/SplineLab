<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spline-Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --bg-2: #0c1224;
      --panel: rgba(13, 18, 34, 0.92);
      --panel-strong: rgba(18, 25, 46, 0.98);
      --line: rgba(157, 173, 212, 0.18);
      --line-strong: rgba(157, 173, 212, 0.28);
      --text: #edf3ff;
      --muted: #95a2c9;
      --accent: #7dd3fc;
      --accent-2: #7ef0bf;
      --warn: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(126, 240, 191, 0.12), transparent 24%),
        linear-gradient(180deg, #060914 0%, var(--bg) 55%, #05070f 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
      padding: 18px 20px 14px;
    }
    .titlestack {
      display: grid;
      gap: 10px;
      width: 100%;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
    }
    .titleblock h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(125, 211, 252, 0.08);
      color: var(--accent);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .launch-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex: 0 0 320px;
      min-width: 280px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(125, 211, 252, 0.18);
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.10), rgba(18, 25, 46, 0.92));
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }
    .launch-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .launch-label {
      color: var(--accent);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .launch-message {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }
    .launch-meta {
      color: var(--muted);
      font-size: 12px;
    }
    .launch-and-controls {
      display: flex;
      flex: 1 1 760px;
      min-width: 0;
      gap: 14px;
      align-items: stretch;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .control-card {
      flex: 1 1 340px;
      min-width: 300px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(157, 173, 212, 0.18);
      background: rgba(13, 18, 34, 0.90);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(12px);
    }
    .control-card .controls {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }
    .workspace {
      min-height: 0;
      position: relative;
      gap: 14px;
      padding: 0 20px 20px;
    }
    .bottom-row {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      z-index: 6;
      pointer-events: none;
      justify-items: start;
    }
    .pass-panel {
      padding: 16px 20px;
      pointer-events: auto;
      width: 100%;
      max-width: none;
    }
    .stage-shell, .side {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .stage-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      min-height: 0;
    }
    .side {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: min(560px, calc(100vw - 56px));
      z-index: 5;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      background: rgba(13, 18, 34, 0.94);
      backdrop-filter: blur(14px);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }
    .toolbar:empty {
      height: 0;
      min-height: 0;
      padding: 0;
      border-bottom: 0;
      background: none;
      overflow: hidden;
    }
    .stage-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hint {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.02);
    }
    .side-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .side-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.04em;
    }
    .side-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .panel-head .panel-title {
      margin: 0;
    }
    .panel-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mini-button {
      appearance: none;
      border: 1px solid rgba(157, 173, 212, 0.22);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }
    .mini-button:hover {
      background: rgba(125, 211, 252, 0.12);
      border-color: rgba(125, 211, 252, 0.35);
      transform: translateY(-1px);
    }
    .mini-button:active {
      transform: translateY(0);
    }
    .mini-button[data-active="true"] {
      background: rgba(126, 240, 191, 0.14);
      border-color: rgba(126, 240, 191, 0.35);
    }
    .panel {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel:last-child {
      border-bottom: 0;
    }
    .panel-title {
      margin: 0 0 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .controls {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .control {
      flex: 1 1 0;
      min-width: 0;
      display: grid;
      gap: 6px;
    }
    .control.full {
      grid-column: 1 / -1;
    }
    .control.compact {
      gap: 4px;
    }
    .control.compact label {
      font-size: 11px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input[type="number"], input[type="text"], input[type="color"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="range"] {
      width: 100%;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat .k {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .stat .v {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .json {
      width: 100%;
      min-height: 130px;
      max-height: 42vh;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 8, 16, 0.6);
      color: #dce7ff;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .json-output {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      resize: vertical;
    }
    .debug-data {
      margin: 0;
      padding: 10px 12px;
      min-height: 360px;
      max-height: 72vh;
      overflow: auto;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 8, 16, 0.6);
      color: #dce7ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.28;
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }
    @media (max-width: 1080px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .launch-and-controls {
        justify-content: stretch;
      }
      .workspace {
        display: block;
      }
      .stage-shell {
        min-height: 66vh;
      }
      .side {
        position: static;
        width: auto;
        max-height: none;
        margin-top: 14px;
      }
      .bottom-row {
        right: 20px;
      }
      .pass-panel {
        width: auto;
      }
  }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="titlestack">
        <div class="title-row">
          <div class="titleblock">
            <h1>Spline-Lab</h1>
            <div class="eyebrow">Server: Pascal</div>
          </div>
          <div class="launch-and-controls">
            <div class="launch-banner" role="status" aria-live="polite">
              <div class="launch-copy">
                <div class="launch-label">OpenClaw</div>
                <div id="openclawLaunchMessage" class="launch-message">Waiting</div>
              </div>
              <div id="openclawLaunchMeta" class="launch-meta">Waiting for launcher status</div>
            </div>
            <section class="control-card" aria-label="Arc controls">
              <div class="controls">
                <div class="control">
                  <label for="arcRadius">Radius</label>
                  <input id="arcRadius" type="number" min="0.0001" max="1000000" step="0.0001" value="1.0000" inputmode="decimal" />
                </div>
                <div class="control">
                  <label for="arcAngle">Raw Delta Psi (deg)</label>
                  <input id="arcAngle" type="number" min="0.001" max="180" step="0.001" value="90.000" inputmode="decimal" />
                </div>
                <div class="control">
                  <label for="arcSteerMax">Steer Max (SM)</label>
                  <input id="arcSteerMax" type="number" min="22.5" max="90" step="0.001" value="90.000" inputmode="decimal" />
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-shell">
        <div class="toolbar" aria-hidden="true"></div>
        <div class="stage-wrap">
          <canvas id="stage"></canvas>
        </div>
        <div class="hint">
          <div id="coordsReadout">x: 0.00, y: 0.00</div>
          <div id="renderStatus" class="sub" style="margin-top: 8px; font-size: 12px;"></div>
        </div>
      </section>

    </main>

    <div class="bottom-row">
      <section class="panel pass-panel">
        <div class="panel-head">
          <div class="panel-title">Logs</div>
          <div class="panel-actions">
            <button id="nextPassButton" type="button" class="mini-button">Next Pass</button>
          </div>
        </div>
        <pre id="debugData" class="debug-data">No solver trace yet.</pre>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "vehicle-vector-lab-state-v1";
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const arcRadiusInput = document.getElementById("arcRadius");
    const arcAngleInput = document.getElementById("arcAngle");
    const arcSteerMaxInput = document.getElementById("arcSteerMax");
    const debugData = document.getElementById("debugData");
    const nextPassButton = document.getElementById("nextPassButton");
    const jsonOutput = null;
    const copyJsonButton = null;
    const toggleJsonCompactButton = null;
    const coordsReadout = document.getElementById("coordsReadout");
    const renderStatus = document.getElementById("renderStatus");
    const openclawLaunchMessage = document.getElementById("openclawLaunchMessage");
    const openclawLaunchMeta = document.getElementById("openclawLaunchMeta");
    const poseSampleCache = new Map();
    let openclawReloadTimer = 0;
    let jsonCompactView = false;
    let simpleArcFullSolution = null;
    let simpleArcPassIndex = -1;
    let simpleArcHeadingEstimateIndex = 0;
    let simpleArcInnerLoopRunning = false;
    let simpleArcSeedLoopRunning = false;
    const VEHICLE_BODY_LABEL = "Rp";
    const VEHICLE_STEER_LABEL = "Sp";
    const COMPLEX_CURVE_LABEL = "complexCurve";
    const VC_LABEL = "vc";
    const TERMINAL_POSE_LABEL = "terminalPose";
    const COMPLEX_TERMINAL_POSE_LABEL = "complexTerminalPose";
    const STEERED_WHEEL_TRAVEL_DISTANCE_LABEL = "steeredWheelTravelDistance";
    const TERMINAL_RADIUS_LABEL = "terminalRadius";
    const POSITION_ERROR_LABEL = "positionError";
    const HEADING_ERROR_LABEL = "headingError";
    const EDGE_CASE_LABEL = "edgeCase";
    const SWTD_MIN = 0.000001;
    const ESTIMATOR_POSITION_ERROR_THRESHOLD = 0.0000001;
    const ESTIMATOR_HEADING_ERROR_THRESHOLD = 0.0000001;
    const ESTIMATOR_POSITION_DELTA_ERROR_THRESHOLD = ESTIMATOR_POSITION_ERROR_THRESHOLD;
    const ESTIMATOR_HEADING_DELTA_ERROR_THRESHOLD = ESTIMATOR_HEADING_ERROR_THRESHOLD;
    const ESTIMATOR_EXIT_ERROR_THRESHOLD = ESTIMATOR_POSITION_ERROR_THRESHOLD;
    const seedSweepUrlParams = new URLSearchParams(window.location.search);
    const SEED_LOOKUP_BOOTSTRAP_MODE = !seedSweepUrlParams.has("noSeedBootstrap");
    const SEED_LOOKUP_INITIAL_SWTD_MULTIPLIER = 1.05;
    const SEED_LOOKUP_FIXED_RADIUS = 1.0;
    const SEED_LOOKUP_RAW_PSI_MIN_DEGREES = 0;
    const SEED_LOOKUP_RAW_PSI_MAX_DEGREES = 90;
    const SEED_LOOKUP_RAW_PSI_STEP_DEGREES = 5;
    const SEED_LOOKUP_STEER_MAX_DEGREES = 90;
    const SEED_LOOKUP_BOOTSTRAP_ENTRY = {
      radius: SEED_LOOKUP_FIXED_RADIUS,
      rawPsiDegrees: SEED_LOOKUP_RAW_PSI_MAX_DEGREES,
      steerMaxDegrees: SEED_LOOKUP_STEER_MAX_DEGREES,
      swtd: 1.286640028,
      desStrAng: 1.464667296
    };
    const LEGACY_STEER_ANGLE_KEY = ["the", "ta"].join("");
    const LEGACY_DESIRED_STEER_ANGLE_KEY = ["pre", "The", "ta"].join("");
    const LEGACY_PRE_STR_ANGLE_KEY = ["pre", "Str", "Ang"].join("");
    const DEBUG_TABLE_COLUMNS = [
      { label: "hEst#", width: 7, align: "right" },
      { label: "pEst#", width: 7, align: "right" },
      { label: "swtd", width: 16, align: "right" },
      { label: "desStrAng", width: 16, align: "right" },
      { label: "pErr", width: 16, align: "right" },
      { label: "dPErr", width: 16, align: "right" },
      { label: "hErr", width: 16, align: "right" },
      { label: "dHErr", width: 16, align: "right" },
      { label: "X", width: 12, align: "right" },
      { label: "Y", width: 12, align: "right" },
      { label: "Psi", width: 12, align: "right" },
      { label: "strAng", width: 12, align: "right" },
      { label: "pExit", width: 8, align: "right" },
      { label: "aExit", width: 8, align: "right" }
    ];

    const COLORS = ["#7dd3fc", "#7ef0bf", "#fbbf24", "#fb7185", "#c084fc", "#f97316"];
    const randomId = () => {
      if (window.crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    };

    function buildLinearAxis(minValue, maxValue, stepValue) {
      const totalSteps = Math.round((maxValue - minValue) / stepValue);
      const values = [];
      for (let index = 0; index <= totalSteps; index += 1) {
        const value = minValue + (index * stepValue);
        values.push(Number(value.toPrecision(15)));
      }
      return values;
    }

    const SEED_LOOKUP_RAW_PSI_AXIS = buildLinearAxis(
      SEED_LOOKUP_RAW_PSI_MIN_DEGREES,
      SEED_LOOKUP_RAW_PSI_MAX_DEGREES,
      SEED_LOOKUP_RAW_PSI_STEP_DEGREES
    ).reverse();
    const SEED_SWEEP_CHECKPOINT_KEY = "splineLabSeedSweepCheckpoint";
    const SEED_SWEEP_CHECKPOINT_VERSION = 1;
    const SEED_SWEEP_RADIUS_AXIS = buildLinearAxis(-4.8, 7.2, 0.2)
      .map((radiusExponent) => Number(Math.pow(10, radiusExponent).toPrecision(15)));
    const SEED_SWEEP_RAW_PSI_AXIS = SEED_LOOKUP_RAW_PSI_AXIS.slice();
    const SEED_SWEEP_STEER_MAX_DEGREES = SEED_LOOKUP_STEER_MAX_DEGREES;
    const SEED_SWEEP_TOTAL_ENTRIES = SEED_SWEEP_RADIUS_AXIS.length * SEED_SWEEP_RAW_PSI_AXIS.length;
    const seedSweepState = {
      checkpoint: null
    };

    function createSeedSweepCursor(radiusIndex = 0, rawPsiIndex = 0) {
      return {
        radiusIndex: Math.max(0, Math.trunc(Number(radiusIndex) || 0)),
        rawPsiIndex: Math.max(0, Math.trunc(Number(rawPsiIndex) || 0))
      };
    }

    function getSeedSweepEntryKey(radiusIndex, rawPsiIndex) {
      return `${Math.max(0, Math.trunc(Number(radiusIndex) || 0))}|${Math.max(0, Math.trunc(Number(rawPsiIndex) || 0))}`;
    }

    function createSeedSweepCheckpoint(overrides = {}) {
      const cursor = createSeedSweepCursor(
        overrides.cursor?.radiusIndex ?? overrides.radiusIndex ?? 0,
        overrides.cursor?.rawPsiIndex ?? overrides.rawPsiIndex ?? 0
      );
      const completed = overrides.completed && typeof overrides.completed === "object"
        ? { ...overrides.completed }
        : {};
      return {
        version: SEED_SWEEP_CHECKPOINT_VERSION,
        createdAt: overrides.createdAt || new Date().toISOString(),
        updatedAt: overrides.updatedAt || new Date().toISOString(),
        finishedAt: overrides.finishedAt || null,
        cursor,
        completedCount: Number.isFinite(Number(overrides.completedCount))
          ? Number(overrides.completedCount)
          : Object.keys(completed).length,
        totalEntries: SEED_SWEEP_TOTAL_ENTRIES,
        radiusAxis: SEED_SWEEP_RADIUS_AXIS,
        rawPsiAxis: SEED_SWEEP_RAW_PSI_AXIS,
        steerMaxDegrees: SEED_SWEEP_STEER_MAX_DEGREES,
        lastEntry: overrides.lastEntry || null,
        completed
      };
    }

    function normalizeSeedSweepCheckpoint(input) {
      if (!input || typeof input !== "object") {
        return null;
      }
      return createSeedSweepCheckpoint({
        ...input,
        cursor: createSeedSweepCursor(input.cursor?.radiusIndex ?? input.radiusIndex, input.cursor?.rawPsiIndex ?? input.rawPsiIndex),
        completed: input.completed && typeof input.completed === "object" ? input.completed : {}
      });
    }

    function loadSeedSweepCheckpoint() {
      try {
        const raw = localStorage.getItem(SEED_SWEEP_CHECKPOINT_KEY);
        if (!raw) return null;
        return normalizeSeedSweepCheckpoint(JSON.parse(raw));
      } catch {
        return null;
      }
    }

    function saveSeedSweepCheckpoint(checkpoint = seedSweepState.checkpoint) {
      const normalized = normalizeSeedSweepCheckpoint(checkpoint);
      if (!normalized) {
        return null;
      }
      normalized.updatedAt = new Date().toISOString();
      seedSweepState.checkpoint = normalized;
      try {
        localStorage.setItem(SEED_SWEEP_CHECKPOINT_KEY, JSON.stringify(normalized));
      } catch {
        // Best-effort only; the durable checkpoint file is written by the external runner.
      }
      return normalized;
    }

    function getSeedSweepProgress(checkpoint = seedSweepState.checkpoint) {
      const normalized = normalizeSeedSweepCheckpoint(checkpoint);
      const completedCount = Number(normalized?.completedCount) || 0;
      return {
        completedCount,
        totalEntries: SEED_SWEEP_TOTAL_ENTRIES,
        remainingCount: Math.max(0, SEED_SWEEP_TOTAL_ENTRIES - completedCount),
        radiusIndex: Number(normalized?.cursor?.radiusIndex) || 0,
        rawPsiIndex: Number(normalized?.cursor?.rawPsiIndex) || 0
      };
    }

    function isSeedSweepComplete(checkpoint = seedSweepState.checkpoint) {
      const progress = getSeedSweepProgress(checkpoint);
      return progress.completedCount >= progress.totalEntries;
    }

    function summarizeSeedSweepResult(result, seed = {}) {
      const passes = Array.isArray(result?.passes) ? result.passes : [];
      const finalPass = passes.length ? passes[passes.length - 1] : null;
      const pErr = Number(finalPass?.pErr ?? result?.pErr);
      const hErr = Number(finalPass?.hErr ?? result?.hErr);
      const pExit = Number(finalPass?.pExitCode ?? finalPass?.exitCode ?? result?.exitCode ?? NaN);
      const aExit = Number(finalPass?.aExitCode ?? result?.desStrAngExitCode ?? NaN);
      return {
        passCount: passes.length,
        finalPass,
        pErr: Number.isFinite(pErr) ? pErr : null,
        hErr: Number.isFinite(hErr) ? hErr : null,
        pExit: Number.isFinite(pExit) ? pExit : null,

    seedSweepState.checkpoint = loadSeedSweepCheckpoint() || createSeedSweepCheckpoint();

    const seedLookupState = {

    function createCoord(X = 0, Y = 0, Psi = 0, length = 1, label = "Coord", color = "#7dd3fc") {

    function createVehicle(overrides = {}) {

    function readStrAng(source, fallback = 0) {

    function createAnchorVehicle(sl = Math.PI / 4) {

    function createDefaultState() {

        Vehicles: [createAnchorVehicle()],

    function loadState() {

        const normalizedVehicles = parsedVehicles.length

            shadowCountComplex: Number.isFinite(Number(parsed.arc?.shadowCountComplex))

            shadowCountSimple: Number.isFinite(Number(parsed.arc?.shadowCountSimple))
              ? Number(parsed.arc.shadowCountSimple)

            steerMax: normalizeSteerMax(Number.isFinite(Number(parsed.arc?.steerMax))
              ? Number(parsed.arc.steerMax)

            deltaPsi: snapDeltaPsiToWholeDegrees(Number.isFinite(Number(parsed.arc?.deltaPsi))

            angle: snapDeltaPsiToWholeDegrees(Number.isFinite(Number(parsed.arc?.deltaPsi))
              ? Number(parsed.arc.deltaPsi)
              : (Number.isFinite(Number(parsed.arc?.angle))
                ? Number(parsed.arc.angle)
                : (Number.isFinite(Number(parsed.arc?.length)) && Number.isFinite(Number(parsed.arc?.radius))

            length: Math.abs(Number(Number.isFinite(Number(parsed.arc?.radius)) ? Number(parsed.arc.radius) : defaultState.arc.radius))

                ? Number(parsed.arc.deltaPsi)
                : (Number.isFinite(Number(parsed.arc?.angle))
                  ? Number(parsed.arc.angle)
                  : (Number.isFinite(Number(parsed.arc?.length)) && Number.isFinite(Number(parsed.arc?.radius))

    function normalizeCoord(coord, defaults = {}) {
      const X = Number.isFinite(Number(coord?.X)) ? Number(coord.X) : (Number.isFinite(Number(coord?.x)) ? Number(coord.x) : Number(defaults.X) || 0);
      const Y = Number.isFinite(Number(coord?.Y)) ? Number(coord.Y) : (Number.isFinite(Number(coord?.y)) ? Number(coord.y) : Number(defaults.Y) || 0);
      const Psi = Number.isFinite(Number(coord?.Psi)) ? Number(coord.Psi) : (Number.isFinite(Number(coord?.angle)) ? Number(coord.angle) : Number(defaults.Psi) || 0);
      const length = Number.isFinite(Number(coord?.length)) ? Number(coord.length) : (Number.isFinite(Number(defaults.length)) ? Number(defaults.length) : 1);
      const label = coord?.label || defaults.label || "Coord";
      const color = coord?.color || defaults.color || "#7dd3fc";
      return createCoord(X, Y, Psi, length, label, color);
    }

    function normalizeVehicle(vehicle) {
      const raw = vehicle || {};
      const rpSource = raw.Rp || raw.rp || raw.rear || raw;
      const spSource = raw.Sp || raw.sp || {};
      const rp = normalizeCoord(rpSource, { label: VEHICLE_BODY_LABEL, length: 1, color: "#7dd3fc" });
      const sp = normalizeCoord(spSource, { label: VEHICLE_STEER_LABEL, length: 0.25, color: "#fbbf24" });
      if (!Number.isFinite(Number(spSource?.Psi)) && Number.isFinite(Number(raw.headingChange))) {

    function limitSwtdMinimum(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return SWTD_MIN;
      return Math.max(SWTD_MIN, numeric);
    }

    function normalizeSwtdValue(value) {
      return Number(clamp(limitSwtdMinimum(value), SWTD_MIN, 1000).toFixed(6));
    }

    function getSwtdStep(value) {
      const magnitude = Math.abs(Number(value) || 0);
      if (magnitude < 0.01) return 0.001;
      if (magnitude < 0.1) return 0.01;
      if (magnitude < 1) return 0.1;
      return 1;
    }

    function getDeltaPsiMaxDegrees() {
      return 180;
    }

    function applyOpenClawStatus(message) {
      const text = (message || "").trim() || "Waiting";
      const lower = text.toLowerCase();
      if (openclawLaunchMessage) {
        openclawLaunchMessage.textContent = lower.includes("ready") ? "Attached" : "Waiting";
      }
      if (openclawLaunchMeta) {
        if (lower.includes("ready")) {
          openclawLaunchMeta.textContent = "CDP + Playwright";
        } else if (lower.includes("timed out") || lower.includes("error")) {
          openclawLaunchMeta.textContent = "Launcher problem";
        } else {
          openclawLaunchMeta.textContent = "Chrome and MCP";
        }
      }
    }

    function scheduleOpenClawReload() {
      if (openclawReloadTimer) {
        return;
      }
      openclawReloadTimer = window.setTimeout(() => {
        openclawReloadTimer = 0;
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("_ocReload", String(Date.now()));
        window.location.replace(nextUrl.toString());
      }, 2000);

    function clearOpenClawReload() {

    async function refreshOpenClawStatus() {
      try {
        const response = await fetch("/api/openclaw-status", { cache: "no-store" });
        if (!response.ok) {

        const payload = await response.json();

        applyOpenClawStatus(payload?.message);

        scheduleOpenClawReload();
